# ES only. Never use this file to recreate existing Web/PG/cron services.
services:
  elasticsearch:
    image: ${ES_IMAGE:?Set reviewed plugin image repository@sha256 digest}
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    environment:
      discovery.type: single-node
      cluster.name: katrain-kifu-search
      node.name: kifu-search
      xpack.security.enabled: 'true'
      xpack.security.autoconfiguration.enabled: 'false'
      xpack.security.http.ssl.enabled: 'true'
      xpack.security.http.ssl.key: certs/http.key
      xpack.security.http.ssl.certificate: certs/http.crt
      xpack.security.http.ssl.certificate_authorities: certs/ca.crt
      xpack.security.transport.ssl.enabled: 'true'
      xpack.security.transport.ssl.key: certs/http.key
      xpack.security.transport.ssl.certificate: certs/http.crt
      xpack.security.transport.ssl.certificate_authorities: certs/ca.crt
      xpack.security.transport.ssl.verification_mode: certificate
      bootstrap.memory_lock: 'true'
      ELASTIC_PASSWORD_FILE: /run/secrets/elastic_password
    ports:
      - '127.0.0.1:9200:9200'
    volumes:
      - ${ES_DATA_DIR:?Set host data path with verified free-space budget}:/usr/share/elasticsearch/data
      - ${ES_CERTS_DIR:?Set private CA/certificate directory}:/usr/share/elasticsearch/config/certs:ro
      - ./jvm.options:/usr/share/elasticsearch/config/jvm.options.d/kifu.options:ro
      - ./log4j2.properties:/usr/share/elasticsearch/config/log4j2.properties:ro
    secrets:
      - elastic_password
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65535, hard: 65535}
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
    networks:
      - kifu_search
secrets:
  elastic_password:
    file: ${ES_BOOTSTRAP_PASSWORD_FILE:?Set private bootstrap password file}
networks:
  kifu_search:
    name: ${ES_NETWORK_NAME:-kifu-search-private}
