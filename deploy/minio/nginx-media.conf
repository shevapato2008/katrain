# nginx reverse proxy for MinIO media (D6): exposes the public-read bucket as
#   https://media.<domain>/tutorial-assets/<key>
# while MinIO's raw :9000 / :9001 stay bound to 127.0.0.1 (never public).
#
# Install: copy to /etc/nginx/sites-available/media.<domain>.conf, edit
# server_name + the TLS cert paths + the Referer allow-list, then:
#   ln -s ../sites-available/media.<domain>.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# TLS: obtain a cert first, e.g. `certbot --nginx -d media.<domain>`.

# Allow-list of Referers permitted to hot-link media (anti-leech, D7).
# "" (empty) lets direct hits / <video> tag requests through (they often send no Referer).
map $http_referer $media_allowed {
    default                                 0;
    ""                                      1;
    "~*^https?://([a-z0-9-]+\.)?your-domain\.com"  1;   # <-- EDIT: your web + kiosk origins
}

server {
    listen 443 ssl http2;
    server_name media.your-domain.com;                  # <-- EDIT

    ssl_certificate     /etc/letsencrypt/live/media.your-domain.com/fullchain.pem;   # <-- EDIT
    ssl_certificate_key /etc/letsencrypt/live/media.your-domain.com/privkey.pem;     # <-- EDIT

    # Videos can be large-ish; don't buffer whole objects, stream them.
    proxy_buffering off;
    client_max_body_size 0;

    location / {
        if ($media_allowed = 0) { return 403; }

        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Range requests for video seeking must pass through untouched.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_http_version 1.1;
    }
}

# Optional: serve the MinIO admin console at https://media-console.<domain>
# ONLY behind auth / IP allow-list. Prefer an SSH tunnel to 127.0.0.1:9001 instead.
