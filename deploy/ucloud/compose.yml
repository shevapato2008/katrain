name: katrain-ucloud

x-service-defaults: &service-defaults
  restart: unless-stopped
  mem_limit: 2g
  cpus: 0.75
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  postgres:
    <<: *service-defaults
    image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    environment:
      POSTGRES_DB: ${KATRAIN_DB_NAME:-katrain_db}
      POSTGRES_USER: ${KATRAIN_DB_USER:-katrain_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  minio:
    <<: *service-defaults
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    ports:
      - ${WG_BIND_IP:?WG_BIND_IP is required}:9000:9000
      - 127.0.0.1:9001:9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  minio-setup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:-tutorial-assets}
    volumes:
      - ./minio/bootstrap.sh:/bootstrap.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  katrain-web:
    restart: unless-stopped
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    user: "10001:10001"
    environment:
      KATRAIN_DATABASE_URL: postgresql://${KATRAIN_DB_USER:-katrain_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${KATRAIN_DB_NAME:-katrain_db}
      KATRAIN_SECRET_KEY: ${KATRAIN_SECRET_KEY:?KATRAIN_SECRET_KEY is required}
      KATRAIN_PREVIEW_MODE: "1"
      LOCAL_KATAGO_URL: http://katago-web:8000
      CLOUD_KATAGO_URL: ""
      KATRAIN_STORAGE_BACKEND: s3
      KATRAIN_S3_ENDPOINT_URL: http://minio:9000
      KATRAIN_S3_BUCKET: ${S3_BUCKET:-tutorial-assets}
      KATRAIN_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      KATRAIN_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      KATRAIN_S3_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:?MEDIA_PUBLIC_BASE_URL is required}
      KATRAIN_S3_USE_PRESIGNED: "false"
    volumes:
      - katrain-state-preview:/home/katrain/.katrain
    ports:
      - 127.0.0.1:8001:8001
      - ${WG_BIND_IP:?WG_BIND_IP is required}:8001:8001
    depends_on:
      postgres:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      katago-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 4g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - app
      - backend

  katrain-cron:
    profiles: [production]
    restart: unless-stopped
    image: ${CRON_IMAGE:?CRON_IMAGE is required}
    command: ["python", "-m", "katrain.cron"]
    environment:
      KATRAIN_DATABASE_URL: postgresql://${KATRAIN_DB_USER:-katrain_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${KATRAIN_DB_NAME:-katrain_db}
      KATAGO_URL: http://katago-cron:8000
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      CRON_LOG_LEVEL: INFO
      CRON_REPORT_ANALYZE_ENABLED: "true"
      CRON_REPORT_CONCURRENCY: "3"
      KATRAIN_S3_ENDPOINT_URL: http://minio:9000
      KATRAIN_S3_BUCKET: ${S3_BUCKET:-tutorial-assets}
    depends_on:
      postgres:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      katago-cron:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 4g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - app
      - backend

  katago-web:
    restart: unless-stopped
    image: ${KATAGO_IMAGE:?KATAGO_IMAGE is required}
    command: ["python3", "-m", "realtime_api.main"]
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      KATAGO_CONFIG_FILE: /app/config.yaml
    ports:
      - 127.0.0.1:8000:8000
      - ${WG_BIND_IP:?WG_BIND_IP is required}:8000:8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    mem_limit: 8g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - app

  katago-cron:
    restart: unless-stopped
    image: ${KATAGO_IMAGE:?KATAGO_IMAGE is required}
    command: ["python3", "-m", "realtime_api.main"]
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      KATAGO_CONFIG_FILE: /app/config.yaml
    ports:
      - 127.0.0.1:8002:8000
      - ${WG_BIND_IP:?WG_BIND_IP is required}:8002:8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    mem_limit: 20g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks:
      - app

volumes:
  postgres-data:
  minio-data:
  katrain-state-preview:
  katrain-state-production:

networks:
  app:
  backend:
    internal: true
