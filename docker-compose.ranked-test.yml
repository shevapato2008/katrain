name: katrain-xiangqi-ranked-test

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: xiangqi_ranked_test
      POSTGRES_USER: xiangqi_ranked_test
      POSTGRES_PASSWORD: xiangqi_ranked_test_password
    ports:
      - "127.0.0.1:${XIANGQI_RANKED_PG_PORT:-55439}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiangqi_ranked_test -d xiangqi_ranked_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - xiangqi-ranked-test-net

networks:
  xiangqi-ranked-test-net:
    name: "${COMPOSE_PROJECT_NAME:-katrain-xiangqi-ranked-test}-net"
