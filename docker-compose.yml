# KaTrain Application Services
# Only katrain-web and katrain-cron
#
# Prerequisites (run separately):
#   - PostgreSQL (port 5432)
#   - KataGo web instance (port 8000) - for user gameplay
#   - KataGo cron instance (port 8002) - for batch analysis
#
# Usage:
#   docker-compose up -d
#
# Environment variables (create .env file or export):
#   POSTGRES_PASSWORD=your_db_password
#   DASHSCOPE_API_KEY=your_dashscope_api_key
#   MINIO_ROOT_USER / MINIO_ROOT_PASSWORD   (object storage admin creds)
#   MEDIA_PUBLIC_BASE_URL=https://media.<domain>/tutorial-assets  (nginx-reverse-proxied MinIO)

services:
  # ── Object storage for tutorial media (phase 1: self-hosted MinIO ≡ phase 2: Aliyun OSS) ──
  minio:
    image: minio/minio:latest
    container_name: katrain-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    # :9000 binds to MINIO_BIND_IP (default 127.0.0.1; prod sets the WireGuard IP so the nginx
    # gateway can reach it over wg — still off the public internet, D6). Console :9001 stays loopback.
    ports:
      - "${MINIO_BIND_IP:-127.0.0.1}:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-katrain_minio_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minio_secure_password_CHANGE_ME}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: create bucket + set anonymous read (D7). Exits 0 when done.
  minio-setup:
    image: minio/mc:latest
    container_name: katrain-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-katrain_minio_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minio_secure_password_CHANGE_ME}
      - S3_BUCKET=${S3_BUCKET:-tutorial-assets}
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    volumes:
      - ./deploy/minio/bootstrap.sh:/bootstrap.sh:ro
    restart: "no"

  katrain-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: katrain-web
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./data/tutorial_assets:/app/data/tutorial_assets
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - KATRAIN_SECRET_KEY=${KATRAIN_SECRET_KEY:?KATRAIN_SECRET_KEY 必须在 .env 里设置}
      - KATRAIN_DATABASE_URL=postgresql://katrain_user:${POSTGRES_PASSWORD:-katrain_secure_password_CHANGE_ME}@host.docker.internal:5432/katrain_db
      - LOCAL_KATAGO_URL=http://host.docker.internal:8000
      # Media storage → MinIO (S3). Swap these for Aliyun OSS values in phase 2 (no code change).
      - KATRAIN_STORAGE_BACKEND=${KATRAIN_STORAGE_BACKEND:-s3}
      - KATRAIN_S3_ENDPOINT_URL=${KATRAIN_S3_ENDPOINT_URL:-http://minio:9000}
      - KATRAIN_S3_BUCKET=${S3_BUCKET:-tutorial-assets}
      - KATRAIN_S3_ACCESS_KEY=${MINIO_ROOT_USER:-katrain_minio_admin}
      - KATRAIN_S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minio_secure_password_CHANGE_ME}
      - KATRAIN_S3_PUBLIC_BASE_URL=${MEDIA_PUBLIC_BASE_URL:-http://localhost:9000/tutorial-assets}
      - KATRAIN_S3_USE_PRESIGNED=false
    extra_hosts:
      - "host.docker.internal:host-gateway"

  katrain-cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    container_name: katrain-cron
    restart: unless-stopped
    volumes:
      - ./data/tutorial_backups:/app/data/tutorial_backups
    environment:
      - KATRAIN_SECRET_KEY=${KATRAIN_SECRET_KEY:?KATRAIN_SECRET_KEY 必须在 .env 里设置}
      - KATRAIN_DATABASE_URL=postgresql://katrain_user:${POSTGRES_PASSWORD:-katrain_secure_password_CHANGE_ME}@host.docker.internal:5432/katrain_db
      - KATAGO_URL=http://host.docker.internal:8002
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - CRON_LOG_LEVEL=INFO
      - CRON_REPORT_ANALYZE_ENABLED=true
      - CRON_REPORT_CONCURRENCY=3
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  minio-data:
