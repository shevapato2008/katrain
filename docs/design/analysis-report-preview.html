<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">

  <link rel="stylesheet" href="../../katrain/web/ui/src/kiosk-shell/fonts.css">
  <title>分析报告 · 组件细节预览</title>
  <style>
    :root { color-scheme:dark; --page:#0f0f0f; --paper:#252525; --ink:#1a1a1a; --line:rgba(255,255,255,.10); --strong:#f5f3f0; --muted:#b8b5b0; --jade:#4a6b5c; --jade-dark:#2f4539; --good:#8fdfad; --amber:#ff9800; --bad:#e16b5c; font-family:'LXGW WenKai',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--page); color:var(--strong); }
    button,input { font:inherit; } button { cursor:pointer; } button:disabled { cursor:default; opacity:.38; }
    button:focus-visible,input:focus-visible { outline:2px solid var(--good); outline-offset:2px; }
    .icon-defs { position:absolute; width:0; height:0; overflow:hidden; }
    .icon { width:21px; height:21px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .app { --rail-floor:320px; display:grid; grid-template-columns:240px minmax(0,1fr) clamp(var(--rail-floor),calc(100vw - 260px - min(1200px,100dvh - 72px)),900px); grid-template-rows:52px minmax(0,1fr); width:100vw; height:100dvh; overflow:hidden; background:var(--page); }
    @media (min-width:1200px) { .app { --rail-floor:360px; } }
    @media (min-width:1536px) { .app { --rail-floor:420px; } }
    @media (min-width:1920px) { .app { --rail-floor:520px; } }
    .top { grid-column:1/-1; grid-row:1; display:flex; align-items:center; justify-content:space-between; padding:0 22px; border-bottom:1px solid #343434; background:var(--paper); font-size:18px; }
    .brand { display:flex; align-items:center; gap:9px; white-space:nowrap; font-weight:600; }
    .brand img { width:32px; height:32px; object-fit:contain; }
    .brand .cn { font-size:22px; font-weight:600; } .brand small { color:var(--strong); font-size:16px; font-weight:600; }
    .kiosk-top-extra { display:none; }
    .preview-tools { display:none; gap:5px; align-items:center; font-size:14px; }
    body[data-preview="true"] .preview-tools { display:flex; }
    .preview-tools button { border:1px solid #59645d; border-radius:5px; background:#26342b; color:#e8f4ea; padding:4px 9px; }
    .preview-tools button[aria-pressed="true"] { background:var(--jade); }
    .side { grid-column:1; grid-row:2; display:flex; flex-direction:column; gap:1px; padding:7px 8px 14px; border-right:1px solid #333; background:var(--paper); font-size:18px; }
    .side a { height:51px; display:flex; align-items:center; gap:16px; padding:0 17px; color:#aaa; text-decoration:none; border-radius:6px; }
    .side a.active { background:#2f4539; color:#f3faf4; font-weight:600; }
    .side a .icon { width:24px; height:24px; }
    .side-spacer { flex:1; } .side-rule { border-top:1px solid #363636; margin:0 -8px 10px; }
    .profile { display:flex; align-items:center; gap:10px; margin:7px 8px 0; min-height:78px; padding:10px; border-radius:12px; background:#111; color:#eee; }
    .avatar { width:36px; height:36px; border-radius:50%; background:#4a6b5c; display:grid; place-items:center; color:#111; font-weight:700; font-size:14px; }
    .profile div:nth-child(2) { flex:1; font-size:16px; } .profile small { display:block; margin-top:2px; color:#58866c; font-size:14px; }
    .stage { grid-column:2; grid-row:2; min-width:0; min-height:0; display:grid; place-items:center; padding:10px; overflow:hidden; background:#101010; }
    .board-frame { position:relative; width:min(100%,calc(100dvh - 72px)); height:auto; aspect-ratio:1; background:#d7ad65; }
    #board { display:block; width:100%; height:100%; cursor:crosshair; }
    .ruler { display:none; }
    .desktop-rail { grid-column:3; grid-row:2; display:grid; grid-template-rows:154px 250px minmax(0,1fr) 140px 58px; gap:8px; min-width:0; min-height:0; padding:8px 20px; background:var(--paper); overflow:hidden; }
    body[data-mode="professional"] .desktop-rail { grid-template-rows:154px 250px minmax(0,1fr) 86px 58px; }
    .panel { min-width:0; min-height:0; overflow:hidden; border:1px solid var(--line); border-radius:12px; background:var(--paper); }
    .meta { display:grid; grid-template-rows:28px 38px 32px 24px; gap:4px; padding:9px 12px; font-size:18px; }
    .meta-title { display:flex; align-items:center; gap:8px; min-width:0; }
    .plain-icon { width:32px; height:32px; border:0; background:transparent; color:var(--strong); display:grid; place-items:center; padding:3px; }
    .meta-title strong { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
    .meta-title time { white-space:nowrap; color:var(--muted); }
    .player-line { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:12px; align-items:center; }
    .player-line .player { display:flex; align-items:center; gap:7px; min-width:0; font-size:18px; font-weight:600; white-space:nowrap; }
    .player-line .player:last-child { justify-content:flex-end; } .player-line .player span { overflow:hidden; text-overflow:ellipsis; }
    .stone-key { display:inline-block; flex:none; width:17px; height:17px; border-radius:50%; background:#090b0a; border:1px solid #b6c1b8; vertical-align:-2px; }
    .stone-key.white { background:#fafafa; border-color:#fff; }
    .lead { color:var(--good); font-size:18px; font-weight:600; white-space:nowrap; }
    .win-line { display:flex; align-items:center; gap:9px; white-space:nowrap; }
    .win-track { flex:1; height:9px; min-width:0; border-radius:99px; overflow:hidden; background:#f4f7f4; }
    .win-track i { display:block; height:100%; width:32.9%; background:#101411; }
    .meta-foot { display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--muted); white-space:nowrap; overflow:hidden; }
    .recs { padding:4px 12px; font-size:18px; }
    .rec-title { display:flex; justify-content:space-between; align-items:center; height:30px; }
    .rec-title .secondary { color:var(--muted); }
    .rec-grid { display:grid; grid-template-columns:minmax(58px,1.15fr) minmax(46px,.85fr) minmax(48px,.9fr) minmax(80px,1.4fr); gap:4px; align-items:center; text-align:center; }
    .rec-grid > :first-child { text-align:left; }
    .rec-header { min-height:32px; padding:0 8px; border-radius:7px; color:var(--muted); background:rgba(255,255,255,.05); }
    .rec-row { width:100%; min-height:40px; padding:2px 8px; border:1px solid transparent; border-radius:7px; background:transparent; color:var(--strong); }
    #desktopCandidates { height:144px; min-height:144px; overflow-y:auto; overflow-x:hidden; scrollbar-width:thin; scrollbar-color:#5f6d62 transparent; }
    #desktopCandidates .rec-row { height:36px; min-height:36px; }
    .rec-row:hover { background:#333; } .rec-row.actual { background:rgba(76,175,80,.15); border-color:#4caf50; }
    .rec-move { display:flex; align-items:center; gap:6px; font-weight:700; }
    .rec-move .stone-key { width:14px; height:14px; border:0; } .rec-move .stone-key.white { border:1px solid #666; }
    .actual-check { width:15px; height:15px; color:#66c284; }
    .chip { display:inline-block; min-width:48px; padding:2px 7px; border-radius:6px; background:rgba(255,255,255,.1); font-weight:700; line-height:20px; }
    .rec-row:first-child .chip { background:var(--jade); color:#fff; }
    .score-chip { display:inline-block; padding:0 5px; border-radius:5px; background:#141414; font-weight:700; }
    .win-chips { display:flex; justify-content:center; gap:4px; white-space:nowrap; }
    .win-chips b { padding:0 4px; border-radius:5px; background:#111; }
    .win-chips b.other { background:#f4f4f4; color:#151515; }
    .actual-comparison { display:none; min-height:32px; align-items:center; gap:8px; padding:0 8px; border-top:1px solid var(--line); white-space:nowrap; }
    .actual-comparison.visible { display:flex; }
    .analysis { position:relative; display:flex; flex-direction:column; }
    .tabs { flex:none; display:flex; height:40px; align-items:stretch; gap:0; padding-right:48px; border-bottom:1px solid var(--line); }
    .tabs button { min-width:88px; flex:1; padding:0 4px; border:0; border-bottom:2px solid transparent; color:var(--muted); background:transparent; font-size:18px; white-space:nowrap; }
    .tabs button[aria-selected="true"] { color:var(--good); border-bottom-color:var(--jade); }
    .expand-analysis { position:absolute; z-index:2; right:8px; top:4px; width:36px; height:36px; display:grid; place-items:center; padding:0; border:1px solid var(--line); border-radius:6px; color:var(--strong); background:var(--jade-dark); }
    .expand-analysis .icon { width:21px; height:21px; }
    .analysis-body { flex:1; min-height:0; overflow:auto; padding:8px 12px; font-size:18px; }
    .analysis-expanded { position:fixed!important; z-index:21; inset:6vh 6vw; box-shadow:0 20px 50px #000a; }
    .analysis-backdrop { display:none; position:fixed; z-index:20; inset:0; background:#000b; }
    .analysis-backdrop.visible { display:block; }
    .chart-readout { display:flex; justify-content:space-between; gap:8px; margin:2px 4px 4px; font-weight:600; }
    .chart-readout .wr { color:#4caf50; }.chart-readout .pts { color:var(--amber); }
    .chart-box { background:var(--page); border-radius:8px; padding:5px; }
    .trend-svg,.grade-svg,.lollipop-svg,.match-svg { display:block; width:100%; }
    .trend-svg { height:clamp(140px,calc(100dvh - 740px),260px); }
    .trend-svg,.lollipop-svg { cursor:crosshair; }
    .filter-line { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .seg { display:inline-flex; padding:2px; border-radius:7px; background:#343434; gap:2px; }
    .seg button { min-height:32px; border:0; padding:0 10px; border-radius:5px; background:transparent; color:var(--muted); white-space:nowrap; }
    .seg button[aria-pressed="true"] { color:var(--strong); background:#4a6b5c; }
    .chart-defs { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:4px 12px; margin-top:10px; color:var(--muted); }
    .chart-defs div { display:flex; align-items:baseline; gap:6px; min-width:0; }
    .chart-defs i { width:13px; height:3px; flex:none; border-radius:2px; }
    .chart-defs b { color:var(--strong); font-weight:500; white-space:nowrap; }
    .note-line { margin:8px 0 0; color:var(--muted); line-height:1.45; }
    .caveat { color:#e0ad5a; }
    .entry { display:grid; grid-template-rows:48px 86px; gap:6px; min-height:0; }
    body[data-mode="professional"] .entry { grid-template-rows:86px; }
    body[data-mode="professional"] .entry-top { display:none; }
    .entry-top { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .entry-top.pro { grid-template-columns:1fr; }
    .control-rows { display:grid; grid-template-rows:40px 40px; gap:6px; }
    .control-row { display:grid; gap:6px; }
    .control-row.four { grid-template-columns:repeat(4,minmax(0,1fr)); }
    .control-row.two { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .tool-btn { min-width:0; min-height:40px; display:flex; align-items:center; justify-content:center; gap:8px; padding:0 8px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--muted); font-size:18px; white-space:nowrap; }
    .tool-btn .icon { width:20px; height:20px; }
    .control-rows .tool-btn .icon { fill:currentColor; stroke:none; }
    .control-rows .tool-btn[data-action="clear"] .icon { fill:none; stroke:currentColor; }
    .tool-btn[aria-pressed="true"] { border-color:var(--jade); color:var(--strong); background:var(--jade-dark); }
    .entry-top .tool-btn { min-height:48px; } .tool-btn:disabled { opacity:.32; }
    .playback { display:flex; align-items:center; gap:6px; min-width:0; padding:0 8px; }
    .playback .nav { flex:none; display:flex; align-items:center; gap:2px; }
    .playback .nav button { width:40px; height:40px; border:0; border-radius:50%; background:transparent; color:var(--strong); display:grid; place-items:center; padding:4px; }
    .playback .nav button:disabled { opacity:.25; }
    .playback .nav button.play { width:50px; height:50px; margin:0 2px; border-radius:50%; background:var(--jade); color:#fff; }
    .playback .nav button .icon { width:25px; height:25px; }
    .playback .nav button .icon,.k-playback button .icon { fill:currentColor; stroke:none; }
    .control-row.switches { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .switch-control { min-width:0; height:40px; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--strong); font-size:18px; }
    .switch-control .switch-label { display:flex; align-items:center; gap:8px; }
    .switch-control .switch-label .icon { width:20px; height:20px; }
    .switch-track { flex:none; width:38px; height:22px; padding:2px; border-radius:11px; background:#595b59; transition:background .15s; }
    .switch-track i { display:block; width:18px; height:18px; border-radius:50%; background:#f5f3f0; box-shadow:0 1px 3px #0006; transition:transform .15s; }
    .switch-control[aria-checked="true"] .switch-track { background:var(--jade); }
    .switch-control[aria-checked="true"] .switch-track i { transform:translateX(16px); }
    .playback input[type="range"] { flex:1; min-width:0; accent-color:#5a9b79; }
    .playback output { min-width:96px; text-align:right; white-space:nowrap; color:var(--muted); font-size:18px; }
    .kiosk-rail { display:none; }
    .dialog-backdrop { position:fixed; z-index:40; inset:0; display:none; place-items:center; background:#000b; }
    .dialog-backdrop.open { display:grid; }
    .detail-dialog { width:min(600px,calc(100vw - 32px)); max-height:calc(100vh - 40px); display:flex; flex-direction:column; border:1px solid var(--line); border-radius:12px; background:var(--paper); box-shadow:0 18px 48px #000a; }
    .dialog-header { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; font-size:24px; font-weight:600; }
    .dialog-header button { width:40px; height:40px; border:0; background:transparent; color:var(--strong); }
    .detail-dialog dl { margin:0; padding:10px 20px 18px; overflow:auto; border-top:1px solid var(--line); }
    .detail-dialog dl div { display:grid; grid-template-columns:108px minmax(0,1fr); gap:16px; padding:6px 0; font-size:18px; }
    .detail-dialog dt { color:var(--muted); } .detail-dialog dd { margin:0; }
    .brand .cn { font-family:'SmartBox Brand LongCang','LXGW WenKai',sans-serif; font-weight:400; font-synthesis:none; }
    .brand small { font-family:'SmartBox Serif',serif; font-style:italic; font-weight:400; }
    .rec-row .rec-move { font-size:18px; }
    .rec-row .score-chip { min-width:48px; }
    .rec-row .win-chips b { min-width:42px; }
    .analysis-body .help-btn { width:30px; height:30px; border:1px solid var(--line); border-radius:50%; background:transparent; color:var(--strong); }
    .match-grid { display:grid; grid-template-columns:2fr 1fr 1fr; align-items:center; gap:10px; padding:16px; }
    .match-grid > div { color:var(--muted); }
    .match-grid b { text-align:right; color:var(--strong); }
    .grade-help { position:relative; margin-left:auto; }
    .grade-help summary { list-style:none; width:32px; height:32px; display:grid; place-items:center; border:1px solid var(--line); border-radius:50%; color:var(--strong); cursor:pointer; }
    .grade-help summary::-webkit-details-marker { display:none; }
    .grade-help-panel { position:absolute; z-index:7; right:0; top:38px; width:260px; padding:10px 12px; border:1px solid #5b8265; border-radius:8px; background:#1a2820; box-shadow:0 10px 30px #000a; }
    .grade-help-panel p { margin:3px 0; white-space:nowrap; font-size:16px; }
    .grade-help-panel i,.ribbon-legend i { display:inline-block; width:12px; height:4px; margin-right:5px; vertical-align:middle; }
    .match-stats { display:grid; gap:8px; margin-top:8px; }
    .match-stat-row { display:grid; grid-template-columns:minmax(0,1.5fr) 1fr 1fr; gap:8px; align-items:center; min-height:50px; padding:0 8px; border:1px solid var(--line); border-radius:7px; }
    .match-unit { display:flex; align-items:center; gap:5px; white-space:nowrap; }
    .match-unit .stone-key { width:12px; height:12px; }
    .match-track { flex:1; min-width:15px; height:8px; overflow:hidden; border-radius:5px; background:#344339; }
    .match-track b { display:block; height:100%; }
    .match-ribbons { display:grid; gap:12px; padding:18px 6px 8px; }
    .match-ribbons>div:not(.ribbon-scale) { display:flex; align-items:center; gap:10px; }
    .ribbon { display:flex; flex:1; gap:2px; min-width:0; height:22px; }
    .ribbon b { flex:1; }
    .top1 { background:#59b57b; }.top3 { background:#72cbb1; }.off { background:#e79b4b; }
    .ribbon-scale { display:flex; justify-content:space-between; margin-left:28px; color:var(--muted); }
    .gempty { display:grid; min-height:180px; place-items:center; margin:0; color:var(--muted); }
    .analysis-dialog { display:flex; flex-direction:column; overflow:hidden; }
    .analysis-dialog .tabs { padding-right:0; }
    .report-notice { display:none; align-items:center; justify-content:space-between; gap:8px; min-height:44px; padding:3px 8px; border:1px solid var(--line); border-radius:8px; color:var(--strong); background:var(--paper); font-size:16px; }
    .report-notice.visible { display:flex; }
    .report-notice button { flex:none; min-height:38px; border:1px solid var(--line); border-radius:8px; background:var(--ink); color:var(--strong); }
    @media(max-width:1100px) {
      :root { font-family:'SmartBox Sans','SmartBox Kai',sans-serif; --page:#0f1416; --paper:#18211f; --ink:#1d2725; --line:#2b3a35; --strong:#eef3f1; --muted:#93a49d; --jade:#4a8a68; --jade-dark:#28483a; }
      .app { grid-template-columns:548px 476px; grid-template-rows:56px 544px; width:1024px; height:600px; }
      .top { height:56px; padding:0 20px; border-bottom-color:#27382f; background:#1c2521; font-size:16px; }
      .brand .cn { font-size:20px; }
      .brand small { font-size:14px; }
      .kiosk-top-extra { display:flex; align-items:center; justify-content:space-between; flex:1; gap:14px; min-width:0; margin-left:28px; }
      .kiosk-topic { color:#55bd80; white-space:nowrap; }

      .side,.desktop-rail { display:none; }
      .stage { grid-column:1; grid-row:2; display:block; padding:14px 16px; }

      .board-surface { position:absolute; inset:28px; width:460px; height:460px; }

      .ruler.left { left:0; }.ruler.right { right:0; }
      .kiosk-rail { grid-column:2; grid-row:2; display:flex; flex-direction:column; gap:3px; width:460px; height:516px; margin:14px 16px 0 0; overflow:hidden; }
      .k-pagebar { flex:none; height:44px; display:flex; align-items:center; gap:8px; min-width:0; font-size:16px; }
      .k-pagebar .back { flex:none; min-width:80px; height:38px; border:1px solid var(--line); border-radius:9px; background:var(--paper); color:var(--strong); }
      .k-pagebar .title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }

      .k-head .names strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
      .k-head .names strong:last-child { text-align:right; }
      .k-head .names b { color:var(--good); font-size:16px; white-space:nowrap; }
      .k-head .win-line { font-size:16px; gap:4px; }
      .k-head .win-track { height:6px; }
      .k-status { display:flex; justify-content:space-between; gap:6px; font-size:16px; color:var(--muted); white-space:nowrap; }

  function trendSvg(){

    const variations=state.pv!==null?[topFive[state.pv][0],state.pv===0?'C12':'Q10']:[];
    variations.forEach((coord,i)=>{const x=letters.indexOf(coord[0]),y=19-Number(coord.slice(1)),px=grid0+x*step,py=grid0+y*step,r=step*.5;c.globalAlpha=.6;c.drawImage((state.cursor+i)%2===0?blackImg:whiteImg,px-r,py-r,r*2,r*2);c.globalAlpha=1;c.fillStyle=(state.cursor+i)%2===0?'#fff':'#111';c.textAlign='center';c.textBaseline='middle';c.font=`bold ${step*.48}px sans-serif`;c.fillText(String(i+1),px,py);});
    state.tryMoves.forEach(([x,y],i)=>{const px=grid0+x*step,py=grid0+y*step,r=step*.5;c.globalAlpha=.78;c.drawImage((state.cursor+i)%2===0?blackImg:whiteImg,px-r,py-r,r*2,r*2);c.globalAlpha=1;c.fillStyle=(state.cursor+i)%2===0?'#fff':'#111';c.textAlign='center';c.textBaseline='middle';c.font=`bold ${step*.48}px sans-serif`;c.fillText(String(i+1),px,py);});
  }
  function rulers(){for(let side of ['top','bottom','left','right']){$(`.ruler.${side}`).innerHTML=(side==='top'||side==='bottom'?letters.split(''):Array.from({length:19},(_,i)=>19-i)).map(n=>`<span>${n}</span>`).join('');}}
  function syncDevice(){const k=isKiosk();if((k?4:11)!==moves.length){moves=k?kioskMoves:desktopMoves;names=k?{professional:['黑棋手','白棋手'],personal:['黑棋手','白棋手']}:{professional:['酒井佑规','张涛'],personal:['王星昊','杨鼎新']};topFive=k?kioskFive:desktopFive;state.cursor=moves.length;state.numbers=k;state.territory=false;state.advice=state.mode==='professional';state.pv=null;state.tryMoves=[];render();}else drawBoard();}
  rulers();render();new ResizeObserver(drawBoard).observe($('#board'));window.addEventListener('resize',syncDevice);
})();
</script>
</body>
</html>
