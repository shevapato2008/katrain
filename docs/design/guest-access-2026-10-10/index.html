<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>智星盒 · 游客登录引导</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../../katrain/web/ui/src/kiosk-shell/fonts.css">
  <style>
    :root{color-scheme:dark;--bg:#101110;--panel:#232624;--raise:#1b291f;--line:#3b4540;--text:#f0f1eb;--muted:#b8c0b8;--accent:#a1c9ae;--button:#527b63;--kai:"SmartBox Kai","Kaiti SC",serif;--ui:var(--kai)}
    *{box-sizing:border-box}body{margin:0;background:#0b100d;color:var(--text);font:16px/1.55 var(--ui);font-synthesis:none}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #b3d8bc;outline-offset:3px}h1,h2,h3,p{margin:0}button svg, .symbol svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}small{font-size:14px;color:var(--muted)}
    .tools{position:relative;z-index:2;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 20px;background:#1b241f;border-bottom:1px solid var(--line);font-size:14px}.tools label{display:flex;gap:8px;align-items:center}.tools select{height:36px;background:#141e19;border:1px solid #4c6454;border-radius:6px;padding:0 8px}.tools a{color:#c0d9c7;text-underline-offset:3px}.tools .note{margin-left:auto;color:#bac9be;font-size:12px}.capture .tools{display:none}
    .app{height:calc(100dvh - var(--tools-height,57px));position:relative;overflow:hidden;background:var(--bg)}.capture .app{height:100dvh}
    .topbar{height:64px;display:flex;align-items:center;gap:10px;padding:0 24px;background:#222523;border-bottom:1px solid #333c35}.logo{display:flex;align-items:center;gap:10px}.logo img{height:36px;width:36px;object-fit:contain}.brand{font:26px "SmartBox Brand LongCang",var(--kai);letter-spacing:2px}.latin-brand{font-size:18px;font-weight:600}.identity{margin-left:auto;color:var(--muted);font-size:14px}.body{height:calc(100% - 64px);display:flex}.sidebar{width:240px;flex:none;display:flex;flex-direction:column;gap:8px;padding:24px 12px;background:#222523}.sidebar button{height:48px;display:flex;gap:14px;align-items:center;border:0;border-radius:12px;padding:0 16px;background:transparent;text-align:left;color:#c8cec8}.sidebar .active{background:#2c4637;color:#f0f4ef}.sidebar .account{margin-top:auto;border:1px solid #46604e;justify-content:center}.sidebar svg{width:21px;height:21px}.content{flex:1;min-width:0;padding:32px 36px;overflow:auto}.page{max-width:1440px;margin:auto}.page-head{display:flex;gap:16px;align-items:center;margin-bottom:24px}.page-head h1{font-size:32px;font-weight:600;line-height:1.3}.back{width:44px;height:44px;flex:none;border:0;background:transparent;display:grid;place-items:center}.page-head .sub{margin-top:8px;color:var(--muted);font-size:14px}.page-head .badge{margin-left:auto;padding:7px 12px;border:1px solid var(--line);border-radius:6px;color:var(--muted);font-size:13px}
    .intro{display:flex;align-items:center;gap:16px;min-height:84px;padding:20px 24px;border:1px solid #46644e;background:#203126;border-radius:12px;margin-bottom:22px}.intro .tile{height:40px;width:40px;display:grid;place-items:center;border:1px solid #4e7659;border-radius:9px;color:var(--accent);font-size:24px}.intro strong{display:block;font-size:20px}.intro small{display:block;margin-top:2px}.intro button{margin-left:auto}.btn{min-height:48px;min-width:104px;padding:10px 18px;border:1px solid #647e6c;background:#263b2d;border-radius:8px;font-weight:400}.btn.primary{background:var(--button);border-color:var(--button);color:#f5f8f3}.btn:hover{filter:brightness(1.1)}.btn:disabled{cursor:default;filter:none;opacity:.7}.columns{display:grid;grid-template-columns:1.3fr 1fr;gap:22px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}.panel-head{display:flex;gap:12px;align-items:center;padding:17px 22px;border-bottom:1px solid var(--line)}.panel-head h2{font-size:20px;font-weight:600}.panel-head small{margin-left:auto}.rows{padding:14px;display:grid;gap:12px}.ghost-row{height:95px;display:flex;gap:16px;align-items:center;padding:18px;border:1px solid #344f3d;background:#1a271e;border-radius:8px}.ghost-avatar{width:36px;height:36px;flex:none;border:1px solid #42664e;border-radius:50%;background:#2c4032}.ghost-copy{display:grid;gap:10px;width:45%}.ghost-line{height:9px;border-radius:4px;background:#3c5142;width:85%}.ghost-line.short{width:55%;height:7px;background:#34413a}.ghost-spacer{flex:1}.ghost-row .ghost-copy:last-child{width:28%}.ghost-foot{padding:14px 20px;font-size:13px;color:var(--muted)}.ghost-filter{display:flex;gap:18px;padding:14px 20px;border-bottom:1px solid var(--line);font-size:14px}.ghost-filter span:first-child{color:var(--accent)}.peers .ghost-row{height:70px;padding:12px;border:0;border-bottom:1px solid #39413c;background:transparent;border-radius:0}.peers .rows{gap:0}.placeholder-caption{color:var(--muted);font-size:13px;margin-top:16px}
    .stage{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:370px}.stage>div{padding:28px}.stage>div+div{border-left:1px solid var(--line)}.stage h2{font-size:23px;margin-bottom:26px}.stage .ghost-line{margin:18px 0;height:12px;max-width:260px}.stage .ghost-avatar{width:60px;height:60px;margin:18px 0}.board{aspect-ratio:1;background-color:#9d8045;background-image:linear-gradient(#524b38 1px,transparent 1px),linear-gradient(90deg,#524b38 1px,transparent 1px);background-size:8.33% 8.33%;border:18px solid #aa8e56;max-width:340px}
    .protected-outline{filter:blur(6px);pointer-events:none;user-select:none}.app-shell{position:absolute;inset:0}.shade{position:absolute;inset:0;background:rgba(7,14,10,.42);display:flex;align-items:center;justify-content:center;padding:24px;z-index:3;overflow:auto}.dialog{width:480px;max-width:100%;flex:none;background:#232d26;border:1px solid #65806b;border-radius:14px;padding:32px;box-shadow:0 20px 64px #0007}.symbol{display:grid;place-items:center;width:48px;height:48px;border:1px solid #496551;border-radius:12px;background:#1b3022;color:#b8d7be;margin-bottom:20px}.dialog .eyebrow{font-size:14px;color:#b6cbbd;margin-bottom:8px}.dialog h2{font-size:28px;line-height:1.35;font-weight:600;margin-bottom:14px}.dialog .description{font-size:16px;line-height:1.7;color:#d4ded4}.dialog .next-note{margin-top:20px;padding:13px 14px;background:#1b241e;border:1px solid #415445;border-radius:8px;color:#bacfbe;font-size:14px;line-height:1.65}.dialog .actions{display:flex;gap:10px;margin-top:26px}.dialog .actions .btn{flex:1}.dialog .quiet{margin-top:15px;color:#a5b8ab;font-size:13px}.form-field{display:block;margin-top:18px;font-size:14px}.form-field input{margin-top:6px;width:100%;height:48px;border:1px solid #667c6a;border-radius:7px;background:#151e18;padding:0 12px}.register-toggle{display:block;margin-top:16px;padding:8px 0;border:0;background:transparent;color:#bdd7c3;text-decoration:underline;text-underline-offset:4px;min-height:44px}.loading-dot{width:17px;height:17px;border:2px solid #4e6757;border-top-color:#bed6c4;border-radius:50%;animation:spin 1s linear infinite}.notice{position:fixed;z-index:8;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 18px;background:#233d2c;border:1px solid #73957d;border-radius:8px;max-width:calc(100% - 32px);font-size:14px}
    @keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.loading-dot{animation:none}}
    .kiosk-document{overflow:hidden}.kiosk{--bg:#101715;--panel:#141e1b;--raise:#1c2924;--line:#34473c;--text:#eef4ed;--muted:#aabeb0;--accent:#83d69a;--button:#58b57a;--ui:"SmartBox Sans",var(--kai);position:absolute;left:50%;top:calc(50% + var(--tools-height,0px)/2);width:1024px;height:600px;transform:translate(-50%,-50%) scale(var(--scale));transform-origin:center}.kiosk .topbar{height:56px;padding:0 16px;background:#17221c;border-color:var(--line)}.kiosk .logo img{height:32px;width:32px}.kiosk .brand{font-size:22px}.kiosk .latin-brand{font:italic 13px "SmartBox Serif",var(--kai);color:#afc0b4}.kiosk .game-brand{font:19px "SmartBox Serif",var(--kai);color:var(--accent);margin-left:5px;border-left:1px solid var(--line);padding-left:12px}.kiosk .content{height:544px;padding:10px 16px 14px;overflow:hidden}.kiosk .page-head{height:48px;margin-bottom:8px;gap:10px}.kiosk .page-head h1{font:600 17px "SmartBox Serif",var(--kai)}.kiosk .back{width:108px;height:44px;border:1px solid var(--line);border-radius:9px;background:var(--raise);display:flex;gap:5px;justify-content:center;font-size:13px}.kiosk .back svg{width:14px;height:14px}.kiosk .section-label{height:19px;font:12px "SmartBox Serif",var(--kai);display:flex;gap:9px;align-items:center;margin-bottom:6px}.kiosk .section-label em{font-size:11px;color:var(--muted)}.kiosk .section-label:after{content:"";height:1px;background:var(--line);flex:1}.kiosk .action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.kiosk .intro{height:68px;min-height:0;padding:0 13px;margin:0;border-color:var(--line);border-radius:11px;background:var(--raise);gap:11px}.kiosk .intro strong{font-size:15px}.kiosk .intro small{font-size:11px}.kiosk .intro .tile{width:38px;height:38px;font-size:19px}.kiosk .list{height:330px}.kiosk .panel-head{height:48px;padding:2px 8px;gap:26px}.kiosk .panel-head h2{font:600 14px "SmartBox Serif",var(--kai)}.kiosk .panel-head small{font-size:11px}.kiosk .rows{padding:8px;grid-template-columns:1fr 1fr;gap:8px}.kiosk .ghost-row{height:90px;border-color:var(--line);background:var(--raise);padding:12px;gap:12px}.kiosk .ghost-foot{font-size:11px;padding:8px}.kiosk .btn.primary{color:#0a2816}.kiosk .shade{padding:16px}.kiosk .dialog{width:460px;padding:28px;background:#1c2923;border-color:#55785e;border-radius:12px;font-family:var(--kai)}.kiosk .dialog h2{font-size:26px}.kiosk .dialog .description{font-size:17px}.kiosk .dialog .btn{min-height:48px}.kiosk .dialog .symbol{height:44px;width:44px;margin-bottom:16px}.kiosk .dialog .next-note{margin-top:16px}.kiosk .dialog .actions{margin-top:22px}.kiosk .stage{min-height:330px;height:330px;grid-template-columns:1fr 300px}.kiosk .stage>div{padding:20px}.kiosk .stage h2{font:21px var(--kai)}.kiosk .board{max-width:280px}
    @media(max-width:1100px){.sidebar{width:188px}.content{padding:24px}.columns{gap:16px;grid-template-columns:1fr 1fr}}@media(max-width:800px){.sidebar{display:none}.topbar{height:52px;padding:0 16px}.topbar .latin-brand{display:none}.body{height:calc(100% - 52px)}.content{padding:24px 16px}.page-head h1{font-size:27px}.page-head .badge{display:none}.columns,.stage{grid-template-columns:1fr}.intro{padding:16px;flex-wrap:wrap}.intro button{width:100%;margin:0}.shade{padding:20px}.dialog{padding:26px 24px}.dialog h2{font-size:26px}.dialog .actions{flex-direction:column-reverse}.dialog .actions .btn{width:100%}.kiosk .topbar{height:56px}.kiosk .topbar .latin-brand{display:inline}.kiosk .dialog .actions{flex-direction:row}}
  </style>

<body>
  <nav class="tools" aria-label="设计预览控制">
    <label>平台 <select id="surface"><option value="galaxy">Galaxy</option><option value="kiosk">RK3562 kiosk</option></select></label>
    <label>模块 <select id="feature"><option value="hall">在线大厅</option><option value="rated">升降级对弈</option><option value="reports">个人复盘</option><option value="cross">跨平台对弈（kiosk）</option><option value="analysis">研究分析操作</option></select></label>
    <label>状态 <select id="state"><option value="guest">未登录</option><option value="expired">认证失效</option><option value="checking">正在检查</option><option value="unavailable">网络 / 服务不可用</option></select></label>
    <a href="README.md">访问规则与设计说明</a><span class="note">设计预览 · 占位结构，不读取业务数据</span>
  </nav>
  <div id="app"></div>
  <script>
  (()=>{
    const query=new URLSearchParams(location.search);
    const features={hall:['对战大厅','查看正在进行的对局，邀请棋友或匹配对手。','返回对弈'],rated:['升降级对弈','定级与升降级成绩需要记录到你的账号。','返回对弈'],reports:['个人复盘','查看你的棋谱与复盘报告，继续分析对局。','返回首页'],cross:['跨平台对弈','先登录智星盒，再连接你的星阵或 OGS 账号。','返回对弈'],analysis:['研究分析','登录后可使用引擎分析，当前棋盘与设置将保留。','继续浏览']};
    const config={surface:query.get('surface')==='kiosk'?'kiosk':'galaxy',feature:features[query.get('feature')]?query.get('feature'):'hall',state:['guest','expired','checking','unavailable'].includes(query.get('state'))?query.get('state'):'guest',step:'gate'};
    const arrow='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg>';
    const lock='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></svg>';
    const person='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 20c0-4 3-6 7-6 2 0 4 .7 5 2m5-7v8m-4-4h8"/></svg>';
    const navLabels=['首页','对局','研究','死活题','复盘','直播','棋谱库','教程'];
    const navPaths=['M3 11 12 3l9 8v10h-6v-7H9v7H3Z','M6 8h12l3 10H3Zm1 5h4m-2-2v4m7-2h.01','M9 3h6m-5 0v7L4 20h16l-6-10V3','M4 4h16v16H4Zm4 4h8m-8 4h8','M4 4h16v16H4Zm4 12v-4m4 4V8m4 8v-6','M3 7h18v14H3Zm5-5 4 5 4-5','M5 3h14v18H5Zm3 5h8m-8 4h8m-8 4h5','M3 4h8l1 2 1-2h8v16h-8l-1 2-1-2H3Z'];
    const ghost=()=>'<div class="ghost-row"><span class="ghost-avatar"></span><span class="ghost-copy"><i class="ghost-line"></i><i class="ghost-line short"></i></span><span class="ghost-spacer"></span><span class="ghost-copy"><i class="ghost-line"></i><i class="ghost-line short"></i></span></div>';
    function outline(){const k=config.surface==='kiosk',f=config.feature;const title=k&&f==='hall'?'在线大厅':features[f][0];const header=`<header class="page-head"><button class="back" tabindex="-1">${arrow}${k?'返回对弈':''}</button><div><h1>${title}</h1>${k?'':`<p class="sub">${f==='hall'?'选择空闲棋友，或一键匹配同段位对手。所有大厅对局均不计升降段位。':features[f][1]}</p>`}</div><span class="badge">登录后使用</span></header>`;
      if(f==='hall'&&k)return `${header}<div class="section-label">开一局 <em>Start</em></div><div class="action-grid"><section class="intro"><span class="tile">棋</span><div><strong>快速匹配</strong><small>按当前段位找棋友 · 不计升降段位</small></div></section><section class="intro"><span class="tile">友</span><div><strong>邀请棋友</strong><small>直接邀请任意段位的空闲棋友</small></div></section></div><div class="section-label">对战大厅 <em>Lobby</em></div><section class="panel list"><header class="panel-head"><h2>进行中对局</h2><h2>在线棋友</h2><small>登录后查看</small></header><div class="rows">${Array.from({length:4},ghost).join('')}</div></section>`;
      if(f==='hall')return `${header}<section class="intro"><span class="tile">棋</span><div><strong>来下一局</strong><small>匹配同段位对手，或直接邀请棋友</small></div><button class="btn primary" tabindex="-1">快速匹配 →</button></section><div class="columns"><section class="panel"><header class="panel-head"><h2>进行中的对局</h2></header><div class="rows">${Array.from({length:3},ghost).join('')}</div><p class="ghost-foot">点击对局即可观战；自己的对局可返回棋盘。</p></section><section class="panel peers"><header class="panel-head"><h2>在线棋友</h2></header><div class="ghost-filter"><span>全部棋友</span><span>同段位</span><span>我的关注</span></div><div class="rows">${Array.from({length:4},ghost).join('')}</div></section></div>`;
      return `${header}<section class="panel stage"><div><h2>${f==='rated'?'当前段位':f==='reports'?'我的棋谱':f==='analysis'?'研究棋盘':'连接平台'}</h2>${f==='analysis'?'<div class="board"></div>':'<i class="ghost-line"></i><i class="ghost-line short"></i><i class="ghost-line"></i><i class="ghost-line short"></i>'}</div><div><h2>${f==='rated'?'本局挑战':f==='reports'?'复盘报告':f==='analysis'?'分析工具':'平台账号'}</h2><div class="ghost-avatar"></div><i class="ghost-line"></i><i class="ghost-line short"></i><i class="ghost-line"></i></div></section>`;
    }
    function modal(){const k=config.surface==='kiosk',action=config.feature==='analysis',label=features[config.feature][0];let title=`登录后${action?'使用引擎分析':'进入'+(k&&config.feature==='hall'?'在线大厅':label)}`,desc=features[config.feature][1],primary=k?'去盒子主页登录':'登录并继续',symbol=lock,extra='',secondary=features[config.feature][2];
      if(config.state==='expired'){title='请重新登录';desc=`登录状态已失效。${action?'当前棋盘仍会保留。':'已暂停读取'+label+'中的个人内容。'}登录后可继续使用。`;}
      if(config.state==='checking'){title='正在确认登录状态';desc='请稍候，确认完成后将自动继续。';symbol='<span class="loading-dot" aria-hidden="true"></span>';primary='正在确认';}
      if(config.state==='unavailable'){title='暂时无法确认登录状态';desc='网络或服务暂时不可用，请重试。你的登录凭据仍会保留。';symbol='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8a16 16 0 0 1 18 0M6 12a11 11 0 0 1 12 0M9 16a5 5 0 0 1 6 0m-3 4h.01"/></svg>';primary='重试';}
      let next=config.state==='checking'?'确认期间不读取账号内容。':config.state==='unavailable'?'无需退出账号，可在连接恢复后重试。':k?'将在智星盒主页完成登录，再从围棋入口回到此模块。':action?'登录后仍需确认原操作，当前棋盘不会被清空。':'登录完成后回到当前页面，无需重新寻找入口。';
      if(config.step==='login'){title='登录智星盒';desc='';symbol=person;next='';extra='<label class="form-field">用户名<input autocomplete="off" name="username" placeholder="请输入用户名"></label><label class="form-field">密码<input autocomplete="off" name="password" type="password" placeholder="请输入密码"></label><button class="register-toggle" data-register>还没有账号？注册</button>';primary='登录';secondary='返回引导';}
      if(config.step==='launcher'){title='在智星盒主页登录';desc='登录完成后，点击“围棋”返回，再进入当前模块。';next='围棋使用盒子的统一账号，无需重复输入账号密码。';primary='打开盒子主页';secondary='返回引导';}
      return `<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="gate-title" aria-describedby="gate-description" tabindex="-1"><div class="symbol">${symbol}</div><p class="eyebrow">${label}</p><h2 id="gate-title">${title}</h2><p class="description" id="gate-description" ${!desc?'hidden':''}>${desc}</p>${extra}${next?`<p class="next-note">${next}</p>`:''}<div class="actions"><button class="btn" data-back>${secondary}</button><button class="btn primary" data-primary ${config.state==='checking'?'disabled':''}>${primary}</button></div>${config.state==='guest'&&config.step==='gate'&&config.feature==='hall'?'<p class="quiet">未登录时不显示棋友名单和进行中的对局。</p>':''}</section>`;
    }
    function scale(){if(config.surface==='kiosk'){const height=innerHeight-(document.querySelector('.tools')?.offsetHeight||0);document.querySelector('.kiosk')?.style.setProperty('--scale',String(Math.min(innerWidth/1024,height/600)));}}
    function render(){const k=config.surface==='kiosk';document.documentElement.classList.toggle('kiosk-document',k);document.getElementById('feature').querySelector('[value="cross"]').disabled=!k;if(!k&&config.feature==='cross')config.feature='hall';const brand=`<div class="logo"><img src="../../../katrain/img/logo-white.png" alt=""><span class="brand">智星盒</span><span class="latin-brand">StellaBox</span></div>${k?'<span class="game-brand">围棋</span>':''}<span class="identity">${config.state==='checking'?'正在确认':config.state==='unavailable'?'状态待确认':'访客'}${k?' · 17:24':''}</span>`;
      document.querySelector('#app').innerHTML=`<div class="app ${k?'kiosk':''}"><div class="app-shell" inert aria-hidden="true"><header class="topbar">${brand}</header>${k?`<main class="content protected-outline">${outline()}</main>`:`<div class="body"><aside class="sidebar">${navLabels.map((n,i)=>`<button tabindex="-1" class="${n==='对局'?'active':''}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${navPaths[i]}"/></svg>${n}</button>`).join('')}<button class="account" tabindex="-1">登录</button></aside><main class="content protected-outline"><div class="page">${outline()}</div></main></div>`}</div><div class="shade">${modal()}</div></div>`;
      for(const key of ['surface','feature','state'])document.getElementById(key).value=config[key];document.body.style.setProperty('--tools-height',(document.querySelector('.tools')?.offsetHeight||0)+'px');scale();if(config.step==='login')document.querySelector('input')?.focus();else(document.querySelector('[data-primary]:not(:disabled)')||document.querySelector('[data-back]')).focus();}
    function note(text){document.querySelector('.notice')?.remove();const n=document.createElement('p');n.className='notice';n.setAttribute('role','status');n.textContent=text;document.body.append(n);setTimeout(()=>n.remove(),4500);}
    function back(){if(config.step!=='gate'){config.step='gate';render();return;}note('设计预览：返回公开入口。实际应用将在此离开受保护页面。');}
    document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.hasAttribute('data-back'))back();if(b.hasAttribute('data-primary')){if(config.state==='unavailable'){config.state='checking';render();setTimeout(()=>{config.state='unavailable';render();note('设计预览：重试结果由真实认证响应决定，此处保留故障示例。');},900);}else if(config.step==='gate'){config.step=config.surface==='kiosk'?'launcher':'login';render();}else note(config.step==='launcher'?'设计预览：实际 RK3562 将打开既有盒子登录入口。':'设计预览：此处复用既有账号登录，不提交或保存输入。');}if(b.hasAttribute('data-register'))note('设计预览：注册由既有账号流程提供。');});
    document.querySelector('.tools').addEventListener('change',event=>{config[event.target.id]=event.target.value;config.step='gate';render();});
    document.addEventListener('keydown',event=>{const d=document.querySelector('.dialog');if(!d||!d.contains(document.activeElement))return;if(event.key==='Escape'){event.preventDefault();back();}if(event.key==='Tab'){const focusables=[...d.querySelectorAll('button:not(:disabled),input')];const first=focusables[0],last=focusables.at(-1);if(event.shiftKey&&(document.activeElement===first||document.activeElement===d)){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
    addEventListener('resize',()=>{document.body.style.setProperty('--tools-height',(document.querySelector('.tools')?.offsetHeight||0)+'px');scale();});if(query.has('capture'))document.body.classList.add('capture');render();
  })();
  </script>
</body>
</html>
