<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kiosk 7英寸：当前实现与设计对照</title><style>*{box-sizing:border-box}body{margin:0;background:#0f1416;color:#eef3f1;font:15px system-ui}header{padding:14px 20px;display:flex;gap:20px;align-items:center;position:sticky;top:0;background:#18211f;z-index:2}button{font:inherit;color:inherit;background:#26463a;border:1px solid #58b57a;border-radius:6px;padding:8px 12px}main{padding:20px;display:flex;gap:20px;width:max-content}figure{margin:0}figcaption{padding-bottom:10px}img{display:block;width:1024px;height:600px;max-width:none}#overlay{position:relative;width:1024px;height:600px}#overlay img:last-child{position:absolute;inset:0;opacity:.5}.row{margin:20px}input{accent-color:#58b57a}a{color:#7ec994}[hidden]{display:none!important}</style><header><strong>1024×600 · 原尺寸对照</strong><button onclick="view('library')">棋谱库</button><button onclick="view('report')">分析报告</button><label>设计叠加透明度 <input type="range" min="0" max="100" value="50" oninput="document.querySelector('#overlay img:last-child').style.opacity=this.value/100"></label><a href="kiosk-library-report-7inch.html">交互 HTML</a></header><main><figure><figcaption>当前测试环境</figcaption><img id="before"></figure><figure><figcaption>新设计（同尺寸）</figcaption><img id="after"></figure></main><div class="row"><p>叠加对照：布局变化是本次设计调整，不将像素差异当作自动验收结论。</p><div id="overlay"><img><img></div></div><script>function view(v){const base='../../output/playwright/',b=base+(v==='library'?'kiosk-library-current-1024.png':'kiosk-report-current-1024.png'),a=base+(v==='library'?'kiosk-7inch-library-recommend.png':'kiosk-7inch-professional-trend.png');document.getElementById('before').src=b;document.getElementById('after').src=a;document.querySelectorAll('#overlay img').forEach((e,i)=>e.src=i?a:b);}view('library');</script></html>
