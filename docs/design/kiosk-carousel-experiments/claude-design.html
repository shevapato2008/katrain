:root{--bg:#0d1415;--top:#17221e;--surface:#1b2b24;--surface2:#22382c;--edge:#42624d;--text:#edf5ec;--sub:#b7cdbb;--accent:#62c989;--gold:#e1aa57;--shadow:#07110d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07100d;color:var(--text)}body{display:grid;place-items:center;font-family:"STKaiti","KaiTi",serif}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #a9f3bc;outline-offset:3px}.n{font-family:Plex,monospace;font-variant-numeric:tabular-nums}
.canvas{position:relative;width:1024px;height:600px;overflow:hidden;background:var(--bg);border:1px solid #2e4839;box-shadow:0 28px 70px #0009}
.top{height:56px;padding:0 24px;display:flex;align-items:center;gap:12px;background:var(--top);border-bottom:1px solid #31473b;font-size:22px}
.logo{width:31px;height:34px;display:grid;place-items:center;color:#d7e8d9;font-size:31px;line-height:1}.brand{font-weight:700;white-space:nowrap}.brand-en{font-size:18px;font-style:italic;color:#b8c9bb}.divider{height:30px;border-left:1px solid #46604e;margin:0 5px}.product{color:var(--accent)}.spacer{flex:1}.avatar{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:var(--accent);color:#12351f;font:18px serif}.user{font-size:18px}.clock{font-size:22px}
.home{height:462px;position:relative;overflow:hidden}.title{position:absolute;left:28px;top:16px;margin:0;font-size:28px;font-weight:600;line-height:1.2}.intro{position:absolute;left:28px;top:57px;margin:0;color:var(--sub);font-size:18px}.position{position:absolute;right:28px;top:20px;color:#b4c9b8;font-size:18px}
.carousel{position:absolute;left:0;right:0;top:91px;height:332px;perspective:1000px;touch-action:pan-y;user-select:none;cursor:grab}.carousel.dragging{cursor:grabbing}.card{position:absolute;left:50%;top:4px;width:570px;height:312px;margin-left:-285px;padding:20px 22px;transform-origin:center;transform-style:preserve-3d;backface-visibility:hidden;border:1px solid #5b8066;border-radius:22px;background:linear-gradient(160deg,#2a4935 0%,#21392c 28%,#1b2d25 67%,#17261f 100%);box-shadow:inset 0 2px 1px #ffffff3b,inset 0 -4px 3px #0a1b12bb,0 6px 0 #0c1b13,0 20px 29px #000b;will-change:transform,opacity;overflow:hidden}
.card:before{content:"";position:absolute;left:16px;right:16px;top:11px;height:54px;border-top:1px solid #ffffff22;border-radius:17px;pointer-events:none}.card:after{content:"";position:absolute;left:18px;right:18px;bottom:14px;border-bottom:1px solid #ffffff12;pointer-events:none}
.card.is-current{border-color:#76c992;box-shadow:inset 0 2px 1px #ffffff54,inset 0 -4px 3px #07170dbb,0 6px 0 #0b2414,0 22px 38px #000c}
.cardhead{height:62px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid #47634e}.cardhead h2{font-size:28px;line-height:1;margin:0 0 6px;font-weight:600}.cardhead p{font-size:18px;line-height:1;margin:0;color:#c8dccb}.index-badge{font-size:18px;color:#a4d7ac;border:1px solid #50745b;border-radius:20px;padding:5px 10px;background:#153322}
.cardbody{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-top:12px}.cardcopy{min-width:0}.cardcopy .caption{font-size:18px;color:#bed1c0;margin:0 0 8px}.legend{display:grid;gap:0}.legenditem{display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:8px;height:24px;font-size:18px;white-space:nowrap}.legenditem i{width:10px;height:10px;border-radius:50%;background:var(--c)}.legenditem strong{font-weight:500}.legenditem b{font-size:18px;font-weight:500;color:#dce9da}.legenditem .n{color:#eaf2e8}
.chartside{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}.pie{width:150px;height:150px;border-radius:50%;background:conic-gradient(#63c487 0% 16.7%,#dcaa59 16.7% 30.6%,#9d93b9 30.6% 36.9%,#6b9ca1 36.9% 99.9%,#d97870 99.9% 100%);border:3px solid #355943;box-shadow:inset 5px 7px 11px #0005,0 2px 0 #e8ffe033,0 8px 18px #0008;transform:rotate(-90deg)}
.pie-empty{width:150px;height:150px;display:grid;place-items:center;text-align:center;border:2px dashed #56735e;border-radius:50%;color:#b8cbbd;font-size:18px;background:radial-gradient(circle,#1e3126 51%,transparent 52%)}.chartnote{font-size:18px;color:#b8d1be}.enter{position:absolute;left:21px;bottom:18px;width:257px;height:48px;display:flex;align-items:center;justify-content:center;gap:14px;border:1px solid #76d69a;border-radius:16px;background:#5dbd82;color:#122719;font-size:22px;box-shadow:inset 0 2px 1px #ffffff60,inset 0 -4px 2px #2f8f56,0 4px 0 #143f27,0 9px 13px #0008;transition:transform .12s,box-shadow .12s}.enter:active{transform:translateY(3px);box-shadow:inset 0 4px 8px #18472e,0 1px 1px #0006}.enter svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
.empty-copy{font-size:22px;line-height:1.38;color:#e7efe4;margin:18px 0 0}.empty-copy small{display:block;margin-top:10px;font-size:18px;color:#a9c0ad}.empty-copy b{color:#99dfaa;font-weight:500}
.arrow{position:absolute;z-index:50;top:124px;width:48px;height:64px;display:grid;place-items:center;border:1px solid #577a61;border-radius:15px;background:#223a2b;color:#b8e9c3;font:36px Georgia,serif;box-shadow:inset 0 1px 0 #ffffff30,0 3px 0 #102119,0 8px 12px #0008}.arrow:active{transform:translateY(3px);box-shadow:inset 0 3px 7px #07170d}.arrow.prev{left:18px}.arrow.next{right:18px}.arrow:disabled{opacity:.3;cursor:default}
.bottommeta{position:absolute;left:29px;right:29px;bottom:7px;height:30px;display:flex;align-items:center;justify-content:space-between;color:#9db6a4;font-size:18px}.dots{display:flex;gap:6px;align-items:center}.dots i{height:6px;width:18px;border-radius:5px;background:#45614c}.dots i.on{width:28px;background:var(--accent)}
.dock{position:absolute;bottom:0;left:0;right:0;height:82px;padding:7px 14px;display:grid;grid-template-columns:repeat(7,1fr);gap:5px;background:#17231e;border-top:1px solid #33483b}.dock button{border:0;border-radius:16px;background:linear-gradient(180deg,#283b30,#16241d);color:#d0ddd1;font-size:22px;box-shadow:inset 0 1px 0 #ffffff25,0 2px 0 #0c1a11,0 4px 6px #0005}.dock button.on{background:#5ebc82;color:#102217;box-shadow:inset 0 2px 0 #ffffff53,0 3px 0 #1e5835}.dock button:active{transform:translateY(2px)}
.modal{position:absolute;z-index:80;inset:0;background:#000b;display:none;place-items:center}.modal.open{display:grid}.modal article{width:400px;padding:20px 24px;border:1px solid #71bd82;border-radius:18px;background:#1b3023;box-shadow:0 18px 50px #000b}.modal h3{font-size:28px;margin:0 0 10px}.modal p{font-size:22px;line-height:1.35;margin:0 0 17px}.modal button{height:48px;padding:0 18px;border:1px solid #6cbf84;border-radius:14px;background:#2a5037;color:#eaf5ec;font-size:22px;box-shadow:inset 0 1px 0 #ffffff38,0 3px 0 #0b2112}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="canvas" aria-label="训练营首页立体轮播设计样板">
  <header class="top"><span class="logo" aria-hidden="true">✧</span><strong class="brand">智星盒</strong><em class="brand-en">StellaBox</em><i class="divider"></i><span class="product">围棋</span><span class="spacer"></span><span class="avatar">F</span><span class="user">fan</span><span class="clock n">02:08</span></header>
  <section class="home"><h1 class="title">训练营</h1><p class="intro">选择棋力，查看题型分布并开始练习</p><span class="position n" id="position">01 / 22</span>
    <div class="carousel" id="carousel" aria-label="棋力轮播；左右拖动切换"></div>
    <div class="bottommeta"><span>左右滑动卡片切换棋力</span><div class="dots" id="dots" aria-hidden="true"></div><span>点击卡片进入题型</span></div>
  </section>
  <nav class="dock" aria-label="主导航"><button>⚄ 对弈</button><button class="on">✚ 训练营</button><button>▤ 棋谱</button><button>▦ 复盘</button><button>↗ 成长</button><button>▯ 课程</button><button>⚙ 设置</button></nav>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="题型入口预览"><article><h3 id="modalTitle">15 级题型</h3><p>这里将进入所选棋力的题型页面。本文件仅展示训练营首页轮播。</p><button id="modalClose" type="button">返回轮播</button></article></div>
</main>
<script>
(() => {
  const levels=['15 级','14 级','13 级','12 级','11 级','10 级','9 级','8 级','7 级','6 级','5 级','4 级','3 级','2 级','1 级','1 段','2 段','3 段','4 段','5 段','6 段','7 段'];
  const counts={'15 级':'1000 题','14 级':'988 题','13 级':'1000 题','12 级':'984 题','11 级':'986 题'};
  const pieces=[['死活',167,'#63c487'],['手筋',139,'#dcaa59'],['对杀',63,'#9d93b9'],['吃子',630,'#6b9ca1'],['官子',1,'#d97870']];
  const carousel=document.getElementById('carousel'), position=document.getElementById('position'),dots=document.getElementById('dots');
  const arrowSvg='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg>';
  let index=0,shown=0,target=0,raf=0,startX=0,startValue=0,lastX=0,lastTime=0,velocity=0,dragging=false,moved=false,stopClickUntil=0,lastNearest=-1;
  function card(level,i){
    const known=i===0;
    const legend=known?`<div class="legend">${pieces.map(([name,count,color])=>`<div class="legenditem" style="--c:${color}"><i></i><strong>${name}</strong><b class="n">${(count/10).toFixed(1)}%</b></div>`).join('')}</div>`:
      `<p class="empty-copy">选择 <b>${level}</b> 进入专项训练<small>题型比例将在数据加载后显示</small></p>`;
    return `<article class="card" data-index="${i}" aria-label="${level}，${counts[level]||'题量待加载'}"><div class="cardhead"><div><h2>${level}</h2><p>${counts[level]||'题量待加载'}</p></div><span class="index-badge">棋力 ${String(i+1).padStart(2,'0')}</span></div><div class="cardbody"><div class="cardcopy"><p class="caption">题型比例${known?' · 共 1000 题':' · 待加载'}</p>${legend}</div><div class="chartside">${known?'<div class="pie" role="img" aria-label="死活 16.7%，手筋 13.9%，对杀 6.3%，吃子 63.0%，官子 0.1%"></div><span class="chartnote">15 级题库构成</span>':'<div class="pie-empty">比例<br>待加载</div><span class="chartnote">当前无题型实数</span>'}</div></div><button class="enter" type="button" data-enter="${i}" aria-label="进入${level}题型">进入题型 ${arrowSvg}</button></article>`;
  }
  carousel.innerHTML=levels.map(card).join('')+'<button class="arrow prev" type="button" aria-label="上一棋力">‹</button><button class="arrow next" type="button" aria-label="下一棋力">›</button>';
  const cards=[...carousel.querySelectorAll('.card')],enters=cards.map(el=>el.querySelector('.enter')),prev=carousel.querySelector('.prev'),next=carousel.querySelector('.next');
  const totalGroups=Math.ceil(levels.length/5);dots.innerHTML=Array.from({length:totalGroups},()=>'<i></i>').join('');const dotItems=[...dots.children];
  cards.forEach(el=>el.style.visibility='hidden');let visibleLast=new Set();
  function render(){
    const start=Math.max(0,Math.floor(shown)-2),end=Math.min(levels.length-1,Math.ceil(shown)+2),visibleNow=new Set();
    for(let i=start;i<=end;i++){
      const el=cards[i],d=i-shown,a=Math.abs(d);visibleNow.add(i);
      el.style.visibility='visible';el.style.pointerEvents=a<1.6?'auto':'none';
      el.style.zIndex=String(40-Math.round(a*10));
      el.style.opacity=String(a<1.2?1:a<2.3?Math.max(.2,1-(a-1.2)*.65):0);
      el.style.transform=`translate3d(${d*335}px,${a*24}px,${-a*40}px) rotateY(${-d*28}deg) scale(${Math.max(.65,1-a*.14)})`;
      if(el.classList.contains('is-current')!==(a<.5))el.classList.toggle('is-current',a<.5);
      enters[i].tabIndex=a<.5?0:-1;
    }
    for(const i of visibleLast)if(!visibleNow.has(i))cards[i].style.visibility='hidden';
    visibleLast=visibleNow;
    if(prev.disabled!==(shown<.02))prev.disabled=shown<.02;if(next.disabled!==(shown>levels.length-1.02))next.disabled=shown>levels.length-1.02;
    const nearest=Math.max(0,Math.min(levels.length-1,Math.round(shown)));
    if(nearest!==lastNearest){position.textContent=`${String(nearest+1).padStart(2,'0')} / ${levels.length}`;const group=Math.floor(nearest/5);dotItems.forEach((dot,i)=>dot.classList.toggle('on',i===group));lastNearest=nearest}
  }
  function animate(){if(dragging)return;const dx=target-shown;shown+=dx*.22;if(Math.abs(dx)<.003){shown=target;raf=0;render();return}render();raf=requestAnimationFrame(animate)}
  function settle(to){target=Math.max(0,Math.min(levels.length-1,to));index=target;if(!raf)raf=requestAnimationFrame(animate)}
  carousel.addEventListener('pointerdown',e=>{if(e.target.closest('.arrow'))return;dragging=true;moved=false;startX=lastX=e.clientX;startValue=shown;lastTime=performance.now();velocity=0;if(raf){cancelAnimationFrame(raf);raf=0}});
  carousel.addEventListener('pointermove',e=>{if(!dragging)return;const now=performance.now(),dx=e.clientX-startX;if(!moved&&Math.abs(dx)>6){moved=true;carousel.classList.add('dragging');carousel.setPointerCapture(e.pointerId)}if(!moved)return;const dt=Math.max(1,now-lastTime);velocity=(e.clientX-lastX)/dt;lastX=e.clientX;lastTime=now;shown=Math.max(0,Math.min(levels.length-1,startValue-dx/335));render()});
  function finish(){if(!dragging)return;dragging=false;carousel.classList.remove('dragging');if(moved){stopClickUntil=performance.now()+350;const start=Math.round(startValue),delta=shown-startValue,flick=Math.abs(velocity)>.55;let nextIndex=Math.round(shown-velocity*.32);if(flick&&nextIndex===start)nextIndex=start+Math.sign(-velocity);if(!flick&&Math.abs(delta)>.28&&nextIndex===start)nextIndex=start+Math.sign(delta);settle(nextIndex)}else settle(Math.round(shown))}
  carousel.addEventListener('pointerup',finish);carousel.addEventListener('pointercancel',finish);
  prev.addEventListener('click',()=>settle(index-1));next.addEventListener('click',()=>settle(index+1));
  carousel.addEventListener('click',e=>{if(performance.now()<stopClickUntil)return;const el=e.target.closest('.card');if(!el)return;const i=Number(el.dataset.index);if(i!==Math.round(shown)){settle(i);return}document.getElementById('modalTitle').textContent=`${levels[i]}题型`;document.getElementById('modal').classList.add('open')});
  document.getElementById('modalClose').addEventListener('click',()=>document.getElementById('modal').classList.remove('open'));
  document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modal').classList.remove('open');if(e.key==='ArrowLeft')settle(index-1);if(e.key==='ArrowRight')settle(index+1)});
  render();
})();
</script>
</body>
</html>
