:root{--bg:#0d1415;--shell:#17231e;--surface:#1b2c24;--edge:#3f6450;--text:#f0f5ee;--muted:#b7cbbd;--green:#66c58a;--gold:#d9ad67;--blue:#6da8ad;--violet:#a19ac4;--coral:#d7786c}
*{box-sizing:border-box}html,body{margin:0;background:#09130e;color:var(--text);font-family:"PingFang SC","Noto Sans CJK SC",sans-serif}body{min-width:1024px}
button{font:inherit;cursor:pointer}button:focus-visible,.card:focus-visible{outline:3px solid #a4e6b5;outline-offset:3px}.number{font-family:PlexMono,monospace;font-variant-numeric:tabular-nums}
.screen{width:1024px;height:600px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg);border:1px solid #365a44;border-radius:16px;box-shadow:0 18px 45px #0009}
.head{height:70px;padding:0 24px;display:flex;align-items:center;gap:16px;background:var(--shell);border-bottom:1px solid #2d4939}.brand-symbol{width:30px;height:30px;display:grid;place-items:center;color:#dce9dd;font-size:25px}.brand{font-size:26px;letter-spacing:.07em;font-weight:600}.brand em{font:italic 19px Georgia,serif;letter-spacing:0;color:#aec5b0}.divider{height:30px;width:1px;background:#3c5b48}.go{font-size:26px;color:var(--green)}.head-right{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:20px}.avatar{height:32px;width:32px;display:grid;place-items:center;border-radius:50%;background:var(--green);color:#133521}.clock{font-size:22px}
.main{position:relative;height:448px;padding:12px 24px 0}.intro{height:56px;display:flex;align-items:flex-start;justify-content:space-between}.intro strong{font-size:30px;line-height:35px;font-weight:600}.intro p{margin:1px 0 0;color:var(--muted);font-size:17px}.groups{display:flex;gap:4px;align-items:center;padding:4px;border:1px solid #35533f;border-radius:15px;background:#182820;box-shadow:inset 0 1px 2px #0009,0 1px 0 #48614e}.groups button{height:44px;min-width:103px;padding:0 11px;border:0;border-radius:11px;background:transparent;color:#bfd1c2;font-size:17px;white-space:nowrap}.groups button.on{color:#f1f7f0;background:linear-gradient(#355b43,#244434);box-shadow:inset 0 1px 0 #ffffff55,0 3px 5px #0009}.groups button:active{transform:translateY(2px);box-shadow:inset 0 2px 5px #06120aaa}
.deck{height:336px;position:relative;perspective:1050px;perspective-origin:50% 45%;touch-action:pan-y;user-select:none;cursor:grab}.deck.dragging{cursor:grabbing}.deck:after{content:"";position:absolute;left:28%;right:28%;height:22px;bottom:2px;background:#0009;filter:blur(13px);border-radius:50%;pointer-events:none}
.card{position:absolute;left:50%;top:50%;width:490px;height:307px;padding:18px 21px 15px;border:1px solid #6a9475;border-radius:24px;background:linear-gradient(150deg,#294a36 0%,#1d3228 37%,#17271f 100%);box-shadow:inset 0 2px 0 #ffffff40,inset 0 -3px 0 #0b1d12,0 6px 0 #0a1a10,0 17px 28px #000b;backface-visibility:hidden;transform-style:preserve-3d;will-change:transform;overflow:hidden}.card:before{content:"";position:absolute;inset:0 0 auto;height:53px;border-radius:23px 23px 0 0;background:linear-gradient(#ffffff24,#ffffff00);pointer-events:none}.card[aria-current="true"]{border-color:#81c998}.card[data-side]:not([aria-current="true"]) .card-head,.card[data-side]:not([aria-current="true"]) .legend,.card[data-side]:not([aria-current="true"]) .unknown-copy,.card[data-side]:not([aria-current="true"]) .enter{opacity:0;pointer-events:none}.card[data-side="right"]:not([aria-current="true"]) .chart{transform:translateX(300px)}.card .card-head,.card .legend,.card .unknown-copy,.card .enter{transition:opacity 160ms ease}.side-rank{position:absolute;z-index:3;top:27px;opacity:0;transition:opacity 160ms ease;font-size:29px;font-weight:600;text-shadow:0 2px 5px #000}.card[data-side="left"] .side-rank{left:22px;opacity:1}.card[data-side="right"] .side-rank{right:22px;opacity:1}
.card-head{height:61px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid #53735b}.rank{font-size:35px;line-height:38px;font-weight:600}.count{margin-top:8px;color:#d1e0d3;font-size:18px}.card-body{display:flex;align-items:center;gap:20px;height:164px}.chart{width:142px;height:142px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--pie);box-shadow:0 4px 14px #0009,inset 0 2px 3px #ffffff50;position:relative;transition:transform 250ms ease}.chart:before{content:"";position:absolute;inset:31px;background:#172a20;border-radius:50%;box-shadow:inset 0 2px 5px #000b,0 1px 1px #ffffff4d}.chart-inner{z-index:1;display:flex;align-items:center;flex-direction:column;line-height:1.15}.chart-inner b{font-size:23px;font-weight:600}.chart-inner small{font-size:15px;color:#c4d7c8}.unknown .chart{background:#1a3023;border:8px dashed #5e8068;box-shadow:0 4px 14px #0007}.unknown .chart:before{inset:20px;background:#1a3023;box-shadow:none}.unknown .chart-inner b{font-size:17px;color:#d4e1d6}.unknown .chart-inner small{font-size:14px}
.legend{flex:1;display:grid;grid-template-columns:1fr;gap:4px;align-content:center}.legend-line{display:grid;grid-template-columns:10px 1fr 62px 51px;align-items:center;gap:7px;white-space:nowrap;font-size:17px}.legend-line i{width:10px;height:10px;border-radius:3px;background:var(--swatch)}.legend-line b{color:#e5f0e5;font-size:17px;font-weight:500;text-align:right}.legend-line small{color:#afcbb6;font-size:15px;text-align:right}.unknown-copy{font-size:21px;line-height:1.5;color:#c5d5c8}.unknown-copy span{display:block;font-size:16px;color:#a9c0af}
.enter{height:50px;width:100%;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border:1px solid #7cd69b;border-radius:14px;background:linear-gradient(#6ccc91,#52ac74);box-shadow:inset 0 2px 0 #ffffff6b,inset 0 -3px 0 #2c7048,0 4px 8px #0009;color:#0e2918;font-size:21px;font-weight:600}.enter span:first-child{display:flex;align-items:center;gap:10px}.enter svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.enter:active{transform:translateY(3px);box-shadow:inset 0 3px 5px #286b44}
.nav{position:absolute;z-index:100;top:48%;height:48px;width:48px;border:1px solid #75ad83;border-radius:50%;background:linear-gradient(#31553e,#1c3528);color:#ebf6eb;box-shadow:inset 0 2px 0 #ffffff44,0 3px 0 #0a1b10,0 8px 16px #000a;display:grid;place-items:center}.nav:hover{border-color:#9cdcaa}.nav:active{transform:translateY(3px);box-shadow:inset 0 3px 5px #05130a}.nav.prev{left:13px}.nav.next{right:13px}.nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}
.deck-foot{position:absolute;left:0;right:0;bottom:3px;display:flex;align-items:center;justify-content:center;gap:16px;color:#b6cfbb;font-size:16px}.track{width:156px;height:4px;display:flex;gap:4px}.track span{height:4px;flex:1;border-radius:4px;background:#3d6248}.track span.on{background:#76d39b}.hint{position:absolute;right:27px;bottom:0;color:#94b7a0;font-size:15px}
.dock{position:absolute;left:0;right:0;bottom:0;height:82px;padding:7px 14px;display:grid;grid-template-columns:repeat(7,1fr);gap:5px;border-top:1px solid #314c3b;background:#17231e}.dock button{border:0;border-radius:13px;background:linear-gradient(#22362b,#16251d);box-shadow:inset 0 1px 0 #ffffff26,0 3px 3px #0007;color:#c4d5c7;font-size:19px}.dock button.on{background:linear-gradient(#69c88e,#52af79);color:#0c2d19;box-shadow:inset 0 2px 0 #ffffff68,0 4px 6px #0009}.dock button:active{transform:translateY(2px)}.dock button{display:flex;align-items:center;justify-content:center;gap:7px}.dock svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.toast{position:absolute;z-index:200;top:105px;left:50%;max-width:500px;padding:12px 20px;border:1px solid #73bf8a;border-radius:13px;background:#1b3624;color:#e8f8eb;box-shadow:0 9px 25px #000a;font-size:18px;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){.card,.nav,.enter,.groups button{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="screen" role="application" aria-label="训练营首页 3D 轮播设计原型">
  <header class="head"><div class="brand-symbol">✦</div><div class="brand">智星盒 <em>StellaBox</em></div><div class="divider"></div><div class="go">围棋</div><div class="head-right"><div class="avatar">F</div><span>fan</span><span class="clock number">02:08</span></div></header>
  <main class="main"><div class="intro"><div><strong>训练营</strong><p>左右滑动卡片，选择棋力</p></div><div class="groups" role="tablist" aria-label="棋力范围"></div></div>
    <button class="nav prev" type="button" aria-label="上一棋力"><svg viewBox="0 0 24 24"><path d="m15 4-8 8 8 8"/></svg></button>
    <div class="deck" role="region" aria-label="棋力卡片轮播"></div>
    <button class="nav next" type="button" aria-label="下一棋力"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8"/></svg></button>
    <div class="deck-foot"><span class="number" id="position-label">01 / 05</span><div class="track" aria-hidden="true"></div></div><span class="hint">可拖动卡片 · 松手吸附</span>
  </main>
  <nav class="dock" aria-label="主导航"><button><svg viewBox="0 0 24 24"><path d="M6 8h12l3 8-2 3-4-2H9l-4 2-2-3zM8 11v5m-2-2h4m7-2h.01m2 3h.01"/></svg>对弈</button><button class="on" aria-current="page"><svg viewBox="0 0 24 24"><path d="M8 3h8v5h5v8h-5v5H8v-5H3V8h5z"/></svg>训练营</button><button><svg viewBox="0 0 24 24"><path d="M4 4h7v16H4zM13 4h7v16h-7zM7 8h1m-1 4h1m8-4h1m-1 4h1"/></svg>棋谱</button><button><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 9h18M3 15h18M9 3v18m6-18v18"/></svg>复盘</button><button><svg viewBox="0 0 24 24"><path d="m3 18 6-6 4 3 7-9m-5 0h5v5"/></svg>成长</button><button><svg viewBox="0 0 24 24"><path d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1zm0 0v15"/></svg>课程</button><button><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2"/></svg>设置</button></nav>
</div>
<script>
(() => {
  const groups=[{label:'15–11 级',ranks:['15 级','14 级','13 级','12 级','11 级']},{label:'10–6 级',ranks:['10 级','9 级','8 级','7 级','6 级']},{label:'5–1 级',ranks:['5 级','4 级','3 级','2 级','1 级']},{label:'1–7 段',ranks:['1 段','2 段','3 段','4 段','5 段','6 段','7 段']}];
  const known=[['吃子',630,'#d9ad67'],['死活',167,'#66c58a'],['手筋',139,'#a19ac4'],['对杀',63,'#6da8ad'],['官子',1,'#d7786c']];
  const groupsEl=document.querySelector('.groups'),deck=document.querySelector('.deck'),track=document.querySelector('.track'),posLabel=document.querySelector('#position-label');
  let group=0,index=0,position=0,drag=null,dragFrame=0,snapFrame=0,ignoreClickUntil=0,toastTimer=0,cards=[];
  const mod=(v,n)=>(v%n+n)%n;
  function pieStyle(){let start=0;return 'conic-gradient('+known.map(([,count,color])=>{const a=start;start+=count/1000*100;return `${color} ${a}% ${start}%`}).join(',')+')'}
  function cardHtml(rank,i){const isKnown=rank==='15 级';return `<article class="card ${isKnown?'':'unknown'}" data-index="${i}" tabindex="${i===index?'0':'-1'}" aria-label="${rank} ${isKnown?'1000 题，查看题型构成':'题型数据待读取'}"><div class="side-rank number">${rank}</div><div class="card-head"><strong class="rank"><span class="number">${rank.split(' ')[0]}</span> ${rank.split(' ')[1]}</strong><span class="count">${isKnown?'<span class="number">1000</span> 题':'题量待读取'}</span></div><div class="card-body"><div class="chart" style="--pie:${isKnown?pieStyle():''}" role="img" aria-label="${isKnown?'题型比例：吃子 63%，死活 16.7%，手筋 13.9%，对杀 6.3%，官子 0.1%':'题型比例待读取'}"><div class="chart-inner">${isKnown?'<b class="number">1000</b><small>道题</small>':'<b>待读取</b><small>题型比例</small>'}</div></div>${isKnown?`<div class="legend">${known.map(([name,count,color])=>`<div class="legend-line" style="--swatch:${color}"><i></i><span>${name}</span><b class="number">${(count/10).toFixed(1)}%</b><small class="number">${count}题</small></div>`).join('')}</div>`:'<div class="unknown-copy">题型比例暂无数据<span>该棋力仍可进入题型</span></div>'}</div><button class="enter" type="button" data-enter="${rank}" aria-label="进入 ${rank} 题型"><span><svg viewBox="0 0 24 24"><path d="M7 4h10v16H7zM9 7h6M9 11h6M9 15h4"/></svg>进入 ${rank} 题型</span><svg viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button></article>`}
  function closestDelta(i,p,n){let d=i-p;while(d>n/2)d-=n;while(d<-n/2)d+=n;return d}
  function layout(){const n=cards.length;cards.forEach((card,i)=>{const d=closestDelta(i,position,n),a=Math.abs(d);const x=d*275/(1+a*.07),scale=Math.max(.61,1-a*.13),z=-a*105,yaw=Math.max(-32,Math.min(32,-d*17));card.style.transform=`translate3d(calc(-50% + ${x}px),-50%,${z}px) rotateY(${yaw}deg) scale(${scale})`;card.style.opacity=a>1.55?'0':String(Math.max(.91,1-a*.04));const side=d<-.5?'left':d>.5?'right':'';if(card.dataset.side!==side)card.dataset.side=side;const layer=String(90-Math.round(a*20));if(card.style.zIndex!==layer)card.style.zIndex=layer;const pointer=a>1.45?'none':'auto';if(card.style.pointerEvents!==pointer)card.style.pointerEvents=pointer;const current=Math.abs(d)<.5?'true':'false';if(card.getAttribute('aria-current')!==current){card.setAttribute('aria-current',current);card.tabIndex=current==='true'?0:-1}});let active=mod(Math.round(position),n);posLabel.textContent=String(active+1).padStart(2,'0')+' / '+String(n).padStart(2,'0');[...track.children].forEach((el,i)=>el.classList.toggle('on',i===active))}
  function render(){cancelAnimationFrame(dragFrame);cancelAnimationFrame(snapFrame);drag=null;groupsEl.innerHTML=groups.map((g,i)=>`<button role="tab" type="button" data-group="${i}" aria-selected="${i===group}" class="${i===group?'on':''}">${g.label}</button>`).join('');const ranks=groups[group].ranks;deck.innerHTML=ranks.map(cardHtml).join('');track.innerHTML=ranks.map(()=>'<span></span>').join('');cards=[...deck.querySelectorAll('.card')];position=0;index=0;layout()}
  function settle(target){cancelAnimationFrame(snapFrame);cancelAnimationFrame(dragFrame);const start=position,distance=target-start,n=cards.length;index=mod(target,n);if(Math.abs(distance)<.001){position=index;layout();return}const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,duration=reduced?0:Math.min(410,270+Math.abs(distance)*70),started=performance.now();const tick=now=>{const t=duration?Math.min(1,(now-started)/duration):1,eased=1-Math.pow(1-t,3);position=start+distance*eased;layout();if(t<1)snapFrame=requestAnimationFrame(tick);else{snapFrame=0;position=index;layout()}};snapFrame=requestAnimationFrame(tick)}
  function go(step){if(drag)return;settle(Math.round(position)+step)}
  document.querySelector('.prev').addEventListener('click',()=>go(-1));document.querySelector('.next').addEventListener('click',()=>go(1));
  groupsEl.addEventListener('click',e=>{const b=e.target.closest('[data-group]');if(!b)return;group=Number(b.dataset.group);render()});
  deck.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;cancelAnimationFrame(snapFrame);snapFrame=0;drag={id:e.pointerId,startX:e.clientX,lastX:e.clientX,startPos:position,lastTime:performance.now(),velocity:0,moved:false}});
  deck.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.startX;if(!drag.moved){if(Math.abs(dx)<7)return;drag.moved=true;deck.setPointerCapture(e.pointerId);deck.classList.add('dragging')}const now=performance.now(),dt=Math.max(1,now-drag.lastTime);drag.velocity=.55*drag.velocity+.45*(e.clientX-drag.lastX)/dt;drag.lastX=e.clientX;drag.lastTime=now;position=drag.startPos-dx/270;cancelAnimationFrame(dragFrame);dragFrame=requestAnimationFrame(layout)});
  function finish(e){if(!drag||drag.id!==e.pointerId)return;const d=drag;drag=null;deck.classList.remove('dragging');if(!d.moved){if(Math.abs(position-Math.round(position))>.001)settle(Math.round(position));return;}ignoreClickUntil=performance.now()+420;cancelAnimationFrame(dragFrame);position=d.startPos-(d.lastX-d.startX)/270;layout();let target=Math.round(position-d.velocity*.24);if(target===Math.round(d.startPos)&&(Math.abs(d.lastX-d.startX)>48||Math.abs(d.velocity)>.6))target=Math.round(d.startPos)+Math.sign(d.startX-d.lastX);settle(target)}
  deck.addEventListener('pointerup',finish);deck.addEventListener('pointercancel',finish);
  deck.addEventListener('click',e=>{if(performance.now()<ignoreClickUntil){e.preventDefault();e.stopPropagation();return}const c=e.target.closest('.card');if(!c)return;const target=Number(c.dataset.index),n=groups[group].ranks.length,d=closestDelta(target,position,n);if(Math.abs(d)>.45){settle(Math.round(position+d));return}const enter=e.target.closest('[data-enter]');if(enter){const rank=enter.dataset.enter;const message=rank==='15 级'?'进入 15 级题型：死活、手筋、对杀、吃子、官子、综合训练':`进入 ${rank} 题型（原型演示）`;let toast=document.querySelector('.toast');if(!toast){toast=document.createElement('div');toast.className='toast';document.querySelector('.screen').appendChild(toast)}toast.textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.remove(),2600)}});
  window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){go(-1);e.preventDefault()}if(e.key==='ArrowRight'){go(1);e.preventDefault()}});
  render();
})();
</script>
</body>
</html>
