// Numeric glyphs use IBM Plex Mono without changing the Chinese or branded typefaces.
function applyPlexNumerals(root){
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const nodes=[];
  while(walker.nextNode()){
    const node=walker.currentNode;
    if(!/[0-9]/.test(node.nodeValue))continue;
    const parent=node.parentElement;
    if(!parent||parent.closest('.kiosk-plex-num,script,style,select,option,textarea,title')||parent.namespaceURI==='http://www.w3.org/2000/svg')continue;
    nodes.push(node);
  }
  for(const node of nodes){
    const fragment=document.createDocumentFragment();
    for(const part of node.nodeValue.split(/([0-9]+)/)){
      if(!part)continue;
      if(/^[0-9]+$/.test(part)){
        const span=document.createElement('kiosk-num');span.className='kiosk-plex-num';span.textContent=part;fragment.appendChild(span);
      }else fragment.appendChild(document.createTextNode(part));
    }
    node.replaceWith(fragment);
  }
  root.querySelectorAll('svg text,svg tspan').forEach(el=>{
    if(/[0-9]/.test(el.textContent))el.style.fontFamily='"Kiosk Plex Mono", monospace';
  });
}
const numeralsObserver=new MutationObserver(()=>{
  const proposal=document.getElementById('proposal-layer');
  if(proposal)applyPlexNumerals(proposal);
  applyPlexNumerals(document.getElementById('modal-root'));
  window.KioskDesignTypography.apply();
});
numeralsObserver.observe(document.getElementById('stage'),{childList:true,subtree:true,characterData:true});
numeralsObserver.observe(document.getElementById('modal-root'),{childList:true,subtree:true,characterData:true});
const mix=document.getElementById('mix');
function updateMix(){
  const layer=document.getElementById('proposal-layer');
  if(layer){layer.style.opacity=Number(mix.value)/100;layer.style.pointerEvents=Number(mix.value)>0?'auto':'none'}
  const currentLabel=document.querySelector('#stage .stage-label.current');
  const proposedLabel=document.querySelector('#stage .stage-label.proposed');
  if(currentLabel)currentLabel.style.opacity=1-Number(mix.value)/100;
  if(proposedLabel)proposedLabel.style.opacity=Number(mix.value)/100;
  document.getElementById('mix-value').textContent=mix.disabled?'—':`${mix.value}%`;
}
function resize(){document.querySelectorAll('.stage-host').forEach(host=>host.querySelector('.stage').style.transform=`scale(${host.clientWidth/1024})`)}
function render(){
  const s=byId[active];
  chooser.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id===active));
  const img=s.current?`<img src="${root+s.current}" alt="${s.name} RK3562 实拍">`:'';
  const changed=overlays(s);
  document.getElementById('stage').innerHTML=img+`<div class="proposal-overlay" id="proposal-layer">${changed}</div>`;
  applyPlexNumerals(document.getElementById('proposal-layer'));
  window.KioskDesignTypography.apply();
  window.KioskTrainingInit?.();
  window.KioskReportInit?.();
  window.KioskPersonalReviewInit?.(s.id);
  mix.disabled=s.designOnly||!changed.trim();
  if(s.designOnly)mix.value=100;
  document.getElementById('stage-status').textContent=s.designOnly?'新增设计预览 · 无对应实机截图':mix.disabled?'本页提案保留实机原样':'滑杆左端看实机，右端看提案';
  document.getElementById('intro').innerHTML=`<b>${s.name}</b>　${s.status}。${s.designOnly?'此页为 1024 × 600 新增提案，未使用其他设置页冒充实拍。':'左端为 RK3562 实拍，右端为同尺寸改版提案。'}`;
  document.getElementById('note').innerHTML=`<b>本页设计判断：</b>${note(s)}`;
  window.KioskGameInit?.();
  history.replaceState(null,'','#'+active);
  updateMix();resize();
}

document.getElementById('modal-root').onclick=e=>{if(e.target.closest('[data-read-help]')){if('speechSynthesis' in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(window.kioskLastHelpText||''))}return}if(e.target.closest('[data-close-help]')||e.target.classList.contains('modal'))document.getElementById('modal-root').innerHTML=''};

function releaseTactileTargets(){document.querySelectorAll('#stage .is-pressing, #modal-root .is-pressing').forEach(element=>setTimeout(()=>element.classList.remove('is-pressing'),150))}
document.addEventListener('pointerdown',e=>{const target=tactileTarget(e.target);if(target)target.classList.add('is-pressing')});

document.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const target=tactileTarget(e.target);if(target)target.classList.add('is-pressing')}});
