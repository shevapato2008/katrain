 "真实设备标签", "current": "docs/design/kiosk-evidence-2026-10-14/current/settings-4-device.png", "prior": null, "status": "实机截图；旧稿缺失"}, {"id": "settings-language", "group": "设置", "name": "设置 · 语言", "note": "真实设备标签", "current": "docs/design/kiosk-evidence-2026-10-14/current/settings-5-device.png", "prior": null, "status": "实机截图；旧稿缺失"}, {"id": "settings-about", "group": "设置", "name": "设置 · 关于", "note": "真实设备标签", "current": "docs/design/kiosk-evidence-2026-10-14/current/settings-6-device.png", "prior": null, "status": "实机截图；旧稿缺失"}, {"id": "golaxy-room-join", "group": "跨平台", "name": "星阵房间 · 加入", "note": "真实设备标签", "current": "docs/design/kiosk-evidence-2026-10-14/current/golaxy-room-join-device.png", "prior": null, "status": "实机截图；旧稿缺失"}, {"id": "books-chapter-open", "group": "课程", "name": "书目 · 章节展开", "note": "真实设备展开状态", "current": "docs/design/kiosk-evidence-2026-10-14/current/books-chapter-open-device.png", "prior": null, "status": "实机截图；旧稿缺失"}, {"id": "kifu-replay", "group": "棋谱", "name": "棋谱 · 回放", "note": "真实设备回放页", "current": "docs/design/kiosk-evidence-2026-10-14/current/kifu-replay-device.png", "prior": null, "status": "实机截图；旧稿缺失"}];const root='../../';
let active='play';
const byId=Object.fromEntries(screens.map(x=>[x.id,x]));
const nav=document.getElementById('nav');
const groups=[...new Set(screens.map(x=>x.group))];
nav.innerHTML=groups.map(group=>`<div class="nav-group">${group}</div>${screens.filter(x=>x.group===group).map(x=>`<button type="button" data-id="${x.id}" title="${x.name}">${x.name}</button>`).join('')}`).join('');
const mix=document.getElementById('mix');
function updateMix(){
  const overlay=document.querySelector('#shot .overlay');
  if(overlay)overlay.style.opacity=Number(mix.value)/100;
  const currentLabel=document.querySelector('#shot .shot-label.current');
  const priorLabel=document.querySelector('#shot .shot-label.prior');
  if(currentLabel)currentLabel.style.opacity=1-Number(mix.value)/100;
  if(priorLabel)priorLabel.style.opacity=Number(mix.value)/100;
  document.getElementById('mix-value').textContent=mix.disabled?'—':`${mix.value}%`;
}
function render(){
  const s=byId[active];
  nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id===active));
  document.getElementById('summary').innerHTML=`<b>${s.name}</b>　${s.status}`;
  const current=s.current?`<img src="${root+s.current}" alt="${s.name} RK3562 实机截图">`:'';
  const prior=s.prior?`<img src="${root+s.prior}" alt="${s.name} 旧设计稿截图">`:'';
  const both=Boolean(s.current&&s.prior);
  document.getElementById('shot').innerHTML=both?`${current}<div class="overlay">${prior}</div>`:current||prior||`<div class="missing">当前设备和旧稿均无可展示画面</div>`;
  mix.disabled=!both;
  document.getElementById('stage-status').textContent=both?'滑杆左端看实机，右端看旧稿':s.current?'旧稿没有对应画面':'设备没有对应可进入画面';
  updateMix();
  document.getElementById('notes').innerHTML=`<strong>核对备注</strong>：${s.note}。${s.current?'实机画面来自设备浏览器。':'当前设备没有对应可进入页面；旧稿不能视作现状。'}${s.id==='report'?' 真实报告包含推荐、走势、妙手、失误、发挥水准、AI 吻合度六个标签，以及下方操作栏和回放栏；旧稿缺少这些结构。':''}${s.id==='growth'?' 真实成长页包含段位、净胜分、近 30 天、全年题目热图、能力诊断和对手强度；旧稿基本没有复现。':''}`;
  history.replaceState(null,'','#'+s.id);
}
nav.onclick=e=>{const button=e.target.closest('button[data-id]');if(!button)return;active=button.dataset.id;render();button.scrollIntoView({block:'center'})};
mix.oninput=updateMix;
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(byId[id]){active=id;render();nav.querySelector(`[data-id="${id}"]`)?.scrollIntoView({block:'center'})}});
active=byId[location.hash.slice(1)]?location.hash.slice(1):'play';
render();
nav.querySelector(`[data-id="${active}"]`)?.scrollIntoView({block:'center'});
</script></body></html>
