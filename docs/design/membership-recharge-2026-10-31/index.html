<script>
(()=>{
'use strict';
const params=new URLSearchParams(location.search);

const plans=Object.freeze({plus:{name:'Plus',price:39,term:9030,week:3010,weeklyReports:10,saving:56.8,fold:'4.32'},pro:{name:'Pro',price:99,term:27090,week:9030,weeklyReports:30,saving:63.5,fold:'3.65'},max:{name:'Max',price:199,term:72240,week:24080,weeklyReports:80,saving:72.5,fold:'2.75'}});
const fixedNow=Date.parse('2026-11-01T04:00:00Z'),started=performance.now(),termEnd='2026-12-01T04:00:00Z';
const validStates=new Set([...$('scenario').options].map(o=>o.value));
const state={scenario:validStates.has(params.get('state'))?params.get('state'):'pro',tab:['usage','topup','plans'].includes(params.get('tab'))?params.get('tab'):'topup',online:true,plan:'pro',credits:1000,amount:30,profile:'standard',lastLoaded:fixedNow,order:null,seq:0,fulfilled:new Set(),scheduled:[],boundaryFresh:false,boundaryAt:null};

const points=credits=>(credits/100).toFixed(2);

const tell=message=>{$('toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('toast').textContent='';},3500);};

 if(!accountReady())return `<div class="banner" role="status">${state.scenario==='loading'?'正在读取示例账户，余额与会员状态待确认。':'示例账户读取失败，请重新载入。'}确认前无法创建订单。</div>`;
 return !state.online?'<div class="banner" role="status">当前离线，以下为上次载入的示例数据。恢复联网并重新载入后，才可继续购买；本页不连接真实账户。</div>':'';
}

function rates(){
 const advanced=state.profile==='advanced';
 return `<section class="panel rate-panel" aria-label="API 分析价目"><div class="rates"><div class="section-head"><h2>每手分析，花多少积分？</h2><span class="eyebrow">API 固定费率 · 1 元 = 1 积分</span></div><table class="rates-table"><thead><tr><th scope="col">分析档位</th><th scope="col">计算深度</th><th scope="col">平均每手</th><th scope="col">单个局面</th></tr></thead><tbody><tr><td>普通分析</td><td><span class="mono">500</span> <small>visits</small></td><td><span class="rate-value mono">0.01</span><span class="cost-unit">积分 / 手</span></td><td><span class="mono">0.01</span> <small>积分</small></td></tr><tr><td>高级分析</td><td><span class="mono">2000</span> <small>visits</small></td><td><span class="rate-value mono">0.04</span><span class="cost-unit">积分 / 手</span></td><td><span class="mono">0.04</span> <small>积分</small></td></tr></tbody></table><p class="rate-caption">同一分析结果同时包含领地与支招；报告与单局面采用相同局面单价。</p></div><div class="report-example"><div class="example-title"><span>300 手整盘试算</span><div class="mini-toggle" role="group" aria-label="整盘试算档位"><button data-profile="standard" aria-pressed="${!advanced}">普通</button><button data-profile="advanced" aria-pressed="${advanced}">高级</button></div></div><div class="report-total"><strong class="mono">${advanced?'12.04':'3.01'}</strong><span>积分 / 盘</span></div><p>包含初始局面，共 <span class="mono">301</span> 个局面。<br>普通平均约 0.01 积分/手，高级约 0.04 积分/手。</p><p class="formula">301 × ${advanced?'0.04':'0.01'} = ${advanced?'12.04':'3.01'} · 实际按手数加初始局面报价</p></div></section>`;
}

tton></div>`;}

 const cells=(label,renderCell,cls='')=>Object.entries(plans).map(([code,p])=>`<div class="matrix-cell ${cls} ${code==='pro'?'matrix-current':''}" data-plan="${code}" data-label="${label}"><div>${renderCell(p,code)}</div></div>`).join('');
 return `${banner()}<div class="plan-intro"><div><h2>30 天会员，按你的用量选</h2><p>按 30 天额度用满计算；实际优惠随用量变化。</p></div><span class="tag quiet">配置价格 · 设计预览</span></div><section class="panel plan-matrix" aria-label="30 天会员比较"><div class="matrix-grid"><div class="matrix-heading matrix-caption"><strong>同等分析量<br>与 API 按需付费对比</strong><small>按 30 天额度用满计算<br>实际优惠随用量变化</small></div>${Object.entries(plans).map(([code,p])=>`<div class="matrix-heading ${code==='pro'?'matrix-current':''}" data-plan="${code}"><div class="plan-name"><h3>${p.name}</h3>${code==='max'?'<span class="tag quiet">暂未开放</span>':ready&&state.plan===code?'<span class="tag">当前会员</span>':''}</div><div class="plan-price mono">¥${p.price}<small>/ 30 天</small></div></div>`).join('')}<div class="matrix-label matrix-emphasis">比 API 更省</div>${cells('比 API 更省',p=>`<span class="saving">约省 <span class="mono">${p.saving}%</span></span><small>约 ${p.fold} 折</small>`,'matrix-emphasis')}<div class="matrix-label">普通报告</div>${cells('普通报告',p=>`<span class="approx">每周最多约</span> <span class="mono">${p.weeklyReports}</span> <span class="approx">盘</span>`)}<div class="matrix-label">购买会员</div>${Object.entries(plans).map(([code,p])=>`<div class="matrix-action ${code==='pro'?'matrix-current':''}" data-plan="${code}"><button data-buy="${code}" class="${code==='pro'?'primary':''}" ${code==='max'||!canBuy()?'disabled':''}>${code==='max'?'暂未开放':ready&&state.plan===code?'续费 '+p.name:'选择 '+p.name}</button><small>${code==='max'?'容量确认后开放':'TEST 订单 · 配置价格'}</small></div>`).join('')}</div></section><p class="plans-note">按每盘 300 手估算，受本期剩余限制。高级报告消耗约 4 倍。<br>每周一 00:00（北京时间）恢复本周额度；本期额度随会员到期结束，不因周重置恢复。付费会员不叠加 Free 报告资格。</p><div class="compare-api"><div><h3>偶尔分析，也可以按需充值</h3><p>API 无需订阅：普通约 <span class="mono">0.01</span> 积分/手，高级约 <span class="mono">0.04</span> 积分/手；1 元 = 1 积分。</p></div><button data-tab="topup">查看 API 充值</button></div><div class="page-foot"><p>${ready?`当前 ${state.plan==='free'?'Free':plans[state.plan].name} · ${state.plan==='free'?'每自然周 1 份普通报告的独立领取资格。':`示例有效期至 ${bj(termEnd)}。续费不重置已用与预留额度。`}${state.scheduled.length?` 已确认 ${state.scheduled.map(s=>plans[s].name).join('、')} TEST 订单。`:''}`:'账户状态待确认，购买入口暂不可用。'}</p><button class="text-button" data-explain="membership">会员额度规则</button></div>`;
}
function snapshot(){
 const p=plans[state.plan]||plans.pro,unused=state.scenario==='not-started';
 const termUsed=unused?0:9030,termReserved=unused||state.scenario==='exhausted'?0:301;
 const weekUsed=state.scenario==='exhausted'?p.week:unused?0:state.boundaryFresh?0:1505;
 const weekReserved=unused||state.scenario==='exhausted'||state.boundaryFresh?0:301;
 return {term:{limit:p.term,used:termUsed,reserved:termReserved,left:Math.max(0,p.term-termUsed-termReserved)},week:{limit:p.week,used:weekUsed,reserved:weekReserved,left:Math.max(0,p.week-weekUsed-weekReserved)}};
}
function countdown(date){
 const sec=Math.max(0,Math.ceil((new Date(date).getTime()-now())/1000));
 if(!sec)return state.online?'已到重置时间 · 等待重新载入':'已到重置时间 · 数据待刷新';
 const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60),s=sec%60;
 return `${d?d+'天 ':''}${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} 后恢复`;
}
function quotaRow(q,weekly){
 const reset=state.scenario==='boundary'&&!state.boundaryFresh?state.boundaryAt:'2026-11-01T16:00:00Z';
 const remaining=q.left/q.limit*100,consumed=100-remaining;
 return `<section class="quota-row"><div class="quota-top"><h3>${weekly?'本周剩余':'本期剩余'}</h3><span class="quota-value"><strong class="mono">${remaining.toFixed(1)}%</strong></span></div><div class="bar ${q.left===0?'empty':''}" role="progressbar" aria-label="${weekly?'本周':'本期'}剩余" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${remaining.toFixed(1)}" aria-valuetext="剩余 ${remaining.toFixed(1)}%"><i style="--remaining:${remaining}%"></i></div><div class="quota-details"><span>已用及分析中 <span class="mono">${consumed.toFixed(1)}%</span></span><span>${weekly?`<span data-countdown="${new Date(reset).toISOString()}">${state.boundaryFresh?'已恢复 · 示例已重新载入':countdown(reset)}</span>`:`至 ${bj(termEnd)} 到期`}</span></div><p class="quota-detail-line">${weekly?'每周一 00:00（北京时间）恢复本周额度。':'30 天有效期，到期结束；周一恢复不增加本期额度。'}</p></section>`;
}
function usage(){
 if(!accountReady())return `<section class="empty-state" role="${state.scenario==='error'?'alert':'status'}"><strong>${state.scenario==='loading'?'正在读取示例账户…':'暂时无法读取示例账户'}</strong><p>可用额度与积分余额待确认，扣费来源待确认，暂不可开始分析或购买。</p>${state.scenario==='error'?'<button data-reload>重新载入示例</button>':''}</section>`;
 const free=state.plan==='free',q=free?null:snapshot(),memberAvailable=!free&&Math.min(q.term.left,q.week.left)>0;
 const source=!state.online?'离线 · 扣费来源待确认':memberAvailable?'当前使用会员额度':state.credits>0?'接下来使用 API 积分':'需充值或等待额度恢复';
 const policy=!state.online?'当前为上次载入的数据。恢复联网并确认账户与报价后，才可开始分析。':!free&&!memberAvailable?(state.credits>0?'本周会员额度已用完，接下来使用 API 积分。':'会员额度与 API 积分不足，请充值或等待额度恢复。'):'优先使用会员额度，用尽后使用 API 积分。';
 const main=free?`<section class="panel free-eligibility"><div class="section-head"><h2>Free · 本周普通报告资格</h2><span class="tag quiet">独立领取资格</span></div><div class="free-status">本周剩余 <span class="mono">0 / 1</span> 份</div><p>本周已使用。Free 每自然周可领取 1 份普通报告，需满足身份验证条件。此权益是独立的报告领取资格。</p><p style="margin-top:14px">下次恢复：11/02 00:00 北京时间。付费会员不再叠加额外 Free 报告。</p><button class="text-button" data-tab="plans" style="margin-top:16px">比较会员与 API →</button></section>`:`<section class="panel panel-pad"><div class="available-summary"><div><h2>会员额度</h2><p>${policy}</p></div><span class="tag ${!state.online||!memberAvailable?'quiet':''}">${source}</span></div>${quotaRow(q.term,false)}${quotaRow(q.week,true)}<div class="usage-rules">本期、本周分别显示剩余比例，一次分析需同时满足两项剩余。<br>分析中的预留已计入使用比例，失败后归还；高级报告消耗约 4 倍。</div></section>`;
 return `${banner()}<div class="usage-grid">${main}<aside class="usage-aside"><section class="panel account-panel"><span class="label">当前会员</span><div class="current-plan"><strong>${free?'Free':plans[state.plan].name}</strong><span class="tag">${free?'基础权益':'使用中'}</span></div><p>${free?'每自然周 1 份普通报告资格':`有效期至 ${bj(termEnd)}<br>续费不重置已用与预留额度`}</p>${state.scheduled.length?`<p style="margin-top:8px">已确认 ${state.scheduled.map(s=>plans[s].name).join('、')} TEST 订单<br>当前额度保持原示例</p>`:''}<button data-tab="plans">${free?'比较会员':'查看会员方案'}</button></section><section class="panel account-panel"><span class="label">API 积分余额</span><div class="wallet-aside mono" data-wallet-points>${points(state.credits)}<small>积分</small></div><p>1 元 = 1 积分<br>普通约 0.01 积分/手<br>高级约 0.04 积分/手</p><button data-tab="topup">API 充值</button></section><p class="aside-note">此页使用本地示例，不会同步或修改 Galaxy、盒子上的真实会员与余额。</p></aside></div><div class="page-foot"><p>开始分析前展示扣费来源与积分报价。会员剩余不足以完成本次分析时，整次使用 API 积分；积分不足时需充值或等待额度恢复。</p><button class="text-button" data-explain="membership">额度规则</button></div>`;
}
function render(){
 document.body.classList.toggle('capture',params.get('capture')==='1');$('scenario').value=state.scenario;
 $('network').textContent=state.online?'模拟断网':'恢复联网';
 $('sync-info').classList.toggle('stale',!state.online||!accountReady());
 $('sync-status').textContent=state.scenario==='loading'?'示例账户加载中':state.scenario==='error'?'示例账户读取失败':state.online?'本地示例已载入':'离线 · 示例数据待刷新';
 $('last-sync').textContent=accountReady()?'上次载入 '+timeOnly(state.lastLoaded):'余额与会员状态待确认';
 document.querySelectorAll('.page-tabs [data-tab]').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===state.tab?'page':'false'));
 $('page-content').innerHTML=state.tab==='topup'?topup():state.tab==='plans'?subscription():usage();
 params.set('tab',state.tab);params.set('state',state.scenario);params.delete('resource');history.replaceState(null,'','?'+params.toString());
 if(dialogKind==='checkout')$('dialog-content').innerHTML=checkoutContent();
}
function openDialog(title,body,kind){returnFocus=document.activeElement;dialogKind=kind;$('dialog-title').textContent=title;$('dialog-content').innerHTML=body;$('modal').hidden=false;$('frame').inert=true;$('close-dialog').focus();}
function closeDialog(){if($('modal').hidden)return;$('modal').hidden=true;$('frame').inert=false;dialogKind=null;if(returnFocus?.isConnected)returnFocus.focus();else document.querySelector('.page-tabs [aria-current=page]')?.focus();}
const explain={
 price:['API 积分计费','<p><strong>1 元 = 1 积分。</strong>普通 500 visits 每个局面 0.01 积分；高级 2000 visits 每个局面 0.04 积分。</p><p><strong>单局面与整盘使用相同单价。</strong>300 手棋谱包含初始局面，共 301 个分析局面，普通 3.01 积分，高级 12.04 积分。实际按服务端确认的手数加初始局面报价。</p><p><strong>优先使用会员额度，用尽后使用 API 积分。</strong>开始分析前展示扣费来源与积分报价；会员剩余不足以完成本次分析时，整次使用 API 积分。积分不足时需充值或等待额度恢复；账户状态未知或离线时暂不可开始分析。</p><p>一次分析结果同时包含领地与支招；重复查看已拥有结果不重复收费。</p>'],
 membership:['会员额度规则','<p><strong>会员额度优先使用。</strong>普通与高级分析共用会员额度，高级报告消耗约 4 倍。会员剩余不足以完成本次分析时，整次使用 API 积分，不拆分扣费来源。</p><p><strong>本期与本周剩余同时生效。</strong>两项分别按各自额度计算剩余比例，一次分析需同时满足两项剩余。本周在北京时间周一 00:00 恢复；本期额度到期结束，周重置、续费或换设备不重置已用与预留。</p><p>按每盘 300 手估算，受本期剩余限制。按 30 天额度用满计算优惠，实际优惠随用量变化。Free 每自然周 1 份普通报告是独立领取资格，付费会员不叠加。</p><p>分析期间先预留，失败后归还。开始分析前展示扣费来源与积分报价；积分不足时需充值或等待额度恢复。账户状态未知或离线时暂不可开始分析。此处价格为设计候选，Max 暂未开放。</p>']
};
function buy(sku){
 if(!canBuy()){tell('请先恢复联网并载入账户，再创建 TEST 订单');return;}
 if(sku==='max'){tell('Max 暂未开放');return;}
 const pack=sku==='topup',p=pack?{name:'API 积分充值',price:state.amount}:plans[sku];if(!p)return;
 state.order={id:'TEST-DEMO-'+String(++state.seq).padStart(5,'0'),sku,name:p.name,price:p.price,credits:pack?state.amount*100:0,status:'pending',awaitingPaid:false};
 openDialog('确认 TEST 订单',checkoutContent(),'checkout');
}
function checkoutContent(){
 const o=state.order;if(!o)return '';
 const pack=o.sku==='topup',labels={pending:'待确认 · 未发生真实付款',paid:'TEST 已确认 · 仅本页示例已更新',failed:'模拟失败 · 未发放权益',expired:'模拟过期 · 未发放权益'};
 const status=!state.online?'当前离线 · 等待恢复后确认示例结果':labels[o.status];
 return `<div class="checkout-test">TEST · 设计预览。无真实付款码，不连接支付渠道。价格为当前配置示意，操作仅保存在当前页面内存。</div><p class="checkout-product">${o.name}${pack?'':' · 30 天会员'}</p><p class="checkout-amount mono">¥${o.price.toFixed(2)}</p><dl class="checkout-details"><dt>示例账户</dt><dd>fan</dd><dt>${pack?'充值到账':'候选权益'}</dt><dd>${pack?`${points(o.credits)} 积分 · 1 元 = 1 积分`:`普通报告每周最多约 ${plans[o.sku].weeklyReports} 盘 · 30 天<br>按每盘 300 手估算，受本期剩余限制。高级报告消耗约 4 倍。`}</dd><dt>订单编号</dt><dd class="mono" style="overflow-wrap:anywhere">${o.id}</dd></dl><div class="payment-state ${['failed','expired'].includes(o.status)?'error':''}" role="status">${status}</div><p class="checkout-foot">${pack?'充值成功仅增加本页钱包示例；重复成功通知不重复增加余额。':'成功后仅记录会员 TEST 订单，当前用量不清零。正式生效期与可用额度以服务端订单为准。'}<br>使用页面外演示控件模拟成功、失败与过期。刷新页面后，所有示例订单与更改清空。</p><div class="dialog-actions">${['failed','expired'].includes(o.status)?`<button class="primary" data-retry-order ${canBuy()?'':'disabled'}>重新创建 TEST 订单</button>`:''}<button data-close-dialog>${o.status==='paid'?'完成':'关闭'}</button></div>`;
}
function simulate(status){
 const o=state.order;if(!o){tell('先选择充值金额或会员，再创建 TEST 订单');return;}
 if(o.status==='paid'){tell('重复成功通知已忽略，权益不会重复发放');return;}
 if(o.status!=='pending'){tell('此 TEST 订单已结束，请重新创建');return;}
 if(o.awaitingPaid&&status!=='paid'){tell('已记录模拟成功，等待恢复联网确认');return;}
 if(status==='paid'&&!state.online){o.awaitingPaid=true;tell('已记录模拟成功；恢复联网后才更新本页示例');render();return;}
 if(!accountReady()){tell('账户状态待确认，暂不更新示例权益');return;}
 o.status=status;o.awaitingPaid=false;
 if(status==='paid'&&!state.fulfilled.has(o.id)){
  state.fulfilled.add(o.id);
  if(o.sku==='topup')state.credits+=o.credits;else state.scheduled.push(o.sku);
  state.lastLoaded=now();tell(o.sku==='topup'?`模拟到账 ${points(o.credits)} 积分`:'会员 TEST 订单已确认，当前用量不重置');
 }
 render();
}
function reload(){
 if(!state.online){tell('当前离线，保留上次载入的示例数据');return;}
 if(!accountReady())state.scenario='pro';
 if(state.scenario==='boundary'&&now()>=state.boundaryAt)state.boundaryFresh=true;
 state.lastLoaded=now();render();tell('已重新载入本地示例；未连接真实账户');
}
$('scenario').addEventListener('change',e=>setScenario(e.target.value));
$('network').addEventListener('click',()=>{state.online=!state.online;if(state.online&&state.order?.awaitingPaid)simulate('paid');else render();});
$('refresh-demo').addEventListener('click',reload);
$('success').addEventListener('click',()=>simulate('paid'));$('failure').addEventListener('click',()=>simulate('failed'));$('expiry').addEventListener('click',()=>simulate('expired'));
$('reset-demo').addEventListener('click',()=>{state.seq=0;state.fulfilled.clear();state.amount=30;state.profile='standard';setScenario('pro');});
$('close-dialog').addEventListener('click',closeDialog);$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeDialog();});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.tab){state.tab=b.dataset.tab;render();}
 else if(b.dataset.amount){state.amount=Number(b.dataset.amount);render();document.querySelector(`[data-amount="${state.amount}"]`)?.focus({preventScroll:true});}
 else if(b.dataset.profile){state.profile=b.dataset.profile;render();document.querySelector(`[data-profile="${state.profile}"]`)?.focus({preventScroll:true});}
 else if(b.dataset.buy)buy(b.dataset.buy);
 else if(b.dataset.explain){const [title,body]=explain[b.dataset.explain];openDialog(title,`<div class="explanation">${body}</div><div class="dialog-actions"><button class="primary" data-close-dialog>知道了</button></div>`,'explanation');}
 else if(b.hasAttribute('data-close-dialog'))closeDialog();
 else if(b.hasAttribute('data-reload'))reload();
 else if(b.hasAttribute('data-retry-order')){const sku=state.order.sku;closeDialog();buy(sku);}
});
document.addEventListener('keydown',e=>{
 if($('modal').hidden)return;
 if(e.key==='Escape'){e.preventDefault();closeDialog();return;}
 if(e.key==='Tab'){
  const focusable=[...$('modal').querySelectorAll('button:not([disabled]),a[href],select:not([disabled])')].filter(el=>el.getClientRects().length),first=focusable[0],last=focusable.at(-1);
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
 }
});
setInterval(()=>{if(document.hidden)return;document.querySelectorAll('[data-countdown]').forEach(el=>{el.textContent=countdown(el.dataset.countdown);});},1000);
setScenario(state.scenario);
})();
</script>
</body>
</html>
