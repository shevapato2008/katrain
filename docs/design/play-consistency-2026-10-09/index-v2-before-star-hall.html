<html lang="zh-CN">

  <link rel="stylesheet" href="../../../katrain/web/ui/src/kiosk-shell/fonts.css">
  <style>

fr 1fr}.kiosk .panel-head{padding:9px 12px;height:44px}.kiosk .panel-head>span{font-size:11px}.kiosk .games{padding:10px;gap:8px}.kiosk .game{padding:9px 12px;min-height:80px}.kiosk .game-meta{font-size:11px}.kiosk .pair{margin-top:5px;grid-template-columns:1fr 20px 1fr}.kiosk .player b{font-size:14px}.kiosk .player small{font-size:11px}.kiosk .player .avatar{display:none}.kiosk .watch{display:none}.kiosk .panel-foot{padding:8px 12px;font-size:11px}.kiosk .tabs{padding:5px 10px;gap:8px}.kiosk .tabs button{font-size:12px;padding:0 12px}.kiosk .peers{height:250px;max-height:250px;padding:0 10px}.kiosk .peer{height:55px;min-height:55px;font-size:12px;gap:8px;grid-template-columns:29px minmax(0,1fr) auto 52px}.kiosk .peer b{font-size:13px}.kiosk .peer small,.kiosk .peer .status{font-size:11px}.kiosk .peer .avatar{width:29px;height:29px;font-size:12px}.kiosk .peer button{font-size:11px;color:#142318;background:#58b57a;border:0;padding:0 10px}.kiosk .home-card{min-height:240px;padding:22px}.kiosk .stage-main,.kiosk .stage-side{padding:20px}.kiosk .stage-split{grid-template-columns:minmax(0,1fr) 300px}.kiosk .field{margin-bottom:12px;font-size:12px}.kiosk .field select{min-height:40px}.kiosk .free-grid{gap:22px}.kiosk .free-grid>section+section{padding-left:22px}.kiosk h3{font-size:16px}.kiosk .note{font-size:12px}.kiosk .summary{font-size:12px;padding:12px}.kiosk .field-row{gap:16px}.kiosk .section-head{margin-bottom:12px}.kiosk .stage-side{gap:18px}.kiosk .rank-big{font-size:54px}.kiosk .progress-area{margin-top:90px}.kiosk .rank-track{margin-top:24px}.kiosk .facts{font-size:14px}.kiosk .layer{position:absolute}.kiosk .dialog h2{font-size:22px}.kiosk .dialog p{font-size:14px}.kiosk .home-options{gap:16px}.kiosk .home-card strong{font-size:23px}
    html.galaxy-document{scrollbar-gutter:stable}
    .kiosk .page{height:516px;display:flex;flex-direction:column}.kiosk .page-head,.kiosk .hall-intro{flex:none}.kiosk .stage{height:460px;flex:1;min-height:0}.kiosk .stage-main,.kiosk .stage-side{overflow:auto}.kiosk .stage-side>*{flex-shrink:0}.kiosk .hall-grid{flex:1;min-height:0}.kiosk .panel{display:flex;flex-direction:column;min-height:0;overflow:hidden}.kiosk .panel-head,.kiosk .tabs,.kiosk .panel-foot{flex:none}.kiosk .games{overflow:auto;min-height:0;flex:1}.kiosk .game{flex:none}.kiosk .peers{height:auto;max-height:none;flex:1;min-height:0}.kiosk .home-options{overflow:auto}
    .kiosk .btn.main{color:#102215}.kiosk .rated-stage .stage-side{padding:16px 20px;gap:10px}.kiosk .rated-stage .stone{width:56px;height:56px}.kiosk .rated-stage .facts{gap:12px}.kiosk .rated-stage .side-actions{gap:8px}

<body>
  <nav class="design-controls" aria-label="设计稿预览选项">
    <strong>对局 · 统一设计稿</strong>
    <label>界面<select id="surface"><option value="galaxy">Galaxy 网页</option><option value="kiosk">kiosk · 1024×600</option></select></label>
    <label>页面<select id="view"><option value="hall">对战大厅</option><option value="free">自由对弈</option><option value="rated">升降级对弈</option><option value="home">对局入口</option></select></label>
    <label>段位<select id="rank"><option value="unplaced">未定级</option><option value="placed">已定级 · 3段</option></select></label>
    <small>页面内可操作；仅为设计预览，不创建真实对局。</small>
  </nav>
  <div id="app"></div>
  <script>
  (() => {
    const params = new URLSearchParams(location.search);
    const state = {surface:params.get('surface') || 'galaxy',view:params.get('view') || 'hall',rank:params.get('rank') || 'unplaced',filter:'all'};
    const arrow = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg>';
    const navIcons={首页:'<path d="m3 11 9-8 9 8M6 9v11h12V9M10 20v-6h4v6"/>',对局:'<rect x="3" y="6" width="18" height="13" rx="4"/><path d="M8 10v6m-3-3h6m5-2h.01m2 4h.01"/>',研究:'<path d="M9 3h6m-5 0v7l-6 9h16l-6-9V3"/>',死活题:'<path d="M4 7h5V4h6v3h5v13H4Z"/>',复盘:'<path d="M4 20V4h16v16ZM8 15v-4m4 4V8m4 7v-6"/>',直播:'<rect x="3" y="5" width="18" height="15" rx="2"/><path d="m10 9 6 4-6 4Z"/>',棋谱库:'<path d="M5 3h14v18H5Zm3 5h8m-8 4h8m-8 4h6"/>',教程:'<path d="M3 5h7l2 2 2-2h7v14h-7l-2 2-2-2H3ZM12 7v14"/>'};
    const names=['首页','对局','研究','死活题','复盘','直播','棋谱库','教程'];
    const rankText=()=>state.rank==='placed'?'3段':'尚未定级';
    const pageTitles={home:'对局',hall:state.surface==='kiosk'?'在线大厅':'对战大厅',free:'自由对弈',rated:'升降级对弈'};
    const games=[['ee36','秋日拂晓','阿川青竹','20级',170],['6f64','清溪花花','阿远栗子','14级',185],['5a50','溪边望月','阿远拂晓','12级',80]];
    const peers=[['竹林海棠','20级'],['归舟喝茶','20级'],['云山随风','17级'],['林中贝壳','17级'],['安安寻山','17级'],['阿宁白茶','3段'],['晚间小舟','3段']];
    const badge=t=>`<span class="badge">${t}</span>`;
    function header(){return `<header class="page-head">${state.view==='home'?'':`<button class="back" aria-label="返回对局" data-view="home">${arrow}</button>`}<h1>${pageTitles[state.view]}</h1>${state.view==='hall'?`<div class="head-state"><span>${state.rank==='placed'?'已定级':'未定级'}</span>${badge(rankText())}</div>`:''}</header>`;}
    function game(g){return `<button class="game" data-watch="${g[0]}" aria-label="观战 ${g[1]} 对 ${g[2]}"><div class="game-meta"><span class="num">${g[0]} 房</span><span>分先 · 19路</span><span>第 <span class="num">${g[4]}</span> 手</span></div><div class="pair"><div class="player"><span class="avatar">${g[1][0]}</span><div><b>${g[1]}</b><small>执黑 · ${g[3]}</small></div></div><span class="vs">对</span><div class="player"><div><b>${g[2]}</b><small>${g[3]} · 执白</small></div><span class="avatar">${g[2][0]}</span></div></div><div class="watch">观战 →</div></button>`;}
    function hall(){const list=peers.filter(p=>state.filter!=='same'||p[1]==='3段');return `<section class="hall-intro"><div><h2>来下一局</h2><p class="note">快速匹配同段位，或邀请任意段位的空闲棋友。大厅对局不计升降段位。</p></div><button class="btn main" data-match>快速匹配 →</button></section><div class="hall-grid"><section class="panel"><header class="panel-head"><h2>进行中的对局</h2><span>3局正在进行</span></header><div class="games">${games.map(game).join('')}</div><p class="panel-foot">点击对局即可观战；自己的对局可返回棋盘。</p></section><section class="panel"><header class="panel-head"><h2>在线棋友</h2><span>67人在线</span></header><div class="tabs" role="tablist"><button role="tab" aria-selected="${state.filter==='all'}" data-filter="all">全部棋友</button><button role="tab" aria-selected="${state.filter==='same'}" data-filter="same" ${state.rank==='unplaced'?'disabled':''}>同段位</button></div><div class="peers"><div class="peer self"><span class="avatar">f</span><span><b>fan</b><small>${rankText()}</small></span><span class="status">空闲</span><span class="self-label">这是你</span></div>${list.map(p=>`<div class="peer"><span class="avatar">${p[0][0]}</span><span><b>${p[0]}</b><small>${p[1]}</small></span><span class="status">空闲</span><button data-invite="${p[0]}" data-rank="${p[1]}">邀请</button></div>`).join('')}</div><p class="panel-foot">未定级也可邀请；快速匹配需先完成定级。</p></section></div>`;}
    function select(label,options){return `<label class="field"><span>${label}</span><select aria-label="${label}">${options.map(o=>`<option>${o}</option>`).join('')}</select></label>`;}
    function range(label,value,min,max){const limit=label==='让子'?9:label==='贴目'?15:28;const position=label==='让子'?0:label==='贴目'?6.5:10;return `<label class="field"><span>${label}<b class="value">${value}</b></span><input type="range" aria-label="${label}" min="0" max="${limit}" step="${label==='贴目'?0.5:1}" value="${position}"><span class="range-labels"><span>${min}</span><span>${max}</span></span></label>`;}
    function free(){return `<section class="stage stage-split"><div class="stage-main"><div class="section-head"><h2>对局设置</h2><small>自由对弈 · 不计升降段位</small></div><div class="free-grid"><section><h3>棋盘与规则</h3><div class="rule"></div>${select('棋盘大小',['19路 · 标准','13路','9路'])}${select('规则',['日本规则','中国规则','韩国规则','AGA规则','新西兰规则','Tromp-Taylor规则'])}${select('执子颜色',['黑棋 · 先手','白棋 · 后手'])}${range('让子','0','不让子','9子')}${range('贴目','6.5','0目','15目')}</section><section><h3>对手与时间</h3><div class="rule"></div>${select('AI落点方式',['拟人','棋力阶梯','策略设置'])}${range('对手段位','10级','20级','9段')}<div class="rule"></div><label class="check"><input type="checkbox" id="timer">启用计时器</label><div id="time-fields" hidden>${select('主时间',['10分钟','15分钟','20分钟'])}${select('读秒',['3次 · 每次30秒','5次 · 每次30秒'])}</div><p class="note">可自由选择对手、规则和用时。</p></section></div></div><aside class="stage-side"><h2>准备开局</h2><p class="note">按自己的节奏练习。此处的胜负不会改变升降级段位。</p><div class="summary">19路 · 日本规则<br>执黑 · 贴目6.5 · 不让子<br>拟人对手 · 10级</div><div class="side-actions"><button class="btn main block" data-demo="自由对弈设置已确认；设计稿不创建真实对局。">开始对局</button><button class="btn block" data-view="home">返回对局</button></div></aside></section>`;}
    function rated(){const placed=state.rank==='placed';return `<section class="stage stage-split rated-stage"><div class="stage-main"><div class="placement-top"><div><p class="muted">当前段位</p><div class="rank-big">${placed?'3段':'定级中'}</div><p class="note">${placed?'已完成定级':'定级进度 3/5'}</p></div><div class="recent"><p class="muted">最近五局</p><b>负　负　胜</b></div></div><div class="progress-area"><div class="progress-label"><div><h2>本阶进度</h2><p class="note">最近对局作历史展示，净胜分决定晋降级。</p></div><strong class="num">0</strong></div><div class="thresholds"><span>净负3局 · 降级</span><span>净胜3局 · 晋级</span></div><div class="rank-track">${[-3,-2,-1,0,1,2,3].map(i=>`<div class="rank-stop ${i===0?'active':''}"><i></i><span>${i>0?'+':''}${i}</span></div>`).join('')}</div></div></div><aside class="stage-side"><h2>本局挑战</h2><div class="opponent"><span class="stone"></span><div><p>智星棋手</p><b>${placed?'3段':'3级'}</b></div></div><div style="display:flex;gap:8px">${badge('已认证')}${badge('计入升降级')}</div><div class="facts"><div><small>棋盘</small>19路</div><div><small>规则</small>中国规则</div><div><small>贴目</small>7.5</div><div><small>用时</small>10分钟 · 3×30秒</div></div><div><small>选择执子</small><div class="choices" style="margin-top:8px"><button aria-pressed="true" data-color="B">● 黑棋</button><button aria-pressed="false" data-color="W">○ 白棋</button></div></div><div class="side-actions"><button class="btn main block" data-demo="正式对局由服务端预约；设计稿不提交预约。">开始正式对局</button><p class="note">开始前需要联网完成正式预约。</p></div></aside></section>`;}
    function home(){return `<div class="home-head" style="margin-bottom:24px"><p class="note">选择一种方式，来下一局。</p><button class="btn" data-demo="对局记录统一进入复盘模块。">对局记录</button></div><div class="home-options">${[['free','自由对弈','选择对手、规则和用时，按自己的节奏练习。','不计升降段位'],['rated','升降级对弈','先完成定级，再挑战认证棋手，积累升降级成绩。','计入升降段位'],['hall','对战大厅','匹配同段位对手，或邀请棋友、观看正在进行的对局。','不计升降段位']].map(p=>`<button class="home-card" data-view="${p[0]}"><strong>${p[1]}</strong><p class="note">${p[2]}</p><small>${p[3]}</small><span>进入 →</span></button>`).join('')}</div>`;}
    function render(){
      const kiosk=state.surface==='kiosk';
      document.getElementById('view').disabled=kiosk;
      document.getElementById('rank').disabled=kiosk;
      if(kiosk){
        document.querySelector('#app').innerHTML='<div style="padding:20px;display:grid;justify-content:center"><p class="note" style="margin-bottom:12px">kiosk 沿用 RK3562 现有大厅布局，修复中文楷体、观战入口与直接邀请。以下为真实 React 运行截图（验收数据），并包含参照现有星阵骨架新增的只读观战页。</p><img alt="现有 kiosk 大厅，保留原布局" width="1024" height="600" src="kiosk-hall-implementation.png" style="max-width:100%;height:auto"><p class="note" style="margin:24px 0 12px">大厅对局观战 · 只读实时盘面</p><img alt="kiosk 大厅对局观战" width="1024" height="600" src="kiosk-spectator-implementation.png" style="max-width:100%;height:auto"></div>';
        document.getElementById('surface').value=state.surface;
        return;
      }
      document.documentElement.className=state.surface==='galaxy'?'galaxy-document':'';pageTitles.hall=state.surface==='kiosk'?'在线大厅':'对战大厅';document.querySelector('#app').innerHTML=`<div class="app ${state.surface==='kiosk'?'kiosk':''}"><header class="topbar"><div class="logo"><img src="../../../katrain/img/logo-white.png" alt=""><span class="brand">智星盒</span><span class="latin-brand">StellaBox</span></div><div class="identity"><span class="avatar">F</span><span>fan</span>${state.surface==='kiosk'?'<span class="num">17:24</span>':''}</div></header><div class="body"><nav class="sidebar" aria-label="主导航">${names.map(n=>`<button class="${n==='对局'?'active':''}" ${n==='对局'?'data-view="home"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${navIcons[n]}</svg>${n}</button>`).join('')}<div class="account"><span class="avatar">f</span><div>fan<small>${rankText()}</small></div></div></nav><main class="content"><div class="page">${header()}${({hall,free,rated,home})[state.view]()}</div></main></div></div>`;for(const k of ['surface','view'])document.getElementById(k).value=state[k];document.getElementById('rank').value=state.rank;}
    let returnFocus;
    function close(){document.querySelector('.layer')?.remove();returnFocus?.focus();}
    function modal(kind,name,rank){returnFocus=document.activeElement;const unplaced=kind==='placement';const invite=kind==='invite';const title=unplaced?'完成定级后再来匹配':invite?`邀请 ${name} 对局`:'正在寻找同段位对手';const copy=unplaced?'快速匹配按升降级段位寻找同水平对手。请先完成5局定级赛。你仍可直接邀请空闲棋友。':invite?'对方空闲。未定级也可邀请任意段位棋友，本局不计升降段位。':'先寻找同段位真人，等待后由同段位棋手接局。成功后直接进入棋盘。';document.querySelector('.app').insertAdjacentHTML('beforeend',`<div class="layer"><section class="dialog" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><h2 id="dialog-title">${title}</h2><p>${copy}</p><div class="summary">${unplaced?'当前段位 · 尚未定级':invite?`对方段位 · ${rank}`:'你的段位 · 3段 · 不计升降段位'}</div><div class="actions"><button class="btn" data-close>${kind==='matching'?'取消匹配':'返回大厅'}</button>${kind==='matching'?'':`<button class="btn main" ${unplaced?'data-go-rated':'data-send-invite'}>${unplaced?'去升降级对弈':'发送邀请'}</button>`}</div></section></div>`);document.querySelector('.dialog').focus();}
    function toast(text){document.querySelector('.toast')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="toast" role="status">${text}</div>`);setTimeout(()=>document.querySelector('.toast')?.remove(),3500);}
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){state.view=b.dataset.view;render();return;}if(b.hasAttribute('data-match'))modal(state.rank==='unplaced'?'placement':'matching');else if(b.dataset.invite)modal('invite',b.dataset.invite,b.dataset.rank);else if(b.hasAttribute('data-close'))close();else if(b.hasAttribute('data-go-rated')){close();state.view='rated';render();}else if(b.hasAttribute('data-send-invite')){close();toast('邀请已发送，等待对方回应。');}else if(b.dataset.watch)toast('点击进入观战；棋盘功能沿用现有页面。');else if(b.dataset.demo)toast(b.dataset.demo);else if(b.dataset.filter){state.filter=b.dataset.filter;render();}else if(b.dataset.color){document.querySelectorAll('[data-color]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));}});
    document.addEventListener('change',e=>{if(['surface','view','rank'].includes(e.target.id)){state[e.target.id]=e.target.value;state.filter='all';render();}if(e.target.id==='timer')document.getElementById('time-fields').hidden=!e.target.checked;});
    document.addEventListener('keydown',e=>{const d=document.querySelector('.dialog');if(!d)return;if(e.key==='Escape')close();if(e.key==='Tab'){const bs=[...d.querySelectorAll('button')];if(e.shiftKey&&(document.activeElement===bs[0]||document.activeElement===d)){e.preventDefault();bs.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===bs.at(-1)){e.preventDefault();bs[0].focus();}}});
    if(params.has('capture'))document.body.classList.add('capture');render();
  })();
  </script>
</body>
</html>
