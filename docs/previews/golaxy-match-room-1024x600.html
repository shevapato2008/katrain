<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>星阵快速匹配与房间 · 1024 × 600 审核稿</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../katrain/web/ui/src/kiosk-shell/fonts.css">
  <style>
    :root{--bg:#0e1514;--top:#17221e;--panel:#17211f;--raise:#1e2b26;--line:#34473c;--text:#edf4ef;--muted:#a8b8af;--green:#76c991;--gold:#dfbc76;--font:"SmartBox Sans","SmartBox Kai",system-ui,sans-serif;--serif:"SmartBox Serif","SmartBox Kai",Georgia,serif}
    *{box-sizing:border-box}html,body{margin:0;background:#09110e;color:var(--text);font-family:var(--font)}button,input{font:inherit}button{color:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:2px solid #b3efc0;outline-offset:2px}button:disabled{cursor:default;opacity:.55}
    .review{max-width:1100px;margin:auto;padding:16px 24px 36px}.review h1{margin:0 0 4px;font:600 22px var(--serif)}.review>p{margin:0 0 12px;color:var(--muted);font-size:13px}.switches{display:flex;gap:8px;margin-bottom:12px}.switches button{height:42px;padding:0 16px;border:1px solid #45644f;border-radius:8px;background:#1b2a21}.switches button[aria-selected=true]{border-color:var(--green);background:#2e573d}
    .device{width:1024px;height:600px;overflow:hidden;border:1px solid #496451;background:var(--bg);box-shadow:0 18px 40px #0008}.top{display:flex;align-items:center;gap:8px;height:56px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--top)}.top img{width:28px;height:28px;object-fit:contain}.brand{font:600 19px "SmartBox Brand LongCang",var(--serif)}.brand-en{font:italic 11px var(--serif);color:#a6b8ac}.sep{height:23px;width:1px;margin:0 8px;background:#486653}.context{color:var(--green);font-size:13px}.clock{margin-left:auto;font-size:12px;color:#b7c9b8}
    .page{height:544px;padding:9px 16px 14px}.pagebar{display:flex;align-items:center;gap:11px;height:48px}.back{height:44px;min-width:108px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--raise);font-size:13px}.pagebar img{width:30px;height:30px;border-radius:7px;object-fit:contain}.pagebar strong{font:600 17px var(--serif)}.state{margin-left:auto;color:var(--green);font-size:12px}.state:before{content:"";display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:currentColor}.heading{margin:3px 0 12px;font:600 21px var(--serif)}.heading small{display:block;margin-top:4px;color:var(--muted);font:12px var(--font)}
    .body{display:grid;grid-template-columns:1fr 1fr;gap:14px;height:420px}.board-side,.panel{min-width:0;border:1px solid var(--line);border-radius:11px;background:var(--panel)}.board-side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px}.board{position:relative;width:356px;height:356px;padding:17px;border:13px solid #ac793e;border-radius:5px;background:#d3a365;box-shadow:0 7px 20px #0006}.grid{width:100%;height:100%;background-image:linear-gradient(#815c35 1px,transparent 1px),linear-gradient(90deg,#815c35 1px,transparent 1px);background-size:calc(100% / 18) calc(100% / 18);background-position:0 0;border-right:1px solid #815c35;border-bottom:1px solid #815c35}.board-side small{color:var(--muted);font-size:11px}
    .panel{display:flex;flex-direction:column;gap:10px;padding:14px 16px}.line{display:flex;align-items:center;gap:10px}.label{width:52px;flex:none;color:var(--muted);font-size:12px}.seg{display:flex;flex:1;height:44px;padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--raise)}.seg button{flex:1;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:13px}.seg button[aria-pressed=true]{background:#294638;color:#dff9e6;font-weight:700}.note{margin:0;color:var(--muted);font-size:11px;line-height:1.45}.section-head{display:flex;align-items:center;gap:8px;margin-top:1px;font-size:12px}.section-head:after{content:"";height:1px;flex:1;background:var(--line)}.times{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.time{position:relative;min-height:79px;padding:9px 10px;border:1px solid #436149;border-radius:9px;background:#22332a;text-align:left}.time[aria-pressed=true]{border-color:#77c78d;background:#2b5039}.time b,.time small{display:block}.time b{font-size:14px}.time small{margin-top:5px;color:#b5c9b7;font-size:11px;white-space:nowrap}.time i{position:absolute;right:9px;top:10px;width:16px;height:16px;border:1px solid #83ac8a;border-radius:4px;background:#12251a;font:normal 12px/14px var(--font);text-align:center}.time[aria-pressed=true] i{background:#70bd86;color:#0f2115}.ai{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:47px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--raise)}.ai span{font-size:12px}.ai small{display:block;margin-top:3px;color:var(--muted);font-size:10px}.toggle{width:39px;height:23px;border:1px solid #819e86;border-radius:20px;background:#2a4c35}.toggle:before{content:"";display:block;width:17px;height:17px;margin:2px;border-radius:50%;background:#e9f3eb;transition:transform .16s}.toggle[aria-pressed=true]{background:#4c9b65}.toggle[aria-pressed=true]:before{transform:translateX(15px)}.submit{min-height:47px;margin-top:auto;border:0;border-radius:9px;background:#65ae7e;color:#102117;font-size:14px;font-weight:700}.submit:disabled{background:#607d69;color:#d5e5d8;opacity:1}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tabs button{height:44px;border:1px solid var(--line);border-radius:8px;background:var(--raise);color:var(--muted);font-size:12px}.tabs button[aria-selected=true]{border-color:var(--green);background:#2b4e38;color:#e4fae8;font-weight:700}.room-content{display:flex;flex-direction:column;gap:9px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#1c2a23;min-height:143px}.room-content h2{margin:0;font-size:14px}.room-content p{margin:0;color:var(--muted);font-size:11px;line-height:1.45}.room-content label{font-size:12px;color:#ceddd0}.room-content input{width:100%;height:44px;margin-top:6px;padding:0 12px;border:1px solid #597260;border-radius:7px;background:#102019;color:var(--text)}.room-content .role{padding:7px;border-radius:6px;background:#2c352d;color:#dfc994}.room-content .my-empty{display:grid;place-items:center;height:57px;border:1px dashed #536758;border-radius:7px;color:var(--muted);font-size:12px}.hidden{display:none}
  </style>
</head>
<body>
  <main class="review">
    <h1>星阵快速匹配与房间 · 7 英寸交互审核稿</h1>
    <p>固定 1024 × 600。设置项可操作以检查布局；提交按钮暂不可用，待真实星阵开局链路联通。</p>
    <div class="switches"><button type="button" data-screen="quick" aria-selected="true">快速匹配</button><button type="button" data-screen="room" aria-selected="false">房间</button></div>
    <div class="device"><header class="top"><img src="../../katrain/img/logo-white.png" alt=""><span class="brand">智星盒</span><span class="brand-en">StellaBox</span><span class="sep"></span><span class="context">围棋 · 星阵</span><span class="clock">16:40</span></header><div class="page"><div class="pagebar"><button class="back" type="button">← 星阵围棋</button><img src="../../katrain/web/ui/src/kiosk/assets/platform-marks/golaxy.png" alt=""><strong id="screen-title">快速匹配</strong><span class="state">已连接</span></div><h2 class="heading" id="heading">快速匹配<small>落子位置与匹配用时在开局前设置</small></h2><div class="body"><section class="board-side"><div class="board"><div class="grid"></div></div><small>19 路 · 空盘预览</small></section><section class="panel"><div class="line"><span class="label">落子</span><div class="seg"><button type="button" aria-pressed="false">屏幕</button><button type="button" aria-pressed="true">实体盘</button></div></div><div id="quick-options"><div class="section-head">匹配用时 · 可多选</div><div class="times"><button class="time" type="button" aria-pressed="true"><b>快棋</b><small>1 分 · 15 秒 × 3</small><i>✓</i></button><button class="time" type="button" aria-pressed="true"><b>普通</b><small>10 分 · 30 秒 × 3</small><i>✓</i></button><button class="time" type="button" aria-pressed="true"><b>慢棋</b><small>30 分 · 40 秒 × 3</small><i>✓</i></button></div><div class="ai"><div><span>允许匹配 AI 对手</span><small>等待棋友较久时，可选择转向星阵 AI</small></div><button class="toggle" type="button" aria-label="允许匹配 AI 对手" aria-pressed="false"></button></div></div><div id="room-options" class="hidden"><div class="tabs"><button type="button" data-room-tab="create" aria-selected="true">创建房间</button><button type="button" data-room-tab="mine" aria-selected="false">我的房间</button><button type="button" data-room-tab="join" aria-selected="false">加入房间</button></div><div class="room-content" id="room-content"><h2>创建星阵房间</h2><p>创建后在房间内设置对局，再等待另一位棋手加入。</p><p class="role">创建后与棋友确认对局规则。</p></div></div><p class="note" id="note">可多选用时；至少选择一种。星阵完成匹配后才进入对局。</p><button class="submit" id="submit" type="button" disabled>开始匹配 · 暂不可用</button></section></div></div></div>
  </main>
  <script>
    const qs=(s)=>document.querySelector(s);
    function screen(name){document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.screen===name)));qs('#screen-title').textContent=name==='quick'?'快速匹配':'房间';qs('#heading').innerHTML=name==='quick'?'快速匹配<small>落子位置与匹配用时在开局前设置</small>':'房间<small>创建、找回或按房号进入星阵房间</small>';qs('#quick-options').classList.toggle('hidden',name!=='quick');qs('#room-options').classList.toggle('hidden',name!=='room');qs('#note').textContent=name==='quick'?'可多选用时；至少选择一种。星阵完成匹配后才进入对局。':'加入房间后仍需确认对局身份和开局状态。';qs('#submit').textContent=name==='quick'?'开始匹配 · 暂不可用':'创建房间 · 暂不可用'}
    document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>screen(b.dataset.screen));
    document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
    document.querySelectorAll('.time,.toggle').forEach(b=>b.onclick=()=>{const on=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',String(!on));if(b.classList.contains('time'))b.querySelector('i').textContent=on?'':'✓'});
    document.querySelectorAll('[data-room-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-room-tab]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));const content=qs('#room-content');if(b.dataset.roomTab==='create'){content.innerHTML='<h2>创建星阵房间</h2><p>创建后在房间内设置对局，再等待另一位棋手加入。</p><p class="role">创建后与棋友确认对局规则。</p>';qs('#submit').textContent='创建房间 · 暂不可用'}else if(b.dataset.roomTab==='mine'){content.innerHTML='<h2>我的房间</h2><p>显示星阵返回的当前账号所建房间。</p><div class="my-empty">尚未读取房间</div>';qs('#submit').textContent='打开我的房间 · 暂不可用'}else{content.innerHTML='<h2>加入星阵房间</h2><label>房间号<input inputmode="numeric" aria-label="房间号" placeholder="请输入星阵房间号"></label><p class="role">按房号进入可能是观战身份，仍需确认可对弈席位。</p>';qs('#submit').textContent='加入房间 · 暂不可用'}});
  </script>
</body>
</html>
