<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星阵只读观战 · 1024 × 600 运行时审核</title>
  <style>
    :root { color-scheme:dark; font-family:system-ui,sans-serif; background:#0e1414; color:#e7eeeb; }
    * { box-sizing:border-box; }
    body { max-width:1100px; margin:0 auto; padding:24px 20px 48px; }
    h1 { margin:0 0 8px; font-size:23px; }
    p { max-width:1024px; line-height:1.6; color:#a9bbb2; }
    .controls { display:flex; gap:8px; flex-wrap:wrap; margin:18px 0; }
    button { min-height:44px; padding:0 15px; border:1px solid #466352; border-radius:9px; background:#1a2823; color:inherit; font:inherit; cursor:pointer; }
    button[aria-pressed="true"] { border-color:#6bc190; background:#256146; }
    .frame { position:relative; width:min(100%,1024px); aspect-ratio:1024/600; overflow:hidden; border:1px solid #42624f; }
    .frame img { position:absolute; width:100%; height:100%; object-fit:contain; }
    #runtime { clip-path:inset(0 0 0 50%); }
    #divider { position:absolute; top:0; bottom:0; left:50%; border-left:2px solid #e1c56a; pointer-events:none; }
    .pair { display:none; gap:12px; width:min(100%,1024px); }
    figure { width:50%; margin:0; }
    figure img { width:100%; display:block; border:1px solid #42624f; }
    figcaption { padding:7px 0; color:#a9bbb2; }
    input[type="range"] { display:block; width:min(100%,1024px); margin:14px 0; accent-color:#67bf8c; }
    a { color:#85d5a4; }
    .links { display:flex; gap:22px; margin:12px 0; }
    .note { border-left:3px solid #68b786; padding:9px 13px; background:#17231f; }
  </style>
</head>
<body>
  <h1>星阵只读观战 · 1024 × 600 运行时审核</h1>
  <p>参考稿与 React 运行时均按目标视口截图。可切换原图、并排或拖动叠加分界线核对。</p>
  <div class="controls" role="group" aria-label="对照方式">
    <button data-mode="reference" aria-pressed="false">仅参考稿</button>
    <button data-mode="runtime" aria-pressed="false">仅运行时</button>
    <button data-mode="pair" aria-pressed="false">并排</button>
    <button data-mode="overlay" aria-pressed="true">叠加</button>
  </div>
  <div class="frame" id="frame"><img id="reference" src="golaxy-live-lobby-spectate-1024x600.png" alt="已批准设计参考"><img id="runtime" src="golaxy-spectator-runtime-1024x600.png" alt="React 运行时"><div id="divider"></div></div>
  <div class="pair" id="pair"><figure><img src="golaxy-live-lobby-spectate-1024x600.png" alt="已批准设计参考"><figcaption>已批准设计稿</figcaption></figure><figure><img src="golaxy-spectator-runtime-1024x600.png" alt="React 运行时"><figcaption>React 运行时</figcaption></figure></div>
  <input id="split" type="range" min="0" max="100" value="50" aria-label="叠加分界位置">
  <div class="links"><a href="golaxy-live-lobby-spectate-1024x600.png">参考稿原尺寸</a><a href="golaxy-spectator-runtime-1024x600.png">运行时原尺寸</a></div>
  <p class="note">主构图、棋盘外框、信息面板与返回按钮沿用参考稿。棋盘木纹和线条来自共享 GoBoardSvg，状态文案说明当前只在进入页面时读取一次快照。截图中的房号、棋手和棋子仅由 Playwright API 拦截提供；生产页没有样例棋局，快照端点未接入时会显示同步失败和重试。</p>
  <script>
    const frame = document.getElementById('frame');
    const pair = document.getElementById('pair');
    const reference = document.getElementById('reference');
    const runtime = document.getElementById('runtime');
    const divider = document.getElementById('divider');
    const split = document.getElementById('split');
    document.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => {
      const mode = button.dataset.mode;
      document.querySelectorAll('[data-mode]').forEach(other => other.setAttribute('aria-pressed', String(other === button)));
      frame.style.display = mode === 'pair' ? 'none' : 'block';
      pair.style.display = mode === 'pair' ? 'flex' : 'none';
      reference.style.display = mode === 'runtime' ? 'none' : 'block';
      runtime.style.display = mode === 'reference' ? 'none' : 'block';
      runtime.style.clipPath = mode === 'overlay' ? `inset(0 0 0 ${split.value}%)` : 'none';
      divider.style.display = mode === 'overlay' ? 'block' : 'none';
      split.style.display = mode === 'overlay' ? 'block' : 'none';
    }));
    split.addEventListener('input', () => {
      runtime.style.clipPath = `inset(0 0 0 ${split.value}%)`;
      divider.style.left = `${split.value}%`;
    });
  </script>
</body>
</html>
