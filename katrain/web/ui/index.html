<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智星盒 · 围棋</title>
    <script>
      // Start the one bounded library request while application modules download.
      if (/^\/(galaxy|kiosk)\/kifu\/?$/.test(location.pathname)) {
        var query = new URLSearchParams(location.search);
        var params = new URLSearchParams();
        if (query.get('q')) params.set('q', query.get('q'));
        params.set('page', query.get('page') || '1');
        params.set('page_size', '20');
        var language = 'cn';
        try { language = localStorage.getItem('katrain_language') || 'cn'; } catch (_) {}
        params.set('lang', language);
        var path = '/api/v1/kifu/albums?' + params;
        window.__kifuListRequest = { path: path, response: fetch(path, { priority: 'high' }) };
        window.__kifuListRequest.response.catch(function () {});
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- SBC kiosk 触屏键盘:仅在 /kiosk 路由加载,桌面/服务器版(galaxy)不受影响 -->
    <script>
      if (location.pathname.indexOf('/kiosk') === 0) {
        document.documentElement.lang = 'zh-CN';
        var kbCss = document.createElement('link');
        kbCss.rel = 'stylesheet'; kbCss.href = '/smartkeyboard.css?v=kbd5';
        document.head.appendChild(kbCss);
        function loadScript(src, next) {
          var s = document.createElement('script');
          s.src = src;
          if (next) s.onload = next;
          document.body.appendChild(s);
        }
        function loadKioskKeyboard() {
          loadScript('/pinyin-ime.js?v=kbd5', function () {
            loadScript('/pinyin-compose.js?v=kbd5', function () {
              loadScript('/smartkeyboard.js?v=kbd5');
            });
          });
        }
        if (document.readyState === 'complete') {
          setTimeout(loadKioskKeyboard, 0);
        } else {
          window.addEventListener('load', loadKioskKeyboard, { once: true });
        }
      }
    </script>
  </body>
</html>
