<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>弈航 BoardNavi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- SBC kiosk 触屏键盘:仅在 /kiosk 路由加载,桌面/服务器版(galaxy)不受影响 -->
    <script>
      if (location.pathname.indexOf('/kiosk') === 0) {
        document.documentElement.lang = 'zh-CN';
        var kbCss = document.createElement('link');
        kbCss.rel = 'stylesheet'; kbCss.href = '/smartkeyboard.css?v=kbd1';
        document.head.appendChild(kbCss);
        function loadScript(src, next) {
          var s = document.createElement('script');
          s.src = src;
          if (next) s.onload = next;
          document.body.appendChild(s);
        }
        function loadKioskKeyboard() {
          loadScript('/pinyin-ime.js?v=kbd1', function () {
            loadScript('/smartkeyboard.js?v=kbd1', function () {
              loadScript('/kiosk-home-button.js?v=hb1');
            });
          });
        }
        if (document.readyState === 'complete') {
          setTimeout(loadKioskKeyboard, 0);
        } else {
          window.addEventListener('load', loadKioskKeyboard, { once: true });
        }
      }
    </script>
  </body>
</html>
