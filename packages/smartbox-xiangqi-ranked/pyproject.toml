[project]
name = "smartbox-xiangqi-ranked"
version = "0.1.0"
description = "Pure versioned ranked-play contracts for SmartBox Xiangqi"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartbox_xiangqi_ranked"]
