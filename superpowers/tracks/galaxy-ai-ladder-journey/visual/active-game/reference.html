<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Galaxy 升降级对弈 · 未完成对局视觉参考</title>
  <link rel="stylesheet" href="/src/galaxy/assets/fonts/galaxy-fonts.css" />
  <style>
    :root {
      color-scheme: dark;
      font-family: "LXGW WenKai", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f3f0;
      background: #0f0f0f;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    button { font: inherit; }
    .shell { width: 100vw; height: 100dvh; display: flex; flex-direction: column; background: #0f0f0f; }
    .topbar { height: 52px; flex: 0 0 52px; padding: 0 20px; display: flex; align-items: center; background: #252525; border-bottom: 1px solid rgba(255,255,255,.05); }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand img { width: 32px; height: 32px; object-fit: contain; }
    .brand-cn { font-family: "Galaxy Long Cang"; font-size: 22px; line-height: 1; }
    .brand-en { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 600; letter-spacing: .02em; }
    .body { min-height: 0; flex: 1; display: flex; position: relative; }
    .sidebar { width: 215px; flex: 0 0 215px; display: flex; flex-direction: column; background: #252525; border-right: 1px solid rgba(255,255,255,.05); }
    .nav { flex: 1; padding-top: 16px; }
    .nav-item { height: 52px; margin: 0 8px; padding: 0 18px; border-radius: 16px; display: flex; align-items: center; gap: 18px; color: #b8b5b0; font-size: 18px; }
    .nav-item.active { color: #f5f3f0; background: #2f4539; }
    .nav-icon { width: 24px; height: 24px; flex: 0 0 24px; fill: currentColor; color: #c8c6c2; }
    .account { padding: 16px; border-top: 1px solid rgba(255,255,255,.05); }
    .settings { height: 52px; padding: 0 10px; display: flex; align-items: center; gap: 18px; font-size: 17px; }
    .user { height: 78px; padding: 12px; display: flex; align-items: center; gap: 12px; border-radius: 16px; background: #111; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: #4a6b5c; font-size: 12px; }
    .user-copy { flex: 1; font-family: sans-serif; line-height: 1.45; }
    .rank-small { color: #5d8270; font-size: 12px; }
    .toggle { position: absolute; left: 215px; top: 50%; translate: 0 -50%; width: 44px; height: 44px; padding: 10px; border: 1px solid rgba(255,255,255,.05); border-radius: 50%; background: #252525; color: white; }
    .toggle svg, .back svg, .account-exit { width: 24px; height: 24px; fill: currentColor; }
    .content { flex: 1; min-width: 0; min-height: 0; overflow-y: auto; padding: 24px 32px; }
    .content-inner { width: 100%; max-width: 1500px; margin: 0 auto; }
    .page-head { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    h1 { margin: 0; font-size: 34px; line-height: 1.25; letter-spacing: -.02em; font-weight: 800; }
    .back { min-height: 44px; padding: 8px 16px; display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,.08); border-radius: 8px; color: #b8b5b0; background: transparent; font-size: 16px; }
    .card { margin-top: 20px; display: grid; grid-template-columns: minmax(0,1fr) minmax(340px,402px); overflow: hidden; border: 1px solid rgba(255,255,255,.05); border-radius: 24px; background: #252525; box-shadow: 0 18px 50px rgba(0,0,0,.18); }
    .progress-panel, .challenge { min-height: 560px; padding: 32px; display: flex; flex-direction: column; }
    .challenge { border-left: 1px solid rgba(255,255,255,.22); }
    .muted { color: #b8b5b0; }
    .eyebrow { font-size: 18px; font-weight: 650; }
    .rank-row { display: flex; justify-content: space-between; gap: 32px; }
    .rank-line { margin-top: 10px; display: flex; align-items: baseline; gap: 14px; }
    .rank { font-size: 88px; line-height: 1; font-weight: 800; letter-spacing: -.07em; }
    .system { color: #b8b5b0; font-size: 22px; font-weight: 700; }
    .recent { min-width: 220px; }
    .recent-result { margin-top: 10px; word-spacing: 12px; font-weight: 750; }
    .progress { margin-top: auto; padding-top: 48px; }
    .progress-title { display: flex; align-items: baseline; justify-content: space-between; }
    .progress-title strong { font-size: 20px; }
    .score { color: #5dba90; font-size: 46px; line-height: 1; font-weight: 800; }
    .hint { margin-top: 4px; color: #b8b5b0; font-size: 14px; }
    .thresholds { margin-top: 34px; display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; }
    .thresholds .loss { color: #f07d70; } .thresholds .win { color: #5dba90; }
    .track { position: relative; height: 4px; margin: 16px 8px 0; background: rgba(255,255,255,.08); }
    .dots { position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center; }
    .dot { width: 10px; height: 10px; border: 2px solid #56534f; border-radius: 50%; background: #252525; }
    .dot.on { background: #5dba90; }
    .dot.now { width: 22px; height: 22px; border: 0; box-shadow: 0 0 0 7px rgba(135,181,158,.14); }
    .ticks { margin-top: 18px; display: flex; justify-content: space-between; color: #b8b5b0; font-size: 12px; }
    .opponent { margin-top: 24px; display: flex; align-items: center; gap: 24px; }
    .stone { width: 84px; height: 84px; flex: 0 0 auto; border-radius: 50%; background: #090a09; border: 1px solid rgba(255,255,255,.08); box-shadow: inset 14px 12px 22px rgba(255,255,255,.13), inset -12px -16px 22px rgba(0,0,0,.65), 0 12px 26px rgba(0,0,0,.38); }
    .opponent-name { font-size: 20px; font-weight: 800; }
    .opponent-rank { margin-top: 4px; font-size: 34px; line-height: 1.1; font-weight: 800; }
    .chips { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { min-height: 24px; padding: 2px 10px; display: inline-flex; align-items: center; border: 1px solid #30a06e; border-radius: 999px; color: #30a06e; font-size: 13px; }
    .chip.neutral { border-color: rgba(255,255,255,.24); color: #d2cfca; }
    .divider { height: 1px; margin: 24px 0; background: rgba(255,255,255,.05); }
    .state-copy { color: #b8b5b0; line-height: 1.5; }
    .actions { margin-top: auto; padding-top: 32px; display: grid; gap: 12px; }
    .action { width: 100%; min-height: 54px; border: 0; border-radius: 8px; background: #4a6b5c; color: #f5f3f0; font-size: 18px; font-weight: 800; box-shadow: 0 3px 6px rgba(0,0,0,.25); }
    .action:active { filter: brightness(.85); }
    .action.danger { min-height: 48px; border: 1px solid #e16b5c; background: transparent; color: #e16b5c; font-size: 16px; }
    .bottom-nav { display: none; }
    @media (max-width: 599px) {
      .topbar { padding: 0 16px; }
      .sidebar, .toggle { display: none; }
      .content { padding: 16px 16px 88px; }
      h1 { font-size: 28px; }
      .back { padding: 6px 12px; }
      .card { grid-template-columns: 1fr; margin-top: 20px; border-radius: 24px; }
      .progress-panel, .challenge { min-height: 0; padding: 24px; }
      .challenge { border-left: 0; border-top: 1px solid rgba(255,255,255,.05); }
      .rank-row { display: block; }
      .rank { font-size: 64px; }
      .system { font-size: 18px; }
      .recent { margin-top: 26px; min-width: 0; }
      .progress { margin-top: 34px; padding-top: 0; }
      .record { margin-top: 36px; }
      .challenge { min-height: 430px; }
      .bottom-nav { height: 64px; position: fixed; inset: auto 0 0; z-index: 10; display: grid; grid-template-columns: repeat(6,1fr); background: #252525; box-shadow: 0 -4px 16px rgba(0,0,0,.28); }
      .bottom-item { display: grid; place-items: center; align-content: center; gap: 3px; color: #b8b5b0; font-size: 11px; }
      .bottom-item.active { color: #5d8270; }
      .bottom-icon { width: 24px; height: 24px; fill: currentColor; }
    }
  </style>
