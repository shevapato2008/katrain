<title>智星盒 Galaxy 现状原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Long+Cang&family=LXGW+WenKai+TC:wght@400;700&display=swap">

<style>
/* ───────────────────────────────────────────────────────────────
   Tokens — copied from the running app, not invented here.
   src/theme.ts (zenTheme) + src/galaxy/theme.ts + spec §4.4
   The product is dark-only; this page commits to that one world
   and paints every colour explicitly so it holds on any host.
   ─────────────────────────────────────────────────────────────── */
:root{
  --bg:#0f0f0f;          /* palette.background.default */
  --surface:#1a1a1a;     /* spec §4.4 secondary surface */
  --paper:#252525;       /* palette.background.paper    */
  --elev:#2e2e2e;

  --jade:#4a6b5c;        /* palette.primary.main  */
  --jade-l:#5d8270;      /* palette.primary.light */
  --jade-d:#2f4539;      /* palette.primary.dark  */

  --tx:#f5f3f0;          /* text.primary   */
  --tx2:#b8b5b0;         /* text.secondary */
  --tx3:#4a4845;         /* text.disabled  */

  --line:rgba(255,255,255,.05);   /* palette.divider */
  --line2:rgba(255,255,255,.10);
  --line3:rgba(255,255,255,.18);

  --ok:#30a06e; --warn:#e89639; --err:#e16b5c; --info:#5b9bd5;

  --r-ctl:8px;     /* shape.borderRadius / spec 控件圆角 */
  --r-card:14px;   /* spec 卡片圆角 */
  --r-dlg:12px;    /* MuiDialog override */
  --r-back:5px;    /* spec 返回按钮圆角 */

  --h-primary:48px; --h-normal:40px; --h-small:32px;   /* spec §4.4 */
  --topbar:52px; --bottomnav:64px;                      /* spec §2.1 / §3.2 */

  /* Latin + digits resolve to the system stack, Han falls through to
     WenKai — the same split the app gets from its subsetted webfont. */
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif,"LXGW WenKai TC",sans-serif;
  --brand:"Long Cang","LXGW WenKai TC",cursive;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;

  --console:#141414;
  --console-line:rgba(255,255,255,.09);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--tx);
  font-family:var(--ui);
  font-size:15px;
  line-height:1.5;
  font-synthesis:none;              /* spec §4.1 */
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--jade-l);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ═══════════════ 原型控制台 · deliberately NOT the product ═══════════════ */
.console{
  position:sticky;top:0;z-index:60;
  background:var(--console);
  border-bottom:1px solid var(--console-line);
  display:flex;align-items:center;gap:18px;
  padding:0 16px;height:52px;
  overflow-x:auto;
}
.console::-webkit-scrollbar{height:0}
.console-mark{
  display:flex;align-items:baseline;gap:8px;flex:none;
  padding-right:16px;border-right:1px solid var(--console-line);height:100%;
}
.console-mark b{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--jade-l)}
.console-mark span{font-size:11px;color:var(--tx3);letter-spacing:.06em}
.cgroup{display:flex;align-items:center;gap:8px;flex:none}
.clabel{font-size:11px;color:var(--tx3);letter-spacing:.1em;text-transform:uppercase;flex:none}
.cseg{display:flex;background:#0c0c0c;border:1px solid var(--console-line);border-radius:var(--r-ctl);padding:2px;gap:2px}
.cseg button{
  border:0;background:transparent;color:var(--tx2);
  padding:5px 11px;border-radius:6px;font-size:12.5px;cursor:pointer;
  transition:background 160ms,color 160ms;white-space:nowrap;
}
.cseg button:hover{background:rgba(255,255,255,.05);color:var(--tx)}
.cseg button[aria-pressed="true"]{background:var(--jade-d);color:#eaf3ee}
.cseg.mode{border-color:rgba(93,130,112,.45)}
.cseg.mode button{font-weight:600;padding:5px 14px}
.cseg.mode button[aria-pressed="true"]{background:var(--jade);color:#f2f7f4}
.modeflag{font-size:11px;color:var(--jade-l);letter-spacing:.04em;flex:none}
.modeflag.now{color:var(--tx3)}
select.cpick{
  background:#0c0c0c;border:1px solid var(--console-line);border-radius:var(--r-ctl);
  color:var(--tx);padding:7px 10px;font-size:13px;min-width:270px;cursor:pointer;
}
.readout{
  margin-left:auto;flex:none;display:flex;gap:0;align-items:stretch;
  border:1px solid var(--console-line);border-radius:var(--r-ctl);overflow:hidden;
}
.readout div{padding:4px 12px;border-right:1px solid var(--console-line);text-align:center}
.readout div:last-child{border-right:0}
.readout dt{font-size:10px;color:var(--tx3);letter-spacing:.08em;margin:0}
.readout dd{margin:0;font-size:14px;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--tx)}
.readout dd.miss{color:var(--warn)}
.readout dd{white-space:nowrap}
.readout div{min-width:76px}

/* ═══════════════ stage ═══════════════ */
.stage{
  padding:28px 20px 110px;
  display:flex;justify-content:center;align-items:flex-start;
  min-height:calc(100vh - 52px);
  background:
    radial-gradient(1200px 500px at 50% -10%,rgba(74,107,92,.10),transparent 70%),
    var(--bg);
}
.frame-wrap{position:relative;margin:0 auto}
.frame-cap{
  display:flex;align-items:baseline;gap:12px;justify-content:center;
  margin-bottom:10px;font-size:12px;color:var(--tx3);
}
.frame-cap code{font-family:var(--mono);color:var(--tx2)}
/* outline, not border — a border would eat 2px of the frame's inner width
   and every board/rail measurement below would come out 2px short. */
.app{
  position:relative;transform-origin:top left;
  background:var(--bg);
  outline:1px solid var(--line3);outline-offset:0;
  border-radius:10px;overflow:hidden;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.9);
  display:flex;flex-direction:column;
}
</style>

<style>
/* ═══════════════════════════════════════════════════════════════
   APP CHROME — geometry transcribed from the real components.
   The frame is a fixed-size box, so the app's own media queries
   can't fire; the breakpoint result is pinned per viewport with
   data attributes instead. Numbers come from:
     GalaxyTopBar.tsx (52)  GalaxySidebar.tsx (240/216/0)
     GalaxyBottomNav.tsx (64)  BoardPageShell.tsx (320/340/380)
   ═══════════════════════════════════════════════════════════════ */
.app[data-vp="1440x900"]{--sidebar-w:216px;--rail-w:340px}
.app[data-vp="1024x768"]{--sidebar-w:0px;--rail-w:320px}
.app[data-vp="430x880"] {--sidebar-w:0px;--rail-w:auto}
.app[data-vp="1280x640"]{--sidebar-w:216px;--rail-w:340px}

/* ── 改版：右栏全站一个数 ──────────────────────────────────────
   340 / 380 两档取消。1440×900 和 1024×768 下卡住棋盘的都是「高度」
   （828 和 696），所以右栏从 340 收到 320 一个棋盘像素都不亏。 */
.app[data-mode="new"][data-vp="1440x900"]{--rail-w:320px}
.app[data-mode="new"][data-vp="1024x768"]{--rail-w:320px}
.app[data-mode="new"][data-vp="1280x640"]{--rail-w:320px}

.ic{width:24px;height:24px;fill:currentColor;flex:none;display:block}
.ic.sm{width:20px;height:20px}
.ic.xs{width:16px;height:16px}

/* ── top bar ─────────────────────────────────────────────────── */
.topbar{
  box-sizing:border-box;height:var(--topbar);min-height:var(--topbar);
  padding:0 16px;display:flex;align-items:center;gap:6px;justify-content:flex-start;
  background:var(--paper);border-bottom:1px solid var(--line);flex:none;
}
.brand{display:flex;align-items:center;gap:8px;height:100%;padding:0 4px;
  background:none;border:0;border-radius:4px;cursor:pointer}
.brand:hover{background:rgba(255,255,255,.04)}
.brand img{width:32px;height:32px;object-fit:contain}
.brand-cn{font-family:var(--brand);font-size:22px;line-height:1;font-weight:400}
.brand-latin{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:14px;line-height:1;font-weight:600;letter-spacing:.02em}

/* ── row / sidebar / main ────────────────────────────────────── */
.row{position:relative;display:flex;flex:1;min-height:0}
.sidebar{
  flex:0 0 var(--sidebar-w);width:var(--sidebar-w);min-width:0;height:100%;
  overflow:hidden;background:var(--paper);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
}
.app[data-vp="1024x768"] .sidebar,
.app[data-vp="430x880"] .sidebar{border-right:0}
.sidenav{flex:1;min-height:0;overflow-y:auto;padding:16px 0 8px;list-style:none;margin:0}
.sidenav li{margin:0 8px}
.navitem{
  width:100%;display:flex;align-items:center;gap:0;
  padding:8px 16px;border:0;background:transparent;border-radius:16px;
  cursor:pointer;text-align:left;color:var(--tx2);
  transition:background 150ms;
}
.navitem .ic{margin-right:16px;color:var(--tx2)}
.navitem:hover{background:rgba(255,255,255,.04)}
.navitem[aria-current="page"]{background:var(--jade-d);color:var(--tx);font-weight:600}
.navitem[aria-current="page"] .ic{color:var(--jade)}
.side-foot{border-top:1px solid var(--line);padding:16px;flex:none}
.usercard{
  padding:12px;background:var(--bg);border-radius:16px;
  display:flex;align-items:center;gap:12px;margin-top:8px;
}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--jade);
  display:grid;place-items:center;font-size:12px;flex:none;color:#eaf3ee}
.sidebar-toggle{
  position:absolute;left:var(--sidebar-w);top:50%;transform:translateY(-50%);
  width:44px;height:44px;border-radius:50%;z-index:30;
  background:var(--paper);border:1px solid var(--line2);color:var(--tx2);
  display:grid;place-items:center;cursor:pointer;
}
.sidebar-toggle:hover{color:var(--tx);border-color:var(--line3)}
.app[data-vp="430x880"] .sidebar-toggle{display:none}

.main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;box-sizing:border-box}

/* ── bottom nav (mobile only) ────────────────────────────────── */
.bottomnav{
  position:absolute;left:0;right:0;bottom:0;height:var(--bottomnav);z-index:40;
  background:var(--paper);border-top:1px solid var(--line);
  display:flex;
}
.bottomnav button{
  flex:1;border:0;background:transparent;cursor:pointer;color:var(--tx3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:11px;padding:0;min-width:0;
}
.bottomnav button[aria-current="page"]{color:var(--jade)}
.bottomnav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* ═══ BoardPageShell — BoardPageShell.tsx transcribed ═══════════ */
.shell{
  width:100%;height:100%;min-height:0;position:relative;
  display:grid;grid-template-columns:minmax(0,1fr) var(--rail-w);
  grid-template-rows:minmax(0,1fr);overflow:hidden;box-sizing:border-box;
}
.app[data-vp="430x880"] .shell{
  display:flex;flex-direction:column;overflow:hidden;overflow-y:auto;
  padding-bottom:var(--bottomnav);
}
.stage-box{
  width:auto;max-width:none;flex:none;min-width:0;min-height:0;
  display:grid;place-items:center;padding:6px;box-sizing:border-box;
}
.app[data-vp="430x880"] .stage-box{width:100%;max-width:100%;aspect-ratio:1/1}
.rail{
  width:100%;display:flex;flex-direction:column;flex:none;
  min-height:0;overflow:hidden;border-left:1px solid var(--line);
  background:var(--paper);
}
.app[data-vp="430x880"] .rail{min-height:auto;overflow:visible;border-left:0;border-top:1px solid var(--line)}
.rail-module{flex:none}
.rail-scroll{
  display:flex;flex-direction:column;flex:1;min-height:0;
  overflow-x:hidden;overflow-y:auto;scrollbar-gutter:stable;
}
.app[data-vp="430x880"] .rail-scroll{flex:none;overflow:visible}
.rail-actions{flex:none;border-top:1px solid var(--line)}
.rail-scroll::-webkit-scrollbar{width:8px}
.rail-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}

/* module plate — ModulePlate.tsx */
.plate{
  display:flex;align-items:center;gap:12px;min-width:0;min-height:52px;
  padding:0 16px;border-bottom:1px solid var(--line);
}
.plate.iconleft{padding-left:4px}
.plate-text{min-width:0;flex:1}
.plate-title{font-size:1.25rem;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate-sub{font-size:.875rem;color:var(--tx2);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ═══ content-page shell — AiSetupPage.tsx:443-453 ═════════════ */
.content{
  flex:1;min-height:0;overflow-y:auto;
  padding:24px 32px;box-sizing:border-box;
}
.app[data-vp="1024x768"] .content{padding:24px}
.app[data-vp="430x880"] .content{padding:16px 16px calc(var(--bottomnav) + 16px)}
.content-inner{width:100%;max-width:1500px;margin:0 auto}
.content::-webkit-scrollbar{width:8px}
.content::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}

/* content page header — ContentPageHeader.tsx */
.cph{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.cph h1{font-size:2.125rem;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
.app[data-vp="430x880"] .cph h1{font-size:1.5rem}

/* ═══ MUI-equivalent controls ═════════════════════════════════ */
.mbtn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:var(--r-ctl);border:0;background:transparent;
  padding:8px 16px;min-height:var(--h-normal);
  font-size:.875rem;font-weight:600;line-height:1.2;
  color:var(--jade-l);cursor:pointer;text-transform:none;
  transition:background 150ms,border-color 150ms,color 150ms,opacity 150ms;
  white-space:nowrap;
}
.mbtn:hover{background:rgba(93,130,112,.12)}
.mbtn.outlined{border:1px solid rgba(93,130,112,.5)}
.mbtn.outlined:hover{border-color:var(--jade-l)}
.mbtn.contained{background:var(--jade);color:#f2f7f4}
.mbtn.contained:hover{background:var(--jade-l)}
.mbtn.lg{min-height:var(--h-primary);font-size:.95rem;padding:12px 22px}
.mbtn.sm{min-height:var(--h-small);font-size:.8125rem;padding:5px 12px}
.mbtn.full{width:100%}
.mbtn.inherit{color:var(--tx2)}
.mbtn.inherit.outlined{border-color:var(--line2)}
.mbtn.inherit:hover{background:rgba(255,255,255,.06);color:var(--tx)}
.mbtn.err{color:var(--err)}
.mbtn.err.contained{background:var(--err);color:#2a0f0c}
.mbtn.err.outlined{border-color:rgba(225,107,92,.5)}
.mbtn.err:hover{background:rgba(225,107,92,.12)}
.mbtn.ok{color:var(--ok)}
.mbtn.ok.contained{background:var(--ok);color:#04150d}
.mbtn.warn{color:var(--warn)}
.mbtn[disabled],.mbtn[aria-disabled="true"]{color:var(--tx3);border-color:var(--line);
  background:transparent;cursor:not-allowed;pointer-events:none}
.mbtn.contained[disabled]{background:rgba(255,255,255,.06);color:var(--tx3)}

.iconbtn{
  width:var(--h-normal);height:var(--h-normal);border-radius:50%;
  border:0;background:transparent;color:var(--tx2);
  display:inline-grid;place-items:center;cursor:pointer;flex:none;
  transition:background 150ms,color 150ms;
}
.iconbtn:hover{background:rgba(255,255,255,.08);color:var(--tx)}
.iconbtn.sm{width:var(--h-small);height:var(--h-small)}
.iconbtn.back{border-radius:var(--r-back)}
.iconbtn[disabled]{color:var(--tx3);cursor:not-allowed;pointer-events:none}

.tgroup{display:flex;border:1px solid var(--line2);border-radius:var(--r-ctl);overflow:hidden}
.tgroup .tbtn{flex:1;border:0;border-right:1px solid var(--line2);border-radius:0}
.tgroup .tbtn:last-child{border-right:0}
.tbtn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:var(--h-normal);padding:6px 10px;font-size:.78rem;
  background:transparent;color:var(--tx2);border:1px solid var(--line2);
  border-radius:var(--r-ctl);cursor:pointer;transition:background 150ms,color 150ms;
  white-space:nowrap;
}
.tbtn:hover{background:rgba(255,255,255,.06);color:var(--tx)}
.tbtn[aria-pressed="true"]{background:var(--jade-d);color:var(--tx);border-color:var(--jade)}
.tbtn[disabled]{color:var(--tx3);cursor:not-allowed;pointer-events:none}

/* 播放条（PlaybackBar.tsx）。一行装完：五个走子键 + 播放键 +（仅直播）
   自动跟进 + 手数。自动跟进是 ToggleButton border:none，选中时 success.main。 */
.iconbtn.play{width:42px;height:42px;background:var(--jade);color:#eef4f0}
.iconbtn.play:hover{background:var(--jade-l);color:#eef4f0}
/* 一行要在 320 右栏（内宽 ~288）里装下：小键 30 + 播放 42 + 跟进 30 +
   间距 2 + 手数 .74rem ≈ 275。真容器窄到装不下时（现状档 430 的旧版式
   右栏只有 200）允许换行 —— 真代码在 340 断点也是换行，不是硬挤。 */
.pbrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px}
.pbrow .iconbtn.sm{width:30px;height:30px}
.syncbtn{
  width:30px;height:30px;flex:none;border:0;border-radius:var(--r-ctl);
  background:transparent;color:var(--tx2);display:inline-grid;place-items:center;
  cursor:pointer;transition:background 150ms,color 150ms;
}
.syncbtn:hover{background:rgba(255,255,255,.08);color:var(--tx)}
.syncbtn[aria-pressed="true"]{background:var(--ok);color:#0c1a12}
.syncbtn[aria-pressed="true"]:hover{background:#288a5e;color:#0c1a12}

/* 研究室 / 变化图工具栏里的三个自定义图标 —— 真代码是手画的圆，不是 MUI 图标 */
.stoneic{width:18px;height:18px;border-radius:50%;box-sizing:border-box;flex:none}
.stoneic.b{background:#1a1a1a;border:1.5px solid rgba(255,255,255,.2);box-shadow:inset 0 -1px 2px rgba(255,255,255,.1)}
.stoneic.w{background:#fff;border:1.5px solid rgba(0,0,0,.3);box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
.stoneic.alt{width:25px;height:16px;border-radius:0;background:none;position:relative}
.stoneic.alt i{position:absolute;top:0;width:16px;height:16px;border-radius:50%;box-sizing:border-box}
.stoneic.alt i:first-child{left:0;z-index:1;background:#1a1a1a;border:1.5px solid rgba(255,255,255,.2)}
.stoneic.alt i:last-child{left:9px;background:#fff;border:1.5px solid rgba(0,0,0,.3)}
.tbtn .glyph{font-size:.8rem;font-weight:700;line-height:1;height:18px;display:grid;place-items:center}

/* ResearchToolbar 的 isDestructive：没激活也是红字（真代码 color: error.main） */
.tbtn.danger{color:var(--err);border-color:rgba(225,107,92,.32)}
.tbtn.danger:hover{background:rgba(225,107,92,.12);color:var(--err)}
.tbtn.danger[aria-pressed="true"]{background:rgba(211,47,47,.15);border-color:var(--err);color:var(--err)}

/* 移动档滚动条：真机是叠加式的，不占布局宽度；桌面 Chromium 默认是
   经典滚动条，会从棋盘那一列里吃掉 15px，把 430 档的棋盘从 410 量成
   395。原型按真机来，否则量到的是浏览器的毛病不是版式的。 */
.app[data-vp="430x880"] .shell::-webkit-scrollbar{width:0;height:0}

/* 四列工具格。340 下横排还塞得下，320 下第 4 列会被切，
   所以在改版模式里改成「图标在上、文字在下」。现状模式不受影响。 */
.app[data-mode="new"] .toolgrid .tbtn{
  flex-direction:column;gap:3px;height:54px;min-height:0;padding:6px 2px;
  font-size:.66rem;line-height:1.1;
}
.app[data-mode="new"] .toolgrid .tbtn .ic{width:18px;height:18px}

/* ═══ 难度阶梯（死活题 · 难度列表）══════════════════════════════
   15K→7D 是一条有序的阶梯，不是 8 个等价的盒子。所以用「行」不用
   「格」：一行 = 一档，级位和段位之间画一道真的坎，自己的水平在坎
   的哪一侧一眼可见。玉色只给两样东西 —— 「你在这里」和已解进度。
   三个分类从 24 枚 chip 收成每行一条三段分布条，图例只出现一次；
   第三段的颜色取自棋盘木色，不另起色系。 */
.ladder{display:flex;flex-direction:column;gap:5px}
.lrung{
  display:grid;align-items:center;gap:18px;width:100%;
  grid-template-columns:56px minmax(120px,1fr) minmax(140px,200px) 62px 116px 20px;
  background:var(--paper);border:1px solid var(--line);border-left:3px solid transparent;
  border-radius:10px;padding:10px 14px 10px 12px;
  color:inherit;font:inherit;text-align:left;cursor:pointer;
  transition:background 160ms,border-color 160ms;
}
.lrung:hover{background:#242424;border-color:var(--line3)}
.lrung:focus-visible{outline:2px solid var(--jade-l);outline-offset:2px}
.lrung.dan{background:#1c1a18}
.lrung.dan:hover{background:#252220}
.lrung.me{border-left-color:var(--jade)}
.rung-badge{
  height:34px;border-radius:8px;display:grid;place-items:center;
  background:rgba(255,255,255,.05);border:1px solid var(--line2);
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:1.05rem;font-weight:700;letter-spacing:.02em;color:var(--tx);
}
.lrung.me .rung-badge{background:var(--jade-d);border-color:var(--jade);color:#e6f1ea}
.rung-name{font-size:.95rem;font-weight:600;line-height:1.25}
.rung-sub{font-size:.72rem;color:var(--tx3);margin-top:2px}
/* 条的「长度」编码题量、「分段」编码构成。八档比例本来就接近，
   光靠分段看不出差别；宽度一起用上，题库从 15K 到 7D 变薄这件事
   就在同一条上读出来了。 */
.rung-bar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.05)}
.rung-bar i{display:block;height:100%}
.rung-barwrap{display:flex;align-items:center}
.rung-total{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.85rem;
  color:var(--tx2);text-align:right}
.rung-prog{display:flex;flex-direction:column;gap:5px}
.rung-prog .track{height:6px;border-radius:3px;background:rgba(255,255,255,.13);overflow:hidden}
.rung-prog .fill{display:block;height:100%;background:var(--jade-l);border-radius:3px}
.rung-prog .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.74rem;color:var(--tx2)}
.rung-prog .num.zero{color:var(--tx3)}
.rung-prog .num b{font-weight:600;color:var(--jade-l)}
.lrung .chev{color:var(--tx3)}
.lrung:hover .chev{color:var(--tx2)}
.tier-seam{
  display:flex;align-items:center;gap:12px;margin:12px 2px 6px;
  font-size:.7rem;letter-spacing:.16em;color:var(--tx2);
}
.tier-seam:first-child{margin-top:0}
.tier-seam::after{content:"";flex:1;height:1px;background:var(--line3)}
.tier-seam em{font-style:normal;color:var(--tx3);letter-spacing:.02em;font-size:.68rem}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.72rem;color:var(--tx3)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:block}
.resume{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:linear-gradient(100deg,rgba(74,107,92,.18),rgba(74,107,92,.05));
  border:1px solid rgba(93,130,112,.4);border-radius:12px;padding:12px 18px;
}

/* ── 棋手卡 · 轮次高亮 ─────────────────────────────────────────
   轮到谁下，谁的卡描边变玉色、时钟变玉色、名字前多一个呼吸点，
   卡底压一条「该你了」。另一张压到 62% 不透明度。
   只靠颜色区分是不够的（色盲 / 强光下的 7 寸屏），所以同时给了
   文字、位移和一个动的点，三条冗余。 */
.pcard{
  background:var(--paper);border:1px solid var(--line);border-radius:10px;
  padding:10px;position:relative;overflow:hidden;transition:border-color 160ms,background 160ms;
}
.pcard .clock{transition:color 160ms}
.pcard:not(.on){opacity:.62}
.pcard.on{
  border-color:var(--jade);background:#232b26;
  box-shadow:0 0 0 1px rgba(93,130,112,.35), 0 6px 18px -10px rgba(93,130,112,.7);
  padding-bottom:22px;
}
.pcard.on .clock{color:var(--jade-l)}
.pcard .turn{
  width:7px;height:7px;border-radius:50%;background:var(--jade-l);flex:none;
  animation:pulse 1.4s infinite;
}
.pcard-turn{
  position:absolute;left:0;right:0;bottom:0;
  background:var(--jade-d);color:#dcebe3;
  font-size:.62rem;letter-spacing:.08em;text-align:center;padding:2px 0;
}

/* 棋手卡里的关注 / 暂停：150px 宽的卡放不下两个 32px 圆钮 + 时钟，
   会换行，让两张卡一高一低。缩到 26px 就在一行了。 */
.pcard-icons{flex:none;display:flex;gap:0}
.pcard-icons .iconbtn{width:26px;height:26px}
.pcard-icons .ic{width:17px;height:17px}

.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:6px 0;font-size:.875rem;color:var(--tx2)}
.sw{width:38px;height:20px;border-radius:10px;background:rgba(255,255,255,.16);
  border:0;position:relative;cursor:pointer;flex:none;transition:background 150ms}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;
  border-radius:50%;background:var(--tx2);transition:transform 150ms,background 150ms}
.sw[aria-checked="true"]{background:rgba(74,107,92,.5)}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:var(--jade-l)}

.field{
  width:100%;background:rgba(255,255,255,.025);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;color:var(--tx);font-size:.88rem;
  transition:background 200ms,border-color 200ms;
}
.field::placeholder{color:var(--tx3)}
.field:hover{background:rgba(255,255,255,.04);border-color:var(--line2)}
.field:focus{outline:0;background:rgba(255,255,255,.045);border-color:rgba(74,107,92,.4)}
.fieldwrap{position:relative;display:flex;align-items:center}
.fieldwrap .ic{position:absolute;left:10px;color:var(--tx3)}
.fieldwrap .field{padding-left:36px}
.flabel{display:block;font-size:.72rem;color:var(--tx3);letter-spacing:.04em;margin-bottom:5px}

.sel{appearance:none;width:100%;background:var(--surface);border:1px solid var(--line2);
  border-radius:var(--r-ctl);padding:9px 32px 9px 12px;color:var(--tx);font-size:.88rem;cursor:pointer}
.selwrap{position:relative}
.selwrap .ic{position:absolute;right:6px;top:50%;transform:translateY(-50%);color:var(--tx3);pointer-events:none}

.slider{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;
  background:rgba(255,255,255,.16);outline:0;cursor:pointer}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--jade-l);cursor:pointer}
.slider::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--jade-l)}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-card);
  transition:border-color 160ms,background 160ms}
.card.click{cursor:pointer;text-align:left;width:100%;display:block;color:inherit;font:inherit}
.card.click:hover{border-color:rgba(74,107,92,.45);background:#2a2a2a}
.card.sel{border-color:var(--jade);background:#2a302c}

.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;
  border-radius:11px;font-size:.7rem;border:1px solid var(--line2);color:var(--tx2);
  background:transparent;white-space:nowrap}
.chip.filled{background:var(--jade-d);border-color:transparent;color:#dcebe3}
.chip.err{color:var(--err);border-color:rgba(225,107,92,.45)}
.chip.err.filled{background:var(--err);color:#2a0f0c;border-color:transparent}
.chip.warn{color:var(--warn);border-color:rgba(232,150,57,.45)}
.chip.ok{color:var(--ok);border-color:rgba(48,160,110,.45)}
.chip.info{color:var(--info);border-color:rgba(91,155,213,.45)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.chip.pulse .dot{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r-ctl);
  font-size:.85rem;border:1px solid;line-height:1.45}
.alert.error{background:rgba(225,107,92,.12);border-color:rgba(225,107,92,.35);color:#f2b7ae}
.alert.warning{background:rgba(232,150,57,.12);border-color:rgba(232,150,57,.35);color:#f0c890}
.alert.info{background:rgba(91,155,213,.12);border-color:rgba(91,155,213,.35);color:#a8caea}
.alert.success{background:rgba(48,160,110,.12);border-color:rgba(48,160,110,.35);color:#93d6b6}

.skel{background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));
  background-size:200% 100%;animation:shim 1.4s linear infinite;border-radius:6px}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
.spin{width:22px;height:22px;border:2px solid rgba(255,255,255,.15);border-top-color:var(--jade-l);
  border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.crumbs{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--tx2);flex-wrap:wrap}
.crumbs button{background:none;border:0;color:var(--info);cursor:pointer;padding:0;font-size:inherit;
  text-decoration:underline;text-underline-offset:2px}
.crumbs span.sep{color:var(--tx3)}

.pager{display:flex;gap:4px;justify-content:center;align-items:center}
.pager button{min-width:30px;height:30px;border-radius:6px;border:0;background:transparent;
  color:var(--tx2);cursor:pointer;font-size:.8rem}
.pager button:hover{background:rgba(255,255,255,.07)}
.pager button[aria-current="true"]{background:var(--jade);color:#eef4f0}

/* dialogs — rendered inline in the frame, MuiDialog radius 12 */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.62);z-index:50;
  display:grid;place-items:center;padding:24px}
.dlg{background:var(--paper);border-radius:var(--r-dlg);width:100%;max-width:420px;
  border:1px solid var(--line2);box-shadow:0 24px 60px -12px rgba(0,0,0,.8)}
.dlg h3{margin:0;padding:18px 22px 6px;font-size:1.125rem;font-weight:600}
.dlg p{margin:0;padding:0 22px 18px;color:var(--tx2);font-size:.9rem;line-height:1.55}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;padding:8px 14px 14px}

.snack{position:absolute;left:50%;transform:translateX(-50%);z-index:45;
  padding:10px 18px;border-radius:var(--r-ctl);font-size:.85rem;font-weight:600}
.snack.top{top:16px}.snack.bottom{bottom:80px}
.snack.success{background:var(--ok);color:#04150d}
.snack.error{background:var(--err);color:#2a0f0c}

.grid{display:grid;gap:16px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sec-label{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin:0 0 8px}
.hr{height:1px;background:var(--line);border:0;margin:0}
.pad{padding:16px}
.muted{color:var(--tx2)}
.dim{color:var(--tx3)}
</style>

<style>
.layout{display:flex;align-items:flex-start}
.stagecol{flex:1;min-width:0}
/* ── control drawer ─────────────────────────────────────────── */
.drawer{
  position:sticky;top:52px;flex:0 0 320px;width:320px;
  height:calc(100vh - 52px);overflow:hidden;
  border-left:1px solid var(--console-line);background:var(--console);
  display:flex;flex-direction:column;
}
body.nodrawer .drawer{display:none}
.drawer-head{padding:14px 16px 12px;border-bottom:1px solid var(--console-line);flex:none}
.drawer-head h2{margin:0 0 2px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);font-weight:600}
.drawer-head .big{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.drawer-head .big b{font-size:1.75rem;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--jade-l);line-height:1}
.drawer-head .big span{font-size:.78rem;color:var(--tx3)}
.drawer-head .who{margin:8px 0 0;font-size:.85rem;color:var(--tx);line-height:1.4}
.drawer-head .route{margin:2px 0 0;font-size:.72rem;font-family:var(--mono);color:var(--tx3)}
.drawer-body{flex:1;min-height:0;overflow-y:auto;padding:8px 8px 24px}
.drawer-body::-webkit-scrollbar{width:8px}
.drawer-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
.zblock{margin-bottom:12px}
.zname{display:flex;align-items:center;justify-content:space-between;margin:0 0 4px;padding:6px 8px 4px;
  font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);
  border-bottom:1px solid var(--console-line)}
.zname em{font-style:normal;font-family:var(--mono);color:var(--jade-l)}
.crow{display:grid;grid-template-columns:60px 1fr;gap:2px 8px;width:100%;text-align:left;
  background:transparent;border:0;border-radius:6px;padding:5px 8px;cursor:pointer;color:var(--tx2)}
.crow:hover{background:rgba(255,255,255,.05)}
.crow .ck{font-size:.6rem;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3);
  align-self:center;overflow:hidden;text-overflow:ellipsis}
.crow .cl{font-size:.82rem;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .cs{grid-column:2;font-size:.65rem;font-family:var(--mono);color:var(--tx3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%,55%{box-shadow:0 0 0 3px var(--warn);border-radius:6px}100%{box-shadow:0 0 0 0 transparent}}

/* ── click log, docked in the drawer ── */
.logpane{flex:none;border-top:1px solid var(--console-line);background:#101010;max-height:210px;display:flex;flex-direction:column}
.logpane-head{margin:0;padding:9px 16px 7px;font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);
  display:flex;align-items:baseline;gap:8px;flex:none}
.logpane-head b{font-family:var(--mono);color:var(--jade-l);font-size:.85rem}
.logpane-head span{text-transform:none;letter-spacing:0;font-size:.68rem;opacity:.75}
.logpane ol{margin:0;padding:0 0 8px;list-style:none;overflow-y:auto;flex:1;min-height:0}
.logpane ol::-webkit-scrollbar{width:6px}
.logpane ol::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
.logpane li{display:grid;grid-template-columns:auto 1fr;gap:8px;padding:4px 16px;font-size:.72rem;
  border-bottom:1px solid rgba(255,255,255,.04)}
.logpane li .t{font-family:var(--mono);color:var(--tx3)}
.logpane li .a{color:var(--tx);overflow:hidden}
.logpane li .a em{font-style:normal;color:var(--tx3);display:block;font-size:.68rem}
.logpane .empty{display:block;padding:8px 16px;font-size:.72rem;color:var(--tx3);border:0}

.note{max-width:760px;margin:0 auto;padding:24px 20px 60px;color:var(--tx2);font-size:.86rem;line-height:1.7}
.note h3{color:var(--tx);font-size:.95rem;margin:22px 0 6px}
.note code{font-family:var(--mono);font-size:.8rem;color:var(--jade-l);background:rgba(74,107,92,.12);
  padding:1px 5px;border-radius:4px}
.note ul{margin:6px 0;padding-left:18px}
.note li{margin:3px 0}
@media (max-width:1100px){ .drawer{display:none} }
</style>

<div class="console">
  <div class="console-mark"><b>原型控制台</b><span>不是产品的一部分</span></div>

  <div class="cgroup">
    <span class="clabel">版式</span>
    <div class="cseg mode" id="modes">
      <button data-mode="now" aria-pressed="true">现状</button>
      <button data-mode="new" aria-pressed="false">改版</button>
    </div>
    <span class="modeflag now" id="modeFlag">照搬今天的代码</span>
  </div>

  <div class="cgroup">
    <span class="clabel">页面</span>
    <select class="cpick" id="pick" aria-label="选择页面"></select>
  </div>

  <div class="cgroup" id="branchWrap">
    <span class="clabel">分支</span>
    <div class="cseg" id="branches"></div>
  </div>

  <div class="cgroup" id="dlgWrap">
    <span class="clabel">弹窗</span>
    <div class="cseg" id="dlgs"></div>
  </div>

  <div class="cgroup">
    <span class="clabel">视口</span>
    <div class="cseg" id="vps"></div>

  </div>

  <dl class="readout" aria-label="实测几何">
    <div id="roTop"><dt>顶栏</dt><dd>—</dd></div>
    <div id="roSide"><dt>左栏</dt><dd>—</dd></div>
    <div id="roRail"><dt>右栏</dt><dd>—</dd></div>
    <div id="roBoard"><dt>棋盘</dt><dd>—</dd></div>
  </dl>
</div>

<div class="layout">
  <div class="stagecol">
    <div class="stage">
      <div>
        <div class="frame-cap">
          <code id="capRoute">/galaxy</code>
          <span id="scaleNote">1:1</span>
        </div>
        <div id="frameWrap" class="frame-wrap"><div class="app" id="app"></div></div>
        <div class="note" id="footnote"></div>
      </div>
    </div>
  </div>

  <aside class="drawer" aria-label="本页控件清单">
    <div class="drawer-head">
      <h2>本页控件</h2>
      <div class="big"><b id="ctlCount">0</b><span>个可点控件，全部来自现有代码</span></div>
      <p class="who" id="ctlScreen">—</p>
      <p class="route" id="ctlRoute">—</p>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="logpane">
      <p class="logpane-head">点击记录 <b id="logCount">0</b><span>每个按钮都记下它在真实代码里做什么</span></p>
      <ol id="logList"><li class="empty">还没有点击。点左边框里任意按钮试试。</li></ol>
    </div>
  </aside>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   Board renderer — the layout maths is transcribed verbatim from
   src/components/board/boardUtils.ts (calculateBoardLayout /
   gridToCanvas), so the board in this prototype occupies exactly
   the pixels the real one would at the same stage size.
   ═══════════════════════════════════════════════════════════════ */
const WOOD = '#d7a34d';                       /* sampled from katrain/img/board.png */
const LETTERS = 'ABCDEFGHJKLMNOPQRST';        /* Go skips I */

function boardLayout(w, h, size) {
  const spaces = size - 1 + 3;                /* 1.5 margin each side */
  const gridSize = Math.floor(Math.min(w / spaces, h / spaces));
  const bw = spaces * gridSize;
  return { gridSize, ox: Math.round((w - bw) / 2), oy: Math.round((h - bw) / 2) };
}
function g2c(L, x, y, size) {
  return { x: L.ox + (1.5 + x) * L.gridSize, y: L.oy + (1.5 + (size - 1 - y)) * L.gridSize };
}
const STARS = {
  19: [3, 9, 15], 13: [3, 6, 9], 9: [2, 4, 6],
};

function drawBoard(cv, o) {
  const size = o.size || 19;
  const px = cv.width;
  const ctx = cv.getContext('2d');
  const L = boardLayout(px, px, size);
  const gs = L.gridSize;

  /* wood */
  ctx.clearRect(0, 0, px, px);
  const wood = ctx.createRadialGradient(px * .38, px * .3, px * .05, px * .5, px * .5, px * .78);
  wood.addColorStop(0, '#e0af5b'); wood.addColorStop(.55, WOOD); wood.addColorStop(1, '#bf8b3b');
  ctx.fillStyle = wood; ctx.fillRect(0, 0, px, px);
  ctx.globalAlpha = .05; ctx.strokeStyle = '#5a3a12'; ctx.lineWidth = 1;
  for (let i = 0; i < px; i += 7) { ctx.beginPath(); ctx.moveTo(0, i + (i % 3)); ctx.lineTo(px, i); ctx.stroke(); }
  ctx.globalAlpha = 1;

  /* grid */
  ctx.strokeStyle = 'rgba(30,18,4,.72)';
  ctx.lineWidth = Math.max(1, gs * .035);
  for (let i = 0; i < size; i++) {
    const a = g2c(L, i, 0, size), b = g2c(L, i, size - 1, size);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    const c = g2c(L, 0, i, size), d = g2c(L, size - 1, i, size);
    ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.stroke();
  }
  ctx.lineWidth = Math.max(1.4, gs * .06);
  const tl = g2c(L, 0, size - 1, size), br = g2c(L, size - 1, 0, size);
  ctx.strokeRect(tl.x, tl.y, br.x - tl.x, br.y - tl.y);

  /* star points */
  ctx.fillStyle = 'rgba(30,18,4,.85)';
  (STARS[size] || []).forEach(sx => (STARS[size] || []).forEach(sy => {
    const p = g2c(L, sx, sy, size);
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(1.8, gs * .1), 0, 7); ctx.fill();
  }));

  /* coordinates */
  if (o.coords !== false && gs > 9) {
    ctx.fillStyle = 'rgba(40,25,6,.72)';
    ctx.font = `${Math.max(8, Math.round(gs * .5))}px -apple-system,system-ui,sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 0; i < size; i++) {
      const t = g2c(L, i, size - 1, size), b2 = g2c(L, i, 0, size);
      ctx.fillText(LETTERS[i], t.x, t.y - gs * 0.95);
      ctx.fillText(LETTERS[i], b2.x, b2.y + gs * 0.95);
      const l = g2c(L, 0, i, size), r = g2c(L, size - 1, i, size);
      ctx.fillText(String(i + 1), l.x - gs * 0.95, l.y);
      ctx.fillText(String(i + 1), r.x + gs * 0.95, r.y);
    }
  }

  /* stones */
  const R = gs * .47;
  (o.stones || []).forEach(([x, y, c]) => {
    const p = g2c(L, x, y, size);
    ctx.beginPath(); ctx.arc(p.x + R * .12, p.y + R * .16, R, 0, 7);
    ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fill();
    const g = ctx.createRadialGradient(p.x - R * .35, p.y - R * .4, R * .1, p.x, p.y, R);
    if (c === 'B') { g.addColorStop(0, '#5a5a5a'); g.addColorStop(.5, '#1c1c1c'); g.addColorStop(1, '#050505'); }
    else { g.addColorStop(0, '#ffffff'); g.addColorStop(.6, '#f0eee9'); g.addColorStop(1, '#cdc9c0'); }
    ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, 7); ctx.fillStyle = g; ctx.fill();
  });

  /* last move ring */
  if (o.last) {
    const p = g2c(L, o.last[0], o.last[1], size);
    ctx.strokeStyle = o.last[2] === 'B' ? '#ffffff' : '#111111';
    ctx.lineWidth = Math.max(1.5, gs * .09);
    ctx.beginPath(); ctx.arc(p.x, p.y, R * .5, 0, 7); ctx.stroke();
  }

  /* move numbers */
  if (o.numbers) {
    ctx.font = `600 ${Math.round(gs * .5)}px var(--mono),monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    (o.stones || []).forEach(([x, y, c], i) => {
      const p = g2c(L, x, y, size);
      ctx.fillStyle = c === 'B' ? '#fff' : '#000';
      ctx.fillText(String(i + 1), p.x, p.y);
    });
  }

  /* AI candidate markers */
  (o.ai || []).forEach((m, i) => {
    const p = g2c(L, m[0], m[1], size);
    ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, 7);
    ctx.fillStyle = i === 0 ? 'rgba(93,130,112,.92)' : 'rgba(93,130,112,.62)'; ctx.fill();
    if (i === 0) { ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = Math.max(2, gs * .08); ctx.stroke(); }
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `700 ${Math.round(gs * .38)}px -apple-system,system-ui,sans-serif`;
    ctx.fillText(m[2], p.x, p.y - gs * .12);
    ctx.font = `${Math.round(gs * .3)}px -apple-system,system-ui,sans-serif`;
    ctx.fillText(m[3], p.x, p.y + gs * .26);
  });

  /* territory ownership overlay */
  if (o.territory) {
    (o.territory).forEach(([x, y, v]) => {
      const p = g2c(L, x, y, size);
      ctx.fillStyle = v > 0 ? `rgba(0,0,0,${Math.abs(v) * .45})` : `rgba(255,255,255,${Math.abs(v) * .45})`;
      const s = gs * .5;
      ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    });
  }
}

/* deterministic pseudo-game so every screen shows the same plausible position */
function demoStones(n) {
  const seq = [[3,3,'B'],[15,15,'W'],[15,3,'B'],[3,15,'W'],[16,9,'B'],[2,9,'W'],[9,16,'B'],[9,2,'W'],
    [5,2,'B'],[2,5,'W'],[13,2,'B'],[16,5,'W'],[16,13,'B'],[13,16,'W'],[5,16,'B'],[2,13,'W'],
    [9,9,'B'],[11,10,'W'],[8,10,'B'],[10,12,'W'],[7,7,'B'],[12,6,'W'],[6,11,'B'],[13,11,'W'],
    [10,4,'B'],[7,4,'W'],[4,7,'B'],[11,14,'W'],[14,7,'B'],[6,14,'W'],[8,6,'B'],[12,9,'W'],
    [5,9,'B'],[14,11,'W'],[9,13,'B'],[10,7,'W'],[7,12,'B'],[12,13,'W'],[4,11,'B'],[15,9,'W']];
  return seq.slice(0, n);
}

/* ═══════════════════════════════════════════════════════════════
   Runtime
   ═══════════════════════════════════════════════════════════════ */
const VPS = [
  { id: '1440x900', w: 1440, h: 900, label: '1440×900 标准', sidebar: 216, rail: 340, board: 828 },
  { id: '1024x768', w: 1024, h: 768, label: '1024×768 窄', sidebar: 0, rail: 320, board: 684 },
  { id: '430x880', w: 430, h: 880, label: '430×880 竖屏', sidebar: 0, rail: null, board: 410 },
  /* 承重用，不是验收档：把可用高度压到 588，右栏中段必然要滚 */
  { id: '1280x640', w: 1280, h: 640, label: '1280×640 压扁', sidebar: 216, rail: 320, board: 568, stress: true },
];

const S = {
  screen: null, branch: null, vp: '1440x900', mode: 'now', stress: false,
  dialog: null, snack: null, drawer: true,
  toggles: {}, log: [],
};

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
/* 传图标名走 sprite；直接传一段 HTML（'<' 开头）就原样放行 ——
   真实代码里有几个图标不是 MUI 图标，是手画的 Box 或纯字形。 */
const icon = (n, cls) => (n && String(n)[0] === '<') ? n : `<svg class="ic ${cls || ''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
/* ResearchToolbar.tsx:51/66/81 与 BoardEditToolbar.tsx:18/28/38 的自定义图标 */
const STONE = {
  b: '<span class="stoneic b"></span>',
  w: '<span class="stoneic w"></span>',
  alt: '<span class="stoneic alt"><i></i><i></i></span>',
};
/* BoardEditToolbar 的 123 / A / a / △ / ✕ 是 <Typography>，不是图标 */
const glyph = (s) => `<span class="glyph">${esc(s)}</span>`;

/* control helpers — every one carries data-src so the drawer can
   pair what you see with the line it came from */
function btn(o) {
  const c = ['mbtn', o.variant || '', o.color || '', o.size || '', o.full ? 'full' : ''].filter(Boolean).join(' ');
  return `<button class="${c}" ${o.disabled ? 'disabled' : ''} data-act="${esc(o.act || '')}" data-src="${esc(o.src || '')}"${o.key ? ` data-key="${esc(o.key)}"` : ''}>${o.icon ? icon(o.icon, 'sm') : ''}${esc(o.label)}</button>`;
}
function ibtn(o) {
  return `<button class="iconbtn ${o.size || ''} ${o.cls || ''}" aria-label="${esc(o.label)}" ${o.disabled ? 'disabled' : ''} data-act="${esc(o.act || '')}" data-src="${esc(o.src || '')}">${icon(o.icon, o.size === 'sm' ? 'sm' : '')}</button>`;
}
function tbtn(o) {
  const on = S.toggles[o.id] != null ? S.toggles[o.id] : !!o.on;
  return `<button class="tbtn ${o.cls || ''}" role="button" aria-pressed="${on}" data-toggle="${esc(o.id)}" ${o.disabled ? 'disabled' : ''} data-act="${esc(o.act || ('切换 ' + o.label))}" data-src="${esc(o.src || '')}">${o.icon ? icon(o.icon, 'sm') : ''}${esc(o.label)}</button>`;
}
function swrow(o) {
  const on = S.toggles[o.id] != null ? S.toggles[o.id] : !!o.on;

/* shared: PlaybackBar —— 照抄 components/live/PlaybackBar.tsx:107-241
     · 滑杆一行，控件一行，手数就在控件那一行里（真代码 Typography 是
       同一个 flex 容器的最后一个孩子，不是另起一行）
     · 「自动跟进」是无边框 ToggleButton，选中时 success.main（绿），
       **只有 isLive 才渲染**。真代码里只有 LivePage / LiveMatchPage 传
       isLive；ReportsPage、ReportDetailPage 都没传 —— 复盘不是直播，
       没有「最新一手」可跟。
     · 图标：KeyboardDoubleArrowLeft / ChevronLeft / PlayArrow /
       ChevronRight / KeyboardDoubleArrowRight / Sync
     · 首手禁用后退两键，末手禁用前进两键（handleFirst/Prev/Next/Last 的
       disabled 条件）。
   一处刻意不照抄：真代码有个 @container board-rail (max-width:340px) 的
   断点，会把手数换到第二行 —— 320 的右栏必然命中。这里把控件收窄到
   一行装得下（小键 32、播放键 44、间距 2、手数 .78rem），因为「合并成
   一行」是这次的验收条件。 */
function playback(total, cur, src, live) {
  const atStart = cur <= 0, atEnd = cur >= total;
  const on = S.toggles['follow-' + src] != null ? S.toggles['follow-' + src] : true;
  return `<div style="padding:10px 8px 12px">
    <input class="slider" type="range" min="0" max="${total}" value="${cur}" aria-label="手数滑杆" data-act="handleSliderChange → 停自动播放 + setCurrentMove(v)" data-src="${src}" style="margin-bottom:8px">
    <div class="pbrow">
      ${ibtn({ icon: 'KeyboardDoubleArrowLeft', label: '第一手', size: 'sm', disabled: atStart, act: 'handleFirst() → setCurrentMove(0)', src })}
      ${ibtn({ icon: 'ChevronLeft', label: '上一手', size: 'sm', disabled: atStart, act: 'handlePrev() → setCurrentMove(n-1)', src })}
      <button class="iconbtn play" aria-label="播放" data-act="handlePlayPause() —— 1000ms/手；已在末手时先回到第 0 手。暂停态 aria-label 变「暂停」" data-src="${src}">${icon('PlayArrow')}</button>
      ${ibtn({ icon: 'ChevronRight', label: '下一手', size: 'sm', disabled: atEnd, act: 'handleNext() → setCurrentMove(n+1)', src })}
      ${ibtn({ icon: 'KeyboardDoubleArrowRight', label: '最新', size: 'sm', disabled: atEnd, act: 'handleLast() → setCurrentMove(total) 并重新开启自动跟进', src })}
      ${live ? `<button class="syncbtn" role="button" aria-pressed="${on}" aria-label="自动跟进：${on ? '开' : '关'}" data-toggle="follow-${esc(src)}" data-act="setFollowLatest(v => !v)；由关转开时立刻跳到最新一手" data-src="${src}">${icon('Sync', 'sm')}</button>` : ''}
      <span class="mono muted" data-testid="playback-move-counter" style="font-size:.74rem;white-space:nowrap;margin-left:3px">${cur} / ${total} 手</span>
    </div>
  </div>`;
}

/* winrate sparkline — a chart deserves the same care as the type */
function trendChart(w, h, id) {
  const pts = [50, 52, 48, 55, 61, 58, 63, 57, 54, 60, 66, 62, 59, 64, 71, 68, 65, 70, 74, 69, 66, 72, 78, 75, 71, 68, 63, 58, 54.2];
  const n = pts.length, pad = 26;
  const x = i => pad + i * (w - pad - 8) / (n - 1);
  const y = v => h - 18 - (v / 100) * (h - 30);
  const line = pts.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const area = `${line}L${x(n - 1).toFixed(1)},${h - 18}L${pad},${h - 18}Z`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="黑棋胜率趋势，当前 54.2%">
    <defs><linearGradient id="tg${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5d8270" stop-opacity=".38"/><stop offset="100%" stop-color="#5d8270" stop-opacity="0"/>
    </linearGradient></defs>
    ${[25, 50, 75].map(v => `<line x1="${pad}" y1="${y(v)}" x2="${w - 8}" y2="${y(v)}" stroke="rgba(255,255,255,.07)" stroke-width="1"/>`).join('')}
    <line x1="${pad}" y1="${y(50)}" x2="${w - 8}" y2="${y(50)}" stroke="rgba(255,255,255,.16)" stroke-width="1" stroke-dasharray="3 3"/>
    ${[0, 50, 100].map(v => `<text x="${pad - 6}" y="${y(v) + 3}" fill="#4a4845" font-size="9" text-anchor="end">${v}</text>`).join('')}
    <path d="${area}" fill="url(#tg${id})"/>
    <path d="${line}" fill="none" stroke="#5d8270" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="${x(n - 1)}" cy="${y(54.2)}" r="3.4" fill="#f5f3f0" stroke="#5d8270" stroke-width="1.6"/>
    <rect x="${pad}" y="0" width="${w - pad - 8}" height="${h - 14}" fill="transparent"
      data-act="点击折线图按横坐标换算手数 → setCurrentMove" data-src="TrendChart.tsx" role="button" aria-label="点击跳转到该手"/>
  </svg>`;
}

/* ═══ 普通按钮的唯一形态 ═══════════════════════════════════════════
   对局室右栏那八个键（领地/建议/图表/悔棋/停一手/认输/数子/3D）是样板：
   有边框、图标在上、文字在下、四列等宽、彼此挨在一起成一块。
   全站的普通按钮都走这个 helper，形状和尺寸就不会各页各样。

   两类例外，不进格子：
     · 滑轨 —— 只有坐标 / 手数 / 落子特效三样，见 swrow()；
     · 整行按钮 —— 「离开对局」这种破坏性操作，和动作区那条主 CTA。 */
function tgrid(inner, cols) {
  return `<div class="toolgrid" style="display:grid;grid-template-columns:repeat(${cols || 4},1fr);gap:6px">${inner}</div>`;
}
/* 格子里的「按一下就发生一件事」的按钮：和 tbtn 同一个外观，
   但没有按下态（不是开关，所以不写 aria-pressed）。 */
function gbtn(o) {

     读到的是「△图形」这种把装饰和文案粘在一起的串。 */
  return `<button class="tbtn" aria-label="${esc(o.label)}" ${o.disabled ? 'disabled' : ''}${o.dialog ? ` data-dialog="${esc(o.dialog)}"` : ''} data-act="${esc(o.act || '')}" data-src="${esc(o.src || '')}">${o.icon ? icon(o.icon, 'sm') : ''}${esc(o.label)}</button>`;
}

/* 工具格 + 离开。认输 / 数子 直接接弹窗 —— 它们本来就该开弹窗。 */
function toolBlock(o) {

  return `${tgrid(`
      ${t('terr', '领地', 'Map', o.lockAnalysis)}${t('hint', '建议', 'TipsAndUpdates', o.lockAnalysis)}
      ${t('chart', '图表', 'Timeline', o.lockAnalysis)}${t('undo', '悔棋', 'Undo', o.lockAnalysis || o.spectator)}

      ${o.spectator

}

/* 改版契约本身，作为总览页顶部那张卡 */
const CONTRACT2 = [
  ['顶栏', '52', '固定', 'GalaxyTopBar，全站唯一'],

/* ═══════════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════════ */
const CATCOLOR = { 死活: '#5d8270', 手筋: '#5b9bd5', 官子: '#8a7f6d' };
const LADDER = [
  ['15K', '入门', '刚学会规则，先认识「气」和「眼」', 240, [160, 60, 20], 240],

  ['1K', '高级', '冲段前的量，复杂形和收官一起练', 196, [120, 56, 20], 0],
  ['1D', '业余初段', '长手数死活，官子开始计算目数', 164, [100, 48, 16], 0],

  ['7D', '业余顶尖', '古今名局里的极难题', 64, [40, 18, 6], 0],
];
const MY_RANK = '5K';
const MAXTOTAL = Math.max(...LADDER.map(r => r[3]));

V2['tsumego-levels'] = function (b, vp) {
  const withProgress = b === 'ok';
  if (b === 'loading') {
    return { html: `<div data-zone="body">${cph({ title: '死活题' })}

  }
  if (b === 'error') {

  }
  if (b === 'empty') {
    return { html: `<div data-zone="body">${cph({ title: '死活题' })}

  const mobile = vp.id === '430x880';
  const rung = (r) => {
    const [lv, name, sub, total, cats, solved] = r;
    const dan = lv.endsWith('D');
    const me = lv === MY_RANK;
    const pct = total ? Math.round(solved / total * 100) : 0;
    const label = `${lv}${dan ? ' 段' : ' 级'}，${name}，共 ${total} 题`

    return `<button class="lrung ${dan ? 'dan' : ''} ${me ? 'me' : ''}" aria-label="${esc(label)}"
      data-act="导航 /galaxy/tsumego/${lv.toLowerCase()}" data-src="TsumegoLevelsPage.tsx:87"
      ${mobile ? 'style="grid-template-columns:52px 1fr 20px;gap:12px"' : ''}>
      <span class="rung-badge">${lv}</span>
      <span style="min-width:0">
        <span class="rung-name">${name}${me ? ` <em style="font-style:normal;font-size:.68rem;color:var(--jade-l);letter-spacing:.06em;margin-left:6px">你的水平</em>` : ''}</span>
        <span class="rung-sub" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${mobile ? `${total} 题${withProgress ? ` · 已解 ${solved}` : ''}` : sub}</span>
      </span>
      ${mobile ? '' : `
      <span class="rung-barwrap">
        <span class="rung-bar" style="width:${(38 + total / MAXTOTAL * 62).toFixed(1)}%"
          role="img" aria-label="死活 ${cats[0]} 题、手筋 ${cats[1]} 题、官子 ${cats[2]} 题">
          ${['死活', '手筋', '官子'].map((c, i) => `<i style="width:${(cats[i] / total * 100).toFixed(1)}%;background:${CATCOLOR[c]}"></i>`).join('')}
        </span>
      </span>
      <span class="rung-total">${total} 题</span>
      ${withProgress
        ? `<span class="rung-prog"><span class="track"><span class="fill" style="width:${pct}%"></span></span>
             <span class="num${solved ? '' : ' zero'}">${solved ? `<b>${solved}</b>` : '0'} / ${total}${pct === 100 ? ' · 全解' : ''}</span></span>`
        : `<span class="rung-prog"><span class="num zero" style="text-align:center">—</span></span>`}`}
      <span class="chev">${icon('ChevronRight', 'sm')}</span>
    </button>`;
  };

  return {
    html: `<div data-zone="body" style="max-width:960px;margin:0 auto">
      ${cph({ title: '死活题' })}

      ${withProgress ? `<div class="resume" style="margin-top:18px">

      </div>` : `<p class="muted" style="margin:14px 0 0;font-size:.875rem">选择难度级别开始练习。</p>`}

        <span class="sec-label" style="margin:0">全部难度 · 8 档</span>
        ${mobile ? '' : `<span class="legend">

};
(SCREENS.find(s => s.id === 'tsumego-levels') || {}).branches2 = [
  { id: 'ok', label: '主界面（带进度）' },
  { id: 'noprog', label: '不接进度' },

NOTES2['tsumego-levels'] = `<h3>从「八个方块」改成「一条阶梯」</h3>
  <p>现状那 8 张卡之所以显得空，不是因为留白多，是因为<b>每张卡只有一个数字在承担全部信息</b> ——
  把 <code>15K</code> 放到 3rem，剩下的位置就只能靠空白填。而这一页真正的结构被丢掉了：
  15K→7D 是<b>有序的</b>，级位往下数、段位往上数，<code>1K→1D</code> 是围棋里唯一那道坎。
  8 个等价方块把顺序和那道坎一起抹掉了。</p>
  <p>改法：用<b>行</b>不用<b>格</b>。一行一档，段位那一段单独起一节并换一档略暖的底色，
  自己的水平（5K）左侧压一条玉色边、徽章点亮、旁边写「你的水平」。
  级别数字降到 1.05rem 放进 34px 的徽章里 —— 它是<b>标识</b>不是<b>标题</b>。

  <h3>三处细节</h3>
  <ul>
    <li><b>24 枚 chip 收成 8 条分布条。</b>「死活: 160 手筋: 60 官子: 20」× 8 = 24 个小方块，
      读起来是噪声。一行一条三段条，比例一眼可比，图例只在顶部出现一次。
      第三段用的是 <code>#8a7f6d</code> —— 棋盘木色，不另起一套配色。</li>
    <li><b>颜色不是唯一线索。</b>轮次、进度、分布条都同时带文字或数字；
      分布条挂了 <code>role="img"</code> 和完整 aria-label，读屏能听到「死活 160 题、手筋 60 题、官子 20 题」。</li>
    <li><b>「继续练习」放在最上面。</b>回到这一页的人多半不是来重新挑难度的，
      是来接着上次练的。这条带子是主行动，难度阶梯是次行动。</li>
  </ul>
  <h3>⚠ 这一处需要你点头：进度数据要多一次请求</h3>
  <p>进度本身<b>已经存在</b> —— <code>TsumegoProgressContext</code> 里是一张
  <code>problem_id → {completed, attempts, lastAttemptAt}</code> 的表，单元页就是这么算
  <code>x/y</code> 的（<code>TsumegoUnitsPage.tsx:128</code>）。但 <code>/api/v1/tsumego/levels</code>
  只回 <code>{level, categories, total}</code>，<b>不带题目 id</b>，所以难度页要显示「已解 96/288」，
  必须能按难度拿到 id 列表 —— 要么加一个聚合端点，要么按难度查一次题目列表。
  这是本轮唯一会碰到后端契约的地方。</p>
  <p>所以这一屏给了两个分支：<b>主界面（带进度）</b>和<b>不接进度</b>。

  切过去对比一下，值不值得为那一列加个端点，你定。</p>`;

<script>
/* ═══════════════════════════════════════════════════════════════
   Chrome renderers — GalaxyTopBar / GalaxySidebar / GalaxyBottomNav
   ═══════════════════════════════════════════════════════════════ */
const NAV = [
  { key: 'home', label: '首页', path: '/galaxy', icon: 'Home' },
  { key: 'play', label: '对局', path: '/galaxy/play', icon: 'SportsEsports' },
  { key: 'research', label: '研究', path: '/galaxy/research', icon: 'Science' },
  { key: 'tsumego', label: '死活题', path: '/galaxy/tsumego', icon: 'Extension' },
  { key: 'review', label: '复盘', path: '/galaxy/report', icon: 'Assessment' },
  { key: 'live', label: '直播', path: '/galaxy/live', icon: 'LiveTv' },
  { key: 'kifu', label: '棋谱库', path: '/galaxy/kifu', icon: 'LibraryBooks' },
  { key: 'tutorials', label: '教程', path: '/galaxy/tutorials', icon: 'MenuBook' },
];

function topbar(vp) {
  /* 改版：左栏折叠钮不再悬在棋盘上。左栏已经停靠时根本不需要折叠
     （1440 下棋盘是高度受限，收起左栏一个像素都不多），只有左栏
     收起了的档位才需要一个入口，放在顶栏左侧。 */
  const needMenu = S.mode === 'new' && vp && vp.sidebar === 0 && vp.id !== '430x880';
  return `<header class="topbar" data-zone="top-bar">
    ${needMenu ? ibtn({ icon: 'Menu', label: '展开导航', act: '展开左侧导航（覆盖式）', src: 'GalaxyTopBar.tsx' }) : ''}
    <button class="brand" aria-label="回到首页" data-act="导航 /galaxy" data-src="GalaxyTopBar.tsx:30">
      <img src="${LOGO}" alt="智星盒 StellaBox">
      <span class="brand-cn">智星盒</span><span class="brand-latin">StellaBox</span>
    </button>
  </header>`;
}

function sidebar(active) {
  return `<nav class="sidebar" data-zone="sidebar" aria-label="主导航">
    <ul class="sidenav">
      ${NAV.map(n => `<li><button class="navitem" ${n.key === active ? 'aria-current="page"' : ''}
        data-act="导航 ${n.path}" data-src="GalaxySidebar.tsx:73">${icon(n.icon)}<span>${n.label}</span></button></li>`).join('')}
    </ul>
    <div class="side-foot">
      <button class="navitem" data-act="打开设置菜单（语言）" data-src="GalaxySidebar.tsx:90">${icon('Settings')}<span>设置</span></button>
      <div class="usercard">
        <div class="avatar">5k</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:.85rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">fan</div>
          <div style="font-size:.72rem;color:var(--jade-l);font-weight:600">5k</div>
        </div>
        ${ibtn({ icon: 'Logout', label: '退出登录', size: 'sm', act: '退出登录', src: 'GalaxySidebar.tsx:119' })}
      </div>
    </div>
  </nav>`;
}

function bottomnav(active) {
  const direct = NAV.slice(0, 5);
  return `<nav class="bottomnav" data-zone="bottom-nav" aria-label="主导航">
    ${direct.map(n => `<button ${n.key === active ? 'aria-current="page"' : ''} aria-label="${n.label}"
      data-act="导航 ${n.path}" data-src="GalaxyBottomNav.tsx:46">${icon(n.icon)}<span>${n.label}</span></button>`).join('')}
    <button aria-label="更多" data-act="打开更多菜单（棋谱库 / 教程）" data-src="GalaxyBottomNav.tsx:54">${icon('MoreHoriz')}<span>更多</span></button>
  </nav>`;
}

/* ═══════════════════════════════════════════════════════════════
   Frame assembly
   ═══════════════════════════════════════════════════════════════ */
function currentScreen() { return SCREENS.find(s => s.id === S.screen) || SCREENS[0]; }
function branchesOf(sc) {
  return (S.mode === 'new' && sc.branches2) ? sc.branches2 : (sc.branches || [{ id: 'default', label: '默认' }]);
}
function currentBranch(sc) {
  const bs = branchesOf(sc);
  return bs.find(b => b.id === S.branch) || bs[0];
}

function renderFrame() {
  const sc = currentScreen();
  const br = currentBranch(sc);
  const vp = VPS.find(v => v.id === S.vp);
  const mobile = vp.id === '430x880';
  /* 改版模式：有 V2 实现就用 V2，并强制走 BoardPageShell 那条路 */
  const useV2 = S.mode === 'new' && typeof V2 !== 'undefined' && V2[sc.id];
  const out = (useV2 ? V2[sc.id](br.id, vp) : sc.render(br.id, vp)) || {};
  const asBoard = useV2 ? (out.html == null) : sc.kind === 'board';

  let body;
  if (asBoard && !out.raw) {
    const stageInner = out.stage != null
      ? out.stage
      : (out.board == null
        ? ''
        : `<canvas class="boardcv" data-floor="${(out.board && out.board.floor) || 0}" data-board='${esc(JSON.stringify(out.board || {}))}'></canvas>`);
    body = `<div class="shell" data-zone="board-shell">
      <div class="stage-box${out.stage != null ? ' custom' : ''}" data-zone="board" style="position:relative">${stageInner}${out.stageOverlay || ''}</div>
      <aside class="rail">
        <div class="rail-module">${out.plate || ''}</div>
        <div class="rail-scroll" data-zone="right-rail-middle">${out.railBody || ''}${out.controls || ''}</div>
        <div class="rail-actions" data-zone="right-rail-actions">${out.actions || ''}</div>
      </aside>
    </div>`;
  } else {
    body = out.raw != null ? out.raw : `<div class="content"><div class="content-inner">${out.html || ''}</div></div>`;
  }

  const dialogs = ((sc.dialogs && S.dialog) ? (sc.dialogs[S.dialog] || '') : '') || out.scrim || '';
  const app = $('#app');
  app.dataset.vp = vp.id;
  app.dataset.mode = S.mode;
  app.style.width = vp.w + 'px';
  app.style.height = vp.h + 'px';
  app.innerHTML = topbar(vp) + `<div class="row">
      ${mobile ? '' : sidebar(sc.nav)}
      ${mobile || vp.sidebar === 0 && false ? '' : ''}
      <main class="main">${body}</main>
      ${mobile || S.mode === 'new' ? '' : `<button class="sidebar-toggle" aria-label="${vp.sidebar ? '收起导航' : '展开导航'}" aria-expanded="${vp.sidebar > 0}" data-act="${vp.sidebar ? '收起左侧导航' : '展开左侧导航（覆盖式）'}" data-src="GalaxySidebar.tsx:158">${icon(vp.sidebar ? 'ChevronLeft' : 'Menu')}</button>`}
    </div>` + (mobile ? bottomnav(sc.nav) : '') +
    (out.snack || '') +
    (S.snack ? `<div class="snack ${S.snack.kind} ${S.snack.pos || 'bottom'}">${esc(S.snack.text)}</div>` : '') +
    (dialogs ? `<div class="scrim" data-scrim="1">${dialogs}</div>` : '');

  scaleFrame(vp);
  paintBoards();
  readout(vp);
  buildDrawer(sc, br);
}

function scaleFrame(vp) {
  const wrap = $('#frameWrap');
  const avail = $('.stagecol').clientWidth - 44;
  const availH = window.innerHeight - 52 - 92;
  const k = Math.min(1, avail / vp.w, availH / vp.h);
  const app = $('#app');
  app.style.transform = `scale(${k})`;
  wrap.style.width = (vp.w * k) + 'px';
  wrap.style.height = (vp.h * k) + 'px';
  $('#scaleNote').textContent =
    (vp.stress ? '压扁档 · 不是验收视口，用来把右栏中段压到必须滚　' : '') +
    (k < .995 ? `显示缩放 ${(k * 100).toFixed(0)}%（几何按 ${vp.w}×${vp.h} 计算）` : '1:1');
}

function paintBoards() {
  $$('.boardcv').forEach(cv => {
    /* clientWidth/Height are layout px (a CSS transform does not change them)
       and include padding. Stage padding is 6px a side (BoardPageShell.tsx:82),
       then the board component subtracts its own 4px a side — the `-8` in
       LiveBoard.tsx:366. Same arithmetic, same result. */
    const st = cv.parentElement;
    const cw = st.clientWidth - 12, ch = st.clientHeight - 12;
    const edge = Math.floor(Math.min(cw, ch)) - 8;
    /* Each board component hard-codes its own floor and cap:
         LiveBoard        Math.max(minimumCanvasSize=400, min(1200, size))   LiveBoard.tsx:367
         Board (legacy)   Math.max(200, min(1200, size))                     Board.tsx:100
         TsumegoBoard     Math.max(400, min(1200, size))                     TsumegoBoard.tsx:93
       LiveMatchPage is the only caller that passes minimumCanvasSize={0}.
       Below the floor the board overflows its column instead of shrinking. */
    const floor = Number(cv.dataset.floor || 0);
    const px = Math.min(1200, Math.max(floor, Math.max(8, edge)));
    cv.width = px; cv.height = px;
    cv.style.width = px + 'px'; cv.style.height = px + 'px';
    cv.style.borderRadius = '2px';
    cv.dataset.edge = px;
    drawBoard(cv, JSON.parse(cv.dataset.board || '{}'));
  });
}

/* The readout the acceptance gate actually measures. Targets are the
   numbers the approved live template hit at each viewport, recorded in
   visual/live-template/geometry-implementation.json. A legacy page is
   compared against the same targets on purpose — the gap IS the finding. */
function readout(vp) {
  const cv = $('.boardcv');
  const rail = $('.rail') || $('.lrail');
  const sb = $('.sidebar');
  const tb = $('.topbar');
  const k = getScale();
  const set = (id, val, want) => {
    const el = $('#' + id); if (!el) return;
    const dd = el.querySelector('dd');
    if (val == null) { dd.textContent = '—'; dd.classList.remove('miss'); return; }
    const off = want != null && Math.abs(val - want) > 1;
    dd.textContent = off ? `${val} (${val > want ? '+' : ''}${val - want})` : String(val);
    dd.classList.toggle('miss', off);
  };
  set('roTop', tb ? Math.round(tb.getBoundingClientRect().height / k) : null, 52);
  set('roSide', sb ? Math.round(sb.getBoundingClientRect().width / k) : 0, vp.sidebar);
  const railWant = S.mode === 'new' ? (vp.id === '430x880' ? null : RAIL2) : vp.rail;
  set('roRail', rail ? Math.round(rail.getBoundingClientRect().width / k) : null, railWant);
  set('roBoard', cv ? Number(cv.dataset.edge) : null, currentScreen().noBoardTarget ? null : vp.board);
}

function buildDrawer(sc, br) {
  const nodes = $$('#app [data-act], #app [data-toggle], #app [data-dialog], #app input, #app select');
  const rows = nodes.map(n => {
    const zoneEl = n.closest('[data-zone]');
    const zone = zoneEl ? zoneEl.dataset.zone : 'body';
    const label = (n.getAttribute('aria-label') || n.textContent || n.placeholder || n.getAttribute('data-act') || '').trim() || '（无标签）';
    const kind = n.classList.contains('sw') ? 'switch'
      : n.hasAttribute('aria-pressed') ? 'toggle'
      : n.classList.contains('iconbtn') ? 'icon-button'
      : n.classList.contains('card') ? 'card'
      : n.tagName === 'INPUT' ? (n.type === 'range' ? 'slider' : 'text-field')
      : n.tagName === 'SELECT' ? 'select' : 'button';
    return { label, zone, kind, src: n.dataset.src || '', act: n.dataset.act || '', el: n };
  });
  const byZone = {};
  rows.forEach((r, i) => { r.i = i; (byZone[r.zone] = byZone[r.zone] || []).push(r); });

  $('#ctlCount').textContent = rows.length;

}

                它是真的被 12 视口验收过的那一个，而且在 320 宽下一个图标只花 40px，
                文字返回键要花 110px，全是从标题那行抢的。要改成后者只需换 <code style="font-family:var(--mono);color:var(--jade-l)">plate2()</code> 一处。</li>
            <li><b>根级页面的模块牌没有返回键</b>。研究 / 棋谱库 / 直播 / 复盘都是左栏一级入口，没有上一级。
                这需要 <code style="font-family:var(--mono);color:var(--jade-l)">ModulePlate</code> 支持「只有标题」的形态
                （<code style="font-family:var(--mono);color:var(--jade-l)">ContentPageHeader</code> 也有同样的缺口 —— 首页现在必须传 parent）。</li>
            <li><b>教程 · 变化图没有硬套</b>。它是内部制作工具，原书页图必须和棋盘并排。
                做法是右栏照旧 320，原书页图做成 stage 里可收起的对照层。切过去看一眼，这处最需要你的判断。</li>
          </ol>
        </div>
      </div>`,
    };
  },
  note: '',
});

</script>

<script>
/* ═══════════════════════════════════════════════════════════════
   Console + interaction wiring
   ═══════════════════════════════════════════════════════════════ */
function buildPicker() {
  const groups = [];
  SCREENS.forEach(s => {
    let g = groups.find(x => x.name === s.group);
    if (!g) groups.push(g = { name: s.group, items: [] });
    g.items.push(s);
  });
  $('#pick').innerHTML = groups.map(g =>
    `<optgroup label="${esc(g.name)}">${g.items.map(s =>
      `<option value="${esc(s.id)}">${esc(s.label)}</option>`).join('')}</optgroup>`).join('');
  $('#pick').value = S.screen;
}

function buildBranches() {
  const sc = currentScreen();
  const bs = branchesOf(sc);
  $('#branchWrap').style.display = bs.length > 1 ? '' : 'none';
  $('#branches').innerHTML = bs.map(b =>
    `<button data-branch="${esc(b.id)}" aria-pressed="${b.id === currentBranch(sc).id}">${esc(b.label)}</button>`).join('');
}

function buildModes() {
  $$('#modes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === S.mode)));
  const f = $('#modeFlag');
  f.textContent = S.mode === 'new' ? '统一版式：顶栏 52 / 左栏 216 / 右栏 320 / 棋盘吃满中间' : '照搬今天的代码';
  f.classList.toggle('now', S.mode !== 'new');
}

function buildDialogs() {
  const sc = currentScreen();
  const ds = sc.dialogs ? Object.keys(sc.dialogs) : [];
  $('#dlgWrap').style.display = ds.length ? '' : 'none';
  const CN = {
    leave: '离开对局', resign: '认输', count: '数子', countreq: '数子请求', end: '对局结束',
    result: '终局结果', del: '确认删除', imp: '导入棋谱', local: '本地导入 SGF',
    openmenu: '打开菜单', savemenu: '保存菜单', pass: '停一手', shape: '图形菜单',
    displace: '顶替确认', library: '棋谱库',
  };
  $('#dlgs').innerHTML = `<button data-dlg="" aria-pressed="${!S.dialog}">无</button>` +
    ds.map(d => `<button data-dlg="${esc(d)}" aria-pressed="${S.dialog === d}">${esc(CN[d] || d)}</button>`).join('');
}

function buildVps() {
  $('#vps').innerHTML = VPS.map(v =>
    `<button data-vp="${esc(v.id)}" aria-pressed="${v.id === S.vp}">${esc(v.label)}</button>`).join('');
}

function pushLog(label, act, src) {
  const t = new Date();
  S.log.unshift({
    time: `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}:${String(t.getSeconds()).padStart(2, '0')}`,
    label, act, src,
  });
  S.log = S.log.slice(0, 60);
  $('#logCount').textContent = S.log.length;
  $('#logList').innerHTML = S.log.map(e =>
    `<li><span class="t">${esc(e.time)}</span><span class="a">${esc(e.label)}<em>→ ${esc(e.act || '（无动作）')}${e.src ? ' · ' + esc(e.src) : ''}</em></span></li>`).join('')
    || '<li class="empty">还没有点击。</li>';
}

function go(id, branch) {
  S.screen = id;
  S.dialog = null; S.snack = null;
  const sc = currentScreen();
  S.branch = branch || (sc.branches && sc.branches[0] ? sc.branches[0].id : 'default');
  $('#pick').value = id;
  buildBranches();
  buildDialogs();
  render();
}

function render() {
  const sc = currentScreen();
  $('#capRoute').textContent = sc.route;
  const n2 = (S.mode === 'new' && typeof NOTES2 !== 'undefined') ? NOTES2[sc.id] : null;
  $('#footnote').innerHTML = n2 || sc.note || '';
  renderFrame();
}

/* ── global click delegation ─────────────────────────────────── */
document.addEventListener('click', (ev) => {
  const t = ev.target;

  const seg = t.closest('#branches button');
  if (seg) { S.branch = seg.dataset.branch; S.dialog = null; buildBranches(); buildDialogs(); render(); return; }

  const db = t.closest('#dlgs button');
  if (db) { S.dialog = db.dataset.dlg || null; buildDialogs(); render(); return; }

  const mb = t.closest('#modes button');
  if (mb) {
    S.mode = mb.dataset.mode; S.dialog = null;
    const bs = branchesOf(currentScreen());
    if (!bs.some(x => x.id === S.branch)) S.branch = bs[0].id;
    buildModes(); buildBranches(); buildDialogs(); render(); return;
  }

  const sb2 = t.closest('#stress button');
  if (sb2) { S.stress = !S.stress; sb2.setAttribute('aria-pressed', String(S.stress)); render(); return; }

  const vb = t.closest('#vps button');
  if (vb) { S.vp = vb.dataset.vp; buildVps(); render(); return; }

  const crow = t.closest('.crow');
  if (crow) {
    const r = (window.__rows || [])[Number(crow.dataset.i)];
    if (r && r.el) {
      r.el.classList.remove('flash'); void r.el.offsetWidth; r.el.classList.add('flash');
      r.el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
    return;
  }

  if (t.closest('#app')) {
    const node = t.closest('[data-act],[data-toggle],[data-dialog],[data-goto],[data-close]');
    if (!node) return;

    if (node.hasAttribute('data-close')) { S.dialog = null; render(); return; }

    const label = (node.getAttribute('aria-label') || node.textContent || '').trim() || '（无标签）';
    pushLog(label, node.dataset.act || '', node.dataset.src || '');

    if (node.dataset.toggle) {
      const k = node.dataset.toggle;
      S.toggles[k] = !(S.toggles[k] != null ? S.toggles[k] : node.getAttribute('aria-pressed') === 'true' || node.getAttribute('aria-checked') === 'true');
      render(); return;
    }
    if (node.dataset.dialog) { S.dialog = node.dataset.dialog; buildDialogs(); render(); return; }
    if (node.dataset.goto) { const [id, b] = node.dataset.goto.split('#'); go(id, b); return; }
    return;
  }
}, false);

document.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.id === 'pick') { go(t.value); return; }
  if (t.closest('#app')) {
    const label = (t.getAttribute('aria-label') || t.previousElementSibling?.textContent || t.name || '输入').trim();
    pushLog(label, (t.dataset.act || '') + ' = ' + t.value, t.dataset.src || '');
  }
});

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && S.dialog) { S.dialog = null; buildDialogs(); render(); }
});

let rz;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 120); });

/* ── boot ────────────────────────────────────────────────────── */
S.screen = SCREENS[1].id;
S.branch = SCREENS[1].branches ? SCREENS[1].branches[0].id : 'default';
buildPicker(); buildVps(); buildModes();
measureAll();                       /* fills the overview table from real layout */
S.screen = SCREENS[0].id; S.branch = 'default';
$('#pick').value = S.screen;
buildBranches(); buildDialogs(); render();
$('#logCount').textContent = 0;

</script>
